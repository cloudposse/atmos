# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "Maintain a conversational spartan tone that is supportive in all responses."
early_access: true
enable_free_tier: true
reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: "@auto-summary"
  auto_title_placeholder: "@auto-title"
  review_status: false
  commit_status: false
  poem: false
  collapse_walkthrough: true
  sequence_diagrams: true
  changed_files_summary: true
  labeling_instructions:
    - label: "patch"
      instructions: "Apply when the PR fixes existing user-facing Atmos application functionality, performance, or errors. Internal CI/build/release tooling fixes use no-release when application behavior is unchanged."
    - label: "minor"
      instructions: "Apply when changes introduce new user-facing Atmos application functionality that is non-breaking. Internal build or release capabilities alone use no-release."
    - label: "major"
      instructions: >-
        Apply only for an incompatible change to Atmos's public application contract,
        such as removing or renaming a CLI command or flag, changing configuration
        schemas, or reversing existing CLI semantics. Identify the exact contract
        and required migration before recommending major. CI, runner images,
        dependency major versions, release tooling, and retiring prebuilt binary
        or package targets do not by themselves justify an Atmos major release.
        Do not infer a major release from a migration notice or changelog tag.
    - label: "no-release"
      instructions: >-
        Apply when changes affect documentation, website content, CI, runner images,
        release tooling, or prebuilt distribution targets without changing Atmos's
        public application behavior. This includes Go code in Mage/build/release
        tooling and retiring prebuilt downloads while retaining installation from
        source. A user-facing distribution announcement does not require a major
        label. Classify by application impact, not file extension, and select
        exactly one release label for the PR.
  #path_filters:
  #  - "!dist/**"
  #  - "src/**"
  path_instructions:
    - path: "**/*"
      instructions: >-
        Review release classification against .claude/skills/pull-request/SKILL.md.
        Flag a major label or major-milestone requirement that is justified only by
        CI, build, packaging, runner, or prebuilt-download changes. Reserve major
        for an identified incompatible public application contract. Do not propose
        Atmos 2.0 or create a major milestone from such infrastructure changes;
        release versions come from maintainer-selected milestones.
    - path: "internal/exec/**/*.go"
      instructions: |
        Treat internal/exec as a legacy package that we are actively downsizing,
        not a place to keep investing in domain functionality. When a change
        touches this package, look for a practical extraction of the affected
        behavior into its owning package elsewhere in the repository, usually
        an existing focused package under pkg/. Apply this to fixes and changes
        to existing logic as well as new features and helpers. Ask for a scoped
        refactor when the PR adds to or substantially reworks domain logic here
        without moving it toward the owning package. Move the corresponding
        unit tests with the implementation. Leave only thin orchestration or
        compatibility adapters where still needed, using interfaces or dependency
        injection to avoid import cycles. Prefer incremental extractions tied to
        the current change; do not demand an unrelated rewrite of the package.
    - path: "pkg/utils/**/*.go"
      instructions: |
        Treat pkg/utils as a legacy catch-all to shrink, not a default home for
        shared code. When a change touches this package, look for a practical
        extraction of the affected behavior and its unit tests into the focused
        package that owns the responsibility. Apply this to fixes and changes to
        existing helpers as well as new functionality. Ask for a scoped refactor
        when a PR adds unrelated helpers or substantially reworks domain logic
        here without moving it toward the owning package. Genuinely shared code
        should live in a purpose-built package with a clear responsibility, not
        another generic utils or helpers package. Keep necessary compatibility
        adapters thin and avoid unrelated wholesale migrations.
  abort_on_close: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "test"
    #labels:
    #  - "ready-for-review"
    drafts: false
    # Review stacked PRs regardless of the intermediate base branch name.
    base_branches:
      - ".*"
  tools:
    ast-grep:
      essential_rules: true
      packages:
        - "javascript"
        - "typescript"
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 900000
    languagetool:
      enabled: true
      enabled_rules:
        - "EN_QUOTES"
      level: "picky"
    biome:
      enabled: true
    hadolint:
      enabled: true
    swiftlint:
      enabled: false
      config_file: ".swiftlint.yml"
    phpstan:
      enabled: true
      level: "max"
    golangci-lint:
      enabled: true
      config_file: ".golangci.yaml"
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    checkov:
      enabled: true
    detekt:
      enabled: false
      config_file: "detekt.yml"
    eslint:
      enabled: true
    rubocop:
      enabled: false
    buf:
      enabled: true
    regal:
      enabled: true
    actionlint:
      enabled: true
    pmd:
      enabled: false
      config_file: "pmd.xml"
    cppcheck:
      enabled: false
    semgrep:
      enabled: false
      config_file: ".semgrep.yaml"
    circleci:
      enabled: false
chat:
  auto_reply: true
knowledge_base:
  opt_out: false
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
  linear:
    team_keys:
      - "DEV"
  pull_requests:
    scope: "auto"
