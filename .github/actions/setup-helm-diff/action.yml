name: Set up Helm Diff
description: Prepare Helm Diff once per platform, then restore an isolated copy in each consumer job.

inputs:
  mode:
    description: 'prepare installs and uploads; restore downloads and verifies without running install hooks.'
    required: false
    default: restore
  target:
    description: 'Build platform (linux, macos, or windows).'
    required: true
  version:
    description: 'Pinned Helm Diff version, including the v prefix.'
    required: true

runs:
  using: composite
  steps:
    - name: Download the prepared plugin
      if: inputs.mode == 'restore'
      uses: ./.github/actions/download-artifact-retry
      with:
        name: helm-diff-${{ inputs.target }}-${{ inputs.version }}
        path: ${{ runner.temp }}/helm-diff-artifact

    - name: Prepare or restore Helm Diff
      shell: bash
      env:
        HELM_DIFF_MODE: ${{ inputs.mode }}
        HELM_DIFF_VERSION: ${{ inputs.version }}
        HELM_DIFF_ARCHIVE: ${{ runner.temp }}/helm-diff-artifact/plugin.tar.gz
        HELM_DIFF_ACTION_PATH: ${{ github.action_path }}
      run: bash "$HELM_DIFF_ACTION_PATH/helm-diff.sh" "$HELM_DIFF_MODE" "$HELM_DIFF_VERSION" "$HELM_DIFF_ARCHIVE"

    - name: Upload the prepared plugin
      if: inputs.mode == 'prepare'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: helm-diff-${{ inputs.target }}-${{ inputs.version }}
        path: ${{ runner.temp }}/helm-diff-artifact/plugin.tar.gz
        if-no-files-found: error
        retention-days: 7
        overwrite: true
