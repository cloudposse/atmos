name: Quality Gate
description: Run the tested Mage quality reporter for the current PR or a repository-wide true-up.
inputs:
  operation:
    description: report (event PRs), reportPR (explicit pr-number), or reconcile (repository-wide true-up).
    required: true
  github-token:
    description: GitHub Actions token with the reporter's read and comment/label permissions.
    required: true
  pr-number:
    description: Required positive PR number for operation reportPR; ignores the triggering event.
    default: ''
runs:
  using: composite
  steps:
    - name: Set up Go and restore build cache
      uses: ./.github/actions/setup-go-cache
    - name: Reconcile current-head quality gates
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        QUALITY_OPERATION: ${{ inputs.operation }}
        QUALITY_PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        if [ "$QUALITY_OPERATION" = reportPR ]; then
          go tool mage quality:reportPR "$GITHUB_REPOSITORY" "$QUALITY_PR_NUMBER"
          go tool mage quality:status "$GITHUB_REPOSITORY" "$QUALITY_PR_NUMBER" > "$RUNNER_TEMP/quality-result.json"
        else
          go tool mage "quality:$QUALITY_OPERATION" "$GITHUB_REPOSITORY"
        fi
    - name: Save single-PR quality result
      if: success() && inputs.operation == 'reportPR'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: quality-result-${{ inputs.pr-number }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/quality-result.json
        retention-days: 7
        if-no-files-found: error
    - name: Save recovered benchmark comparisons
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: quality-gate-reports-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/benchmarks/report/
        retention-days: 90
        if-no-files-found: ignore
