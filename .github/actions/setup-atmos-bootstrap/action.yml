name: "Set up pinned Atmos bootstrap"
description: "Installs a checksum-verified release binary without using GitHub's release-list API"

inputs:
  atmos-version:
    description: "Exact Atmos release version used to bootstrap repository-local build commands"
    required: true

runs:
  using: composite
  steps:
    - name: Install pinned Atmos release
      shell: bash
      env:
        ATMOS_BOOTSTRAP_VERSION: ${{ inputs.atmos-version }}
      run: node "$GITHUB_ACTION_PATH/../../scripts/install-atmos-bootstrap.mjs"
