name: Cache perf lab step sequence
description: >-
  The shared step sequence of the Windows cache-perf lab (.github/workflows/cache-perf.yml):
  optionally relocate Go's caches to D:, pick which tar @actions/cache will use, run
  actions/setup-go with caching under a per-layout key, then either populate the caches
  (mode: seed - setup-go's post step saves them) or assert a real cache hit and report how long
  the restore took (mode: restore).

inputs:
  mode:
    description: "seed: populate the caches for setup-go's post step to save. restore: time the restore and assert a hit."
    required: true
  layout:
    description: "c: plain setup-go, Go's default cache locations (on C:). d: the production setup-go-cache action, which relocates GOCACHE and GOMODCACHE onto the runner's work disk (D:)."
    required: true
  tar:
    description: >-
      gnu: what test.yml does today - Git's usr\bin first on PATH, so @actions/cache uses MSYS GNU
      tar. bsd: Git's tar.exe is renamed aside for this job and C:\Windows\System32 goes first on
      PATH, so @actions/cache's hardcoded %PROGRAMFILES%\Git\usr\bin\tar.exe check fails and its
      PATH lookup finds Windows' native bsdtar. (A step-level PROGRAMFILES override does not work:
      the runner keeps the process's own ProgramFiles value, verified in run 2.) Same archive, same
      key either way.
    required: true
  config:
    description: Label for the timing row (restore mode).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Use GNU tar (production behavior)
      if: inputs.tar == 'gnu'
      shell: pwsh
      run: echo "$env:ProgramFiles\Git\usr\bin" >> $Env:GITHUB_PATH

    # Nothing else in this job needs Git's tar: checkout drives git.exe, and
    # `tar` on PATH still resolves - to System32's bsdtar.
    - name: Use bsdtar (rename Git's GNU tar aside)
      if: inputs.tar == 'bsd'
      shell: pwsh
      run: |
        Rename-Item -Path "$env:ProgramFiles\Git\usr\bin\tar.exe" -NewName tar.exe.disabled
        echo 'C:\Windows\System32' >> $Env:GITHUB_PATH

    # Hashed into setup-go's cache key (cache-dependency-path below) so each
    # layout has its own key rather than sharing go.sum's.
    - name: Write the cache layout marker
      shell: pwsh
      env:
        LAYOUT: ${{ inputs.layout }}
      run: Set-Content -Path .cache-layout -Value $env:LAYOUT -NoNewline

    # Mirrors @actions/cache's own selection: the hardcoded Git path if it
    # exists, else whatever `tar --version` on PATH reports.
    - name: Show which tar the cache step will use
      shell: pwsh
      run: |
        Write-Host "Git's tar.exe present: $(Test-Path "$env:ProgramFiles\Git\usr\bin\tar.exe")"
        Write-Host "first tar on PATH:     $((Get-Command tar.exe).Source)"
        Write-Host "tar --version:         $((tar --version | Select-Object -First 1))"

    # The jobs API only lists a job's top-level steps, so a nested step's
    # duration is measured here instead: wall clock around setup-go.
    - name: Start the restore timer
      shell: pwsh
      run: Add-Content $env:GITHUB_ENV "LAB_T0=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())"

    # Layout d is exactly what production runs: the setup-go-cache action,
    # which relocates Go's caches to the runner's work disk on Windows.
    - name: Set up Go (timed cache restore, production action)
      id: go-prod
      if: inputs.layout == 'd'
      uses: ./.github/actions/setup-go-cache
      with:
        cache-dependency-path: |
          go.sum
          .cache-layout

    # Layout c is the pre-fix baseline: plain setup-go, Go's default cache
    # locations on C:.
    - name: Set up Go (timed cache restore, baseline)
      id: go-base
      if: inputs.layout == 'c'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: "go.mod"
        cache: true
        cache-dependency-path: |
          go.sum
          .cache-layout

    - name: Stop the restore timer
      shell: pwsh
      run: Add-Content $env:GITHUB_ENV "LAB_RESTORE_SECS=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [int64]$env:LAB_T0)"

    - name: Populate the module and build caches (seed)
      if: inputs.mode == 'seed'
      shell: pwsh
      env:
        CACHE_HIT: ${{ steps.go-prod.outputs.cache-hit || steps.go-base.outputs.cache-hit }}
      run: |
        Write-Host "setup-go cache-hit=$env:CACHE_HIT (a hit means this layout is already seeded; setup-go will not save again)"
        Write-Host "GOCACHE=$(go env GOCACHE)  GOMODCACHE=$(go env GOMODCACHE)"
        go mod download
        go build ./...

    - name: Assert the restore was a real cache hit (restore)
      if: inputs.mode == 'restore'
      shell: pwsh
      env:
        CACHE_HIT: ${{ steps.go-prod.outputs.cache-hit || steps.go-base.outputs.cache-hit }}
      run: |
        if ($env:CACHE_HIT -ne 'true') {
          throw "setup-go reported cache-hit='$env:CACHE_HIT'; a miss would time a no-op, not a restore. The seed job for this layout saved an archive seconds ago - if it is already gone, the repo cache quota evicted it."
        }

    - name: Report timing to the step summary (restore)
      if: inputs.mode == 'restore'
      shell: pwsh
      env:
        CONFIG: ${{ inputs.config }}
        LAYOUT: ${{ inputs.layout }}
        TAR: ${{ inputs.tar }}
      run: |
        Write-Host "Set up Go (timed cache restore): $env:LAB_RESTORE_SECS s"
        Add-Content $env:GITHUB_STEP_SUMMARY "### Cache restore timing`n`n| config | layout | tar | GOCACHE | Set up Go (restore) |`n|---|---|---|---|---|`n| $env:CONFIG | $env:LAYOUT | $env:TAR ($((tar --version | Select-Object -First 1))) | $(go env GOCACHE) | $env:LAB_RESTORE_SECS s |"
