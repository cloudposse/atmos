name: Draft release notes
description: Create notes-only drafts; publication requires the separate guarded release action.
inputs:
  app-id:
    description: Release bot GitHub App ID.
    required: true
  app-private-key:
    description: Release bot GitHub App private key.
    required: true
  prerelease:
    description: Whether to draft a nightly or feature prerelease.
    default: 'false'
outputs:
  id:
    description: Draft release ID.
    value: ${{ steps.drafter.outputs.id }}
  exists:
    description: Whether the tag already exists.
    value: ${{ steps.drafter.outputs.exists }}
runs:
  using: composite
  steps:
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: github-app
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}

    - name: Context
      id: context
      uses: cloudposse/github-action-yaml-config-query@9ac217bcc3e90df15bc14c7ce41606ba84ddf6a8 # 0.1.4
      with:
        query: .${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}.${{ inputs.prerelease }}
        config: |-
          # Is default branch
          true:
            # Is prerelease (nightly builds)
            true:
              config: auto-pre-release.yml
              latest: false
            # Is regular release
            false:
              config: auto-release.yml
              latest: true
          # Is hotfix branch
          false:
            # Is prerelease (nightly builds)
            # pre releases from `non default` branch are `feature` releases
            true:
              config: auto-feature-release.yml
              latest: false
            # Is a regular release
            false:
              config: auto-release-hotfix.yml
              latest: false

    # Drafts your next Release notes as Pull Requests are merged into "main"
    - uses: cloudposse/github-action-auto-release@8f9b7192d095af697c5900235e4aecf930663f28 # v4.0.1
      id: drafter
      with:
        token: ${{ steps.github-app.outputs.token }}
        publish: 'false'
        prerelease: ${{ inputs.prerelease }}
        latest: ${{ steps.context.outputs.latest }}
        summary-enabled: 'true'
        config-name: ${{ steps.context.outputs.config }}
