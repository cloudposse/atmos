name: 'PR Size Labeler'
description: 'Label PRs based on the number of lines changed'
inputs:
  xs_label:
    description: 'Label for extra small PRs'
    required: false
    default: 'size/xs'
  xs_max_size:
    description: 'Maximum number of lines changed for XS'
    required: false
    default: '10'
  s_label:
    description: 'Label for small PRs'
    required: false
    default: 'size/s'
  s_max_size:
    description: 'Maximum number of lines changed for S'
    required: false
    default: '100'
  m_label:
    description: 'Label for medium PRs'
    required: false
    default: 'size/m'
  m_max_size:
    description: 'Maximum number of lines changed for M'
    required: false
    default: '500'
  l_label:
    description: 'Label for large PRs'
    required: false
    default: 'size/l'
  l_max_size:
    description: 'Maximum number of lines changed for L'
    required: false
    default: '1000'
  xl_label:
    description: 'Label for extra large PRs'
    required: false
    default: 'size/xl'
  xl_max_size:
    description: 'Maximum number of lines changed for XL'
    required: false
    default: '10000'
  xxl_label:
    description: 'Label for extra extra large PRs'
    required: false
    default: 'size/xxl'
  fail_if_xl:
    description: 'Fail the action if the PR is XL'
    required: false
    default: 'false'
  fail_if_xxl:
    description: 'Fail the action if the PR is XXL'
    required: false
    default: 'false'
  files_to_ignore:
    description: 'Files to ignore (newline or space separated)'
    required: false
    default: ''
  ignore_line_deletions:
    description: 'Ignore line deletions when calculating size'
    required: false
    default: 'false'
  ignore_file_deletions:
    description: 'Ignore file deletions when calculating size'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Label PR based on size
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        XS_LABEL: ${{ inputs.xs_label }}
        XS_MAX_SIZE: ${{ inputs.xs_max_size }}
        S_LABEL: ${{ inputs.s_label }}
        S_MAX_SIZE: ${{ inputs.s_max_size }}
        M_LABEL: ${{ inputs.m_label }}
        M_MAX_SIZE: ${{ inputs.m_max_size }}
        L_LABEL: ${{ inputs.l_label }}
        L_MAX_SIZE: ${{ inputs.l_max_size }}
        XL_LABEL: ${{ inputs.xl_label }}
        XL_MAX_SIZE: ${{ inputs.xl_max_size }}
        XXL_LABEL: ${{ inputs.xxl_label }}
        FAIL_IF_XL: ${{ inputs.fail_if_xl }}
        FAIL_IF_XXL: ${{ inputs.fail_if_xxl }}
        IGNORE_LINE_DELETIONS: ${{ inputs.ignore_line_deletions }}
        IGNORE_FILE_DELETIONS: ${{ inputs.ignore_file_deletions }}
        FILES_TO_IGNORE: ${{ inputs.files_to_ignore }}
      with:
        github-token: ${{ github.token }}
        retries: 3
        script: |
          const prNumber = context.issue.number;
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          // Get configuration values
          const xs_label = process.env.XS_LABEL;
          const xs_max_size = parseInt(process.env.XS_MAX_SIZE);
          const s_label = process.env.S_LABEL;
          const s_max_size = parseInt(process.env.S_MAX_SIZE);
          const m_label = process.env.M_LABEL;
          const m_max_size = parseInt(process.env.M_MAX_SIZE);
          const l_label = process.env.L_LABEL;
          const l_max_size = parseInt(process.env.L_MAX_SIZE);
          const xl_label = process.env.XL_LABEL;
          const xl_max_size = parseInt(process.env.XL_MAX_SIZE);
          const xxl_label = process.env.XXL_LABEL;
          const fail_if_xl = process.env.FAIL_IF_XL === 'true';
          const fail_if_xxl = process.env.FAIL_IF_XXL === 'true';
          const ignore_line_deletions = process.env.IGNORE_LINE_DELETIONS === 'true';
          const ignore_file_deletions = process.env.IGNORE_FILE_DELETIONS === 'true';

          // Parse files to ignore
          const files_to_ignore = process.env.FILES_TO_IGNORE.split(/[\s\n]+/).filter(f => f);

          try {
          // Get all PR files using pagination
          const files = await github.paginate(github.rest.pulls.listFiles, {
            owner,
            repo,
            pull_number: prNumber,
            per_page: 100
          });

          console.log(`Processing ${files.length} files in PR`);

          // Calculate total changes
          let totalChanges = 0;

          for (const file of files) {
            // Check if file should be ignored
            const filename = file.filename;
            let shouldIgnore = false;

            for (const pattern of files_to_ignore) {
              // Simple pattern matching (could be enhanced with glob patterns)
              if (filename === pattern || filename.endsWith(pattern)) {
                shouldIgnore = true;
                break;
              }
            }

            if (shouldIgnore) {
              console.log(`Ignoring file: ${filename}`);
              continue;
            }

            // Check if file was deleted and should be ignored
            if (ignore_file_deletions && file.status === 'removed') {
              console.log(`Ignoring deleted file: ${filename}`);
              continue;
            }

            // Calculate changes for this file
            let fileChanges = file.additions;
            if (!ignore_line_deletions) {
              fileChanges += file.deletions;
            }

            totalChanges += fileChanges;
          }

          console.log(`Total changes: ${totalChanges}`);

          // Determine the appropriate label
          let newLabel;
          if (totalChanges <= xs_max_size) {
            newLabel = xs_label;
          } else if (totalChanges <= s_max_size) {
            newLabel = s_label;
          } else if (totalChanges <= m_max_size) {
            newLabel = m_label;
          } else if (totalChanges <= l_max_size) {
            newLabel = l_label;
          } else if (totalChanges <= xl_max_size) {
            newLabel = xl_label;
          } else {
            newLabel = xxl_label;
          }

          console.log(`Assigning label: ${newLabel}`);

          // Get all size labels
          const allSizeLabels = [xs_label, s_label, m_label, l_label, xl_label, xxl_label];

          // Get current labels on the PR
          const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
            owner,
            repo,
            issue_number: prNumber
          });

          const currentLabelNames = currentLabels.map(l => l.name);

          // Remove old size labels
          for (const label of allSizeLabels) {
            if (label !== newLabel && currentLabelNames.includes(label)) {
              console.log(`Removing label: ${label}`);
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: prNumber,
                  name: label
                });
              } catch (error) {
                console.log(`Failed to remove label ${label}: ${error.message}`);
              }
            }
          }

          // Add the new label
          if (!currentLabelNames.includes(newLabel)) {
            console.log(`Adding label: ${newLabel}`);
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: prNumber,
              labels: [newLabel]
            });
          }

          // Fail if XL and configured to do so
          if (newLabel === xl_label && fail_if_xl) {
            core.setFailed(`PR is too large (${totalChanges} changes). Please consider breaking it up into smaller PRs.`);
          }

          // Fail if XXL and configured to do so
          if (newLabel === xxl_label && fail_if_xxl) {
            core.setFailed(`PR is too large (${totalChanges} changes). Please consider breaking it up into smaller PRs.`);
          }
          } catch (error) {
            core.warning(`Unable to apply a PR size label: ${error.message}`);
          }
