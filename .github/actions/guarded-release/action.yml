name: Build and publish verified release
description: Build from a pinned tag, verify every binary, attach assets, and publish the verified draft.
inputs:
  release-id:
    description: GitHub draft release ID; its tag is the authoritative version.
    required: true
  commit:
    description: Full source commit SHA.
    required: true
  app-id:
    description: Release bot GitHub App ID.
    required: true
  app-private-key:
    description: Release bot GitHub App private key.
    required: true
  releases-enabled:
    description: Repository activation flag, set after enabling immutable releases.
    required: true
runs:
  using: composite
  steps:
    # Keep publication paused until an administrator enables immutable
    # releases after deploying these workflows and draining older writers.
    - name: Require completed release cutover
      env:
        RELEASES_ENABLED: ${{ inputs.releases-enabled }}
      shell: bash
      run: |
        if [ "$RELEASES_ENABLED" != true ]; then
          echo '::error::Enable immutable releases and set ATMOS_GUARDED_RELEASES_ENABLED=true; see docs/fixes/release-tag-artifact-integrity.md.'
          exit 1
        fi

    # Keep verification tooling separate from the source being released. Old
    # commits cannot replace the guard with their own version of the script.
    - name: Checkout release tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        ref: ${{ github.workflow_sha }}
        path: tooling
        persist-credentials: false

    - name: Create preparation token
      id: prepare-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        permission-contents: write

    - name: Pin draft tag and source commit
      id: identity
      uses: $/.github/actions/release-publish # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      with:
        operation: prepare
        github-token: ${{ steps.prepare-token.outputs.token }}
        release-id: ${{ inputs.release-id }}
        commit: ${{ inputs.commit }}

    - name: Checkout the pinned source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        ref: ${{ steps.identity.outputs.commit }}
        fetch-depth: 0
        path: source
        persist-credentials: false

    - name: Verify checkout
      working-directory: source
      env:
        RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        SOURCE_COMMIT: ${{ steps.identity.outputs.commit }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
        test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_COMMIT"
        test -z "$(git status --porcelain)"

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: source/go.mod
        cache-dependency-path: source/go.sum

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Install syft
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

    - name: Build, sign and generate artifact SBOMs
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        distribution: goreleaser
        version: 'v2.18.3'
        workdir: source
        args: release --clean --skip=publish --timeout 150m --config ../tooling/.goreleaser.yml
      env:
        GORELEASER_CURRENT_TAG: ${{ steps.identity.outputs.tag }}
        GITHUB_TOKEN: ${{ github.token }}

    - name: Generate source SBOM
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        path: source
        format: spdx-json
        output-file: source/dist/atmos-sbom.spdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Verify every binary and seal the artifact manifest
      working-directory: tooling
      env:
        RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        SOURCE_COMMIT: ${{ steps.identity.outputs.commit }}
      shell: bash
      run: |
        set -euo pipefail
        go tool mage release:stageArtifacts ../source "$RUNNER_TEMP/release-upload"
        go tool mage release:verifyArtifacts "$RUNNER_TEMP/release-upload" "$RELEASE_TAG" "$SOURCE_COMMIT"

    - name: Record the actual build source for provenance
      uses: $/.github/actions/release-publish # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      with:
        operation: provenance
        github-token: ${{ github.token }}
        release-id: ${{ steps.identity.outputs.id }}
        tag: ${{ steps.identity.outputs.tag }}
        commit: ${{ steps.identity.outputs.commit }}
        provenance-file: ${{ runner.temp }}/release-provenance.json

    - name: Attest the verified artifacts
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ runner.temp }}/release-upload/*
        predicate-type: https://slsa.dev/provenance/v1
        predicate-path: ${{ runner.temp }}/release-provenance.json

    - name: Attest source SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ runner.temp }}/release-upload/*_SHA256SUMS
        sbom-path: ${{ runner.temp }}/release-upload/atmos-sbom.spdx.json

    # App tokens expire after one hour. No build should consume the lifetime
    # of the token used for the final upload and publish API calls.
    - name: Create publication token
      id: publish-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        permission-contents: write

    - name: Upload, verify and publish the same draft
      uses: $/.github/actions/release-publish # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      with:
        operation: publish
        github-token: ${{ steps.publish-token.outputs.token }}
        release-id: ${{ steps.identity.outputs.id }}
        tag: ${{ steps.identity.outputs.tag }}
        commit: ${{ steps.identity.outputs.commit }}
        artifact-directory: ${{ runner.temp }}/release-upload
