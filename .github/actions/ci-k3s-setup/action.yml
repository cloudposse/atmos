# Keep execution timeouts and dependency policy in the calling workflow.
name: ci-k3s-setup
description: Shared k3s setup steps for standalone CI workflows.
inputs:
  matrix:
    description: JSON platform and fixture matrix for this job.
    required: true
runs:
  using: composite
  steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: |
          api.github.com:443
          auth.docker.io:443
          charts.bitnami.com:443
          contracts.canonical.com:443
          dl.k8s.io:443
          download.docker.com:443
          esm.ubuntu.com:443
          get.helm.sh:443
          ghcr.io:443
          github.com:443
          kubernetes.github.io:443
          livepatch.canonical.com:443
          mirror.gcr.io:443
          pkg-containers.githubusercontent.com:443
          production.cloudfront.docker.com:443
          raw.githubusercontent.com:443
          registry-1.docker.io:443
          registry.k8s.io:443
          cdn.registry.k8s.io:443
          *.pkg.dev:443
          rekor.sigstore.dev:443
          release-assets.githubusercontent.com:443
          repo.broadcom.com:443
          archive.ubuntu.com:80
          security.ubuntu.com:80
          tuf-repo-cdn.sigstore.dev:443
          us.i.posthog.com:443
          *.apple.com:443
          *.aaplimg.com:443
          *.mzstatic.com:443
          *.icloud.com:443
          *.apple-dns.net:443
          ocsp.usertrust.com:80
          ocsp.digicert.com:80
          *.pool.ntp.org:123
    - name: Check out code into the Go module directory
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
        ref: ${{ env.CI_SOURCE_REVISION || github.sha }}
    - name: Set up Atmos (install build artifact)
      uses: $/.github/actions/setup-atmos-install
      with:
        target: ${{ fromJSON(inputs.matrix).flavor.artifact }}
        run-id: ${{ env.CI_BUILD_RUN_ID }}
        github-token: ${{ github.token }}
