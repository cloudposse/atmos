# Keep execution timeouts and dependency policy in the calling workflow.
name: ci-mock
description: Shared mock steps for standalone CI workflows.
inputs:
  matrix:
    description: JSON platform and fixture matrix for this job.
    required: true
runs:
  using: composite
  steps:
    - name: Harden Runner
      if: ${{ ! ( fromJSON(inputs.matrix).flavor.target == 'windows' && (env.CI_SOURCE_DRAFT == 'true')  ) }}
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: |
          api.github.com:443
          checkpoint-api.hashicorp.com:443
          ghcr.io:443
          github.com:443
          pkg-containers.githubusercontent.com:443
          raw.githubusercontent.com:443
          registry.terraform.io:443
          rekor.sigstore.dev:443
          release-assets.githubusercontent.com:443
          releases.hashicorp.com:443
          tuf-repo-cdn.sigstore.dev:443
          us.i.posthog.com:443
          www.msftconnecttest.com:443
          ipv6.msftconnecttest.com:443
          www.msftncsi.com:443
          ipv6.msftncsi.com:443
          time.windows.com:443
          client.wns.windows.com:443
          settings-win.data.microsoft.com:443
          *.events.data.microsoft.com:443
          *.update.microsoft.com:443
          ecs.office.com:443
          pti.store.microsoft.com:443
          login.live.com:443
          go.microsoft.com:443
          www.microsoft.com:443
          ocsp.sectigo.com:80
          ocsp.sectigo.com:443
          crl.sectigo.com:80
          crl.sectigo.com:443
          *.apple.com:443
          *.aaplimg.com:443
          *.mzstatic.com:443
          *.icloud.com:443
          *.apple-dns.net:443
          ocsp.usertrust.com:80
          ocsp.digicert.com:80
          *.pool.ntp.org:123
          get.helm.sh:443
          proxy.golang.org:443
          sum.golang.org:443
          google.golang.org:443
    - name: Check out code into the Go module directory
      if: ${{ ! ( fromJSON(inputs.matrix).flavor.target == 'windows' && (env.CI_SOURCE_DRAFT == 'true')  ) }}
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
        ref: ${{ env.CI_SOURCE_REVISION || github.sha }}
    - name: Guard DNS against the harden-runner post-step race
      if: fromJSON(inputs.matrix).flavor.target == 'windows' && ! (env.CI_SOURCE_DRAFT == 'true')
      uses: $/.github/actions/windows-dns-guard
    - name: Set up Atmos (install build artifact for ${{ fromJSON(inputs.matrix).flavor.target }})
      if: ${{ ! ( fromJSON(inputs.matrix).flavor.target == 'windows' && (env.CI_SOURCE_DRAFT == 'true')  ) }}
      uses: $/.github/actions/setup-atmos-install
      with:
        target: ${{ fromJSON(inputs.matrix).flavor.target }}
        path: ${{ github.workspace }}
        add-to-path: 'true'
        run-id: ${{ env.CI_BUILD_RUN_ID }}
        github-token: ${{ github.token }}
    - name: Set up the CI toolchain
      if: ${{ ! ( fromJSON(inputs.matrix).flavor.target == 'windows' && (env.CI_SOURCE_DRAFT == 'true')  ) }}
      uses: $/.github/actions/ci-toolchain
      with:
        github-token: ${{ github.token }}
    - name: Verify OpenTofu
      if: ${{ ! ( fromJSON(inputs.matrix).flavor.target == 'windows' && (env.CI_SOURCE_DRAFT == 'true')  ) }}
      run: tofu version
      shell: bash
    - name: Run tests in ${{ fromJSON(inputs.matrix).demo-folder }} for ${{ fromJSON(inputs.matrix).flavor.target }}
      working-directory: ${{ fromJSON(inputs.matrix).demo-folder }}
      if: fromJSON(inputs.matrix).flavor.target == 'linux' || fromJSON(inputs.matrix).flavor.target == 'macos'
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: "# Retry to ride out transient registry/network failures \u2014 e.g. a 502\n# from github.com while terraform fetches\
        \ a provider signature. A\n# genuine test failure still fails on the final attempt.\nfor attempt in 1 2 3; do\n  atmos\
        \ test && exit 0\n  status=$?\n  echo \"atmos test failed (attempt ${attempt}/3, status ${status})\" >&2\n  [ \"${attempt}\"\
        \ -lt 3 ] && sleep 15\ndone\nexit \"${status}\"\n"
      shell: bash
    - name: Check atmos.exe integrity
      if: fromJSON(inputs.matrix).flavor.target == 'windows' && ! (env.CI_SOURCE_DRAFT == 'true')
      shell: pwsh
      run: |
        Write-Output "PATH=$Env:PATH"
        Write-Output "PATHEXT=$Env:PATHEXT"
        Get-ChildItem "${{ github.workspace }}"
        Get-Command "${{ github.workspace }}\atmos.exe"
        atmos version
    - name: Run tests in ${{ fromJSON(inputs.matrix).demo-folder }} for ${{ fromJSON(inputs.matrix).flavor.target }}
      working-directory: ${{ fromJSON(inputs.matrix).demo-folder }}
      if: fromJSON(inputs.matrix).flavor.target == 'windows' && ! (env.CI_SOURCE_DRAFT == 'true')
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # Retry to ride out transient registry/network failures (e.g. a 502
        # from github.com during terraform provider download). A genuine test
        # failure still fails on the final attempt.
        for ($attempt = 1; $attempt -le 3; $attempt++) {
          atmos test
          if ($LASTEXITCODE -eq 0) { exit 0 }
          Write-Output "atmos test failed (attempt $attempt/3, exit $LASTEXITCODE)"
          if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
        }
        exit $LASTEXITCODE
