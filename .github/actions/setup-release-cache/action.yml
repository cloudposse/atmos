name: Set up the release Go cache
description: Restore the cross-compiled Go cache written by the release cache warmup on main.
inputs:
  go-version-file:
    description: Module file used to select the release Go toolchain.
    default: go.mod
  cache-dependency-path:
    description: Dependency file hashed into the release cache key.
    default: go.sum
outputs:
  cache-primary-key:
    description: Cache key prefix; the trusted warmup appends its run and attempt IDs when saving.
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-matched-key:
    description: Restored cache key, or an empty string on a cold build.
    value: ${{ steps.restore.outputs.cache-matched-key }}
runs:
  using: composite
  steps:
    - name: Make room for release caches (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Free space before extracting a multi-target cache, rather than
        # waiting for the production GoReleaser before hook to do it.
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
        df -h /
    # Reuse toolchain/path setup, but do not download the unrelated native,
    # acceptance-test and race caches before restoring the release cache.
    - id: go
      uses: ./.github/actions/setup-go-cache
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: 'false'
    - name: Restore release build and module caches
      id: restore
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ${{ env.GOCACHE }}
          ${{ env.GOMODCACHE }}
        key: release-go-cache-v1-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('.goreleaser.yml') }}-${{ hashFiles(inputs.cache-dependency-path) }}
        restore-keys: |
          release-go-cache-v1-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('.goreleaser.yml') }}-${{ hashFiles(inputs.cache-dependency-path) }}-
          release-go-cache-v1-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('.goreleaser.yml') }}-
          release-go-cache-v1-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-
    - name: Report release cache restore
      shell: bash
      env:
        MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        PRIMARY_KEY: ${{ steps.restore.outputs.cache-primary-key }}
      run: |
        {
          echo '### Release Go cache'
          if [ -n "$MATCHED_KEY" ]; then
            printf 'Restored `%s`.\n' "$MATCHED_KEY"
          else
            printf 'No warm release cache found for `%s`; compiling from scratch.\n' "$PRIMARY_KEY"
          fi
          echo 'This cache warms the production cross-compilation matrix and build flags. Linking, signing and packaging still run for this release.'
        } >> "$GITHUB_STEP_SUMMARY"
