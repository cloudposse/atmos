name: Maintain release branches and notifications
description: Maintain stable release branches and notify included pull requests after verification.
inputs:
  app-id:
    description: Release bot GitHub App ID.
    required: true
  app-private-key:
    description: Release bot GitHub App private key.
    required: true
runs:
  using: composite
  steps:
    - name: Create branch maintenance token
      if: ${{ !github.event.release.prerelease }}
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        permission-contents: write
        permission-workflows: write
    - name: Maintain stable release branch
      if: ${{ !github.event.release.prerelease }}
      uses: cloudposse/github-action-release-branch-manager@d1eac0bfdfcf2c3e2c1a9669a6c5783a448bee65 # v2.0.0
      with:
        token: ${{ steps.token.outputs.token }}
    # The major tag has its own guarded workflow: release-major-tag.yml.
    - name: Notify included pull requests
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RELEASE_ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ github.token }}
        retries: 3
        script: |
          const notify = require(`${process.env.RELEASE_ACTION_PATH}/comment.cjs`);
          await notify({ github, context });
