# Upstream changes from _extends are only recognized when modifications are made to this file in the default branch.
_extends: .github
repository:
  name: atmos
  description: 👽 Terraform Orchestration Tool for DevOps. Keep environment configuration DRY with hierarchical imports of configurations, inheritance, and WAY more. Native support for Terraform and Helmfile.
  homepage: https://atmos.tools
  topics: ""
environments:
  - name: feature-releases
    deployment_branch_policy:
      custom_branches:
        - name: "**/*"
          type: branch

  - name: screengrabs
    deployment_branch_policy:
      custom_branches:
        - name: "main"
          type: branch
        - name: "**/*"
          type: branch
        - name: "*"
          type: branch
  - name: demo
    deployment_branch_policy:
      custom_branches:
        - name: "**/*"
          type: branch

labels:
  - name: release/feature
    color: '#d73a4a'
    description: Create release from this PR
  - name: dependencies
    color: '#0366d6'
    description: Pull requests that update a dependency file
  - name: go
    color: '#00add8'
    description: Pull requests that update Go code
  - name: experimental
    color: '#ff9800'
    description: Feature is experimental and still being refined
  - name: ai-prompt
    color: '#a855f7'
    description: Feature request submitted as an AI prompt
  - name: "auto-update"
    color: "#ededed"
    description: "This PR was automatically generated"
  - name: "bug"
    color: "#d73a4a"
    description: "🐛 An issue with the system"
  - name: "bugfix"
    color: "#fbca04"
    description: "Change that restores intended behavior"
  - name: "conflict"
    color: "#B60205"
    description: "This PR has conflicts"
  - name: "do not merge"
    color: "#B60205"
    description: "Do not merge this PR, doing so would cause problems"
  - name: "documentation"
    color: "#0075ca"
    description: "Improvements or additions to documentation"
  - name: "duplicate"
    color: "#cfd3d7"
    description: "This issue or pull request already exists"
  - name: "enhancement"
    color: "#a2eeef"
    description: "New feature or request"
  - name: "feature"
    color: "#336699"
    description: "New functionality"
  - name: "feature request"
    color: "#a2eeef"
    description: "Feature requests submitted through issue templates"
  - name: "fix"
    color: "#fbca04"
    description: "A bug fix included in release notes"
  - name: "good first issue"
    color: "#7057ff"
    description: "Good for newcomers"
  - name: "help wanted"
    color: "#008672"
    description: "Extra attention is needed"
  - name: "hotfix"
    color: "#d73a4a"
    description: "An urgent bug fix included in release notes"
  - name: "invalid"
    color: "#e4e669"
    description: "This doesn't seem right"
  - name: "landing-demos"
    color: "#5319e7"
    description: "Render + publish landing-page demo videos to S3 (landing-demos.yaml)"
  - name: "landing-demos-debug"
    color: "#BFD4F2"
    description: "Trigger the landing-demos-debug diagnostic workflow"
  - name: "major"
    color: "#00FF00"
    description: "Breaking changes (or first stable release)"
  - name: "migration"
    color: "#2f81f7"
    description: "This PR involves a migration"
  - name: "minor"
    color: "#00cc33"
    description: "New features that do not break anything"
  - name: "needs-cloudposse"
    color: "#B60205"
    description: "Needs Cloud Posse assistance"
  - name: "needs-test"
    color: "#B60205"
    description: "Needs testing"
  - name: "no-changes"
    color: "#cccccc"
    description: "No changes were made in this PR"
  - name: "no-release"
    color: "#0075ca"
    description: "Do not create a new release (wait for additional code changes)"
  - name: "patch"
    color: "#0E8A16"
    description: "A minor, backward compatible change"
  - name: "quality:not-ready"
    color: "#D93F0B"
    description: "One or more Quality Gate requirements are pending or failing"
  - name: "quality:ready"
    color: "#0E8A16"
    description: "All Quality Gate requirements pass for the current PR head"
  - name: "question"
    color: "#d876e3"
    description: "Further information is requested"
  - name: "readme"
    color: "#0075ca"
    description: "Improvements or additions to the README"
  - name: "size/l"
    color: "#ffd9c4"
    description: "Large size PR"
  - name: "size/m"
    color: "#ffd9c4"
    description: "Medium size PR"
  - name: "size/s"
    color: "#ffd9c4"
    description: "Small size PR"
  - name: "size/xl"
    color: "#ffd9c4"
    description: "Extra large size PR"
  - name: "size/xs"
    color: "#ffd9c4"
    description: "Extra small size PR"
  - name: "size/xxl"
    color: "#ededed"
    description: ""
  - name: "stacked"
    color: "#ffd9c4"
    description: "Stacked"
  - name: "stale"
    color: "#e69138"
    description: "This PR has gone stale"
  - name: "terraform/0.13"
    color: "#ffd9c4"
    description: "Module requires Terraform 0.13 or later"
  - name: "triage"
    color: "#fcb32c"
    description: "Needs triage"
  - name: "website-no-deploy"
    color: "#BFD4F2"
    description: "Skip website preview deployment for this PR"
  - name: "wip"
    color: "#B60205"
    description: "Work in Progress: Not ready for final review or merge"
  - name: "wontfix"
    color: "#B60205"
    description: "This will not be worked on"
