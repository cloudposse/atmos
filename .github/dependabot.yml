# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
- package-ecosystem: gomod
  directory: /
  labels:
    - dependencies
    - go
    - no-release
  schedule:
    interval: weekly
    day: sunday
  cooldown:
    default-days: 14  # 2 weeks minimum age for all dependencies
  ignore:
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]

- package-ecosystem: github-actions
  open-pull-requests-limit: 3
  directory: /
  labels:
    - dependencies
    - github-actions
    - no-release
  groups:
    cicd:
      patterns:
        - "*"
  schedule:
    interval: weekly
    day: sunday
  cooldown:
    default-days: 14  # 2 weeks minimum age for all dependencies
  ignore:
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]

- package-ecosystem: npm
  open-pull-requests-limit: 3
  directory: /website
  labels:
    - dependencies
    - javascript
    - no-release
  groups:
    website:
      patterns:
        - "*"
  schedule:
    interval: weekly
    day: sunday
  cooldown:
    default-days: 14  # 2 weeks minimum age for all dependencies
  ignore:
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]

# Tracks the Dockerfile's `FROM debian:trixie-slim@sha256:...` pin and opens a
# PR when the upstream digest moves, so pinning by digest doesn't mean losing
# security updates.
- package-ecosystem: docker
  directory: /
  labels:
    - dependencies
    - docker
    - no-release
  schedule:
    interval: weekly
    day: sunday
  cooldown:
    default-days: 14  # 2 weeks minimum age for all dependencies

# Tracks the digest-pinned base images in the devcontainer and screenshot
# tooling Dockerfiles.
- package-ecosystem: docker
  directory: /.devcontainer
  labels:
    - dependencies
    - docker
    - no-release
  schedule:
    interval: weekly
    day: sunday
  cooldown:
    default-days: 14  # 2 weeks minimum age for all dependencies

- package-ecosystem: docker
  directory: /demo/screenshots
  labels:
    - dependencies
    - docker
    - no-release
  schedule:
    interval: weekly
    day: sunday
  cooldown:
    default-days: 14  # 2 weeks minimum age for all dependencies

# Standalone Go modules under tools/ aren't reached by the root gomod entry.
- package-ecosystem: gomod
  directory: /tools/gomodcheck
  labels:
    - dependencies
    - go
    - no-release
  schedule:
    interval: weekly
    day: sunday
  cooldown:
    default-days: 14  # 2 weeks minimum age for all dependencies
  ignore:
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]

- package-ecosystem: gomod
  directory: /tools/lintroller
  labels:
    - dependencies
    - go
    - no-release
  schedule:
    interval: weekly
    day: sunday
  cooldown:
    default-days: 14  # 2 weeks minimum age for all dependencies
  ignore:
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]

# Website plugins with their own package.json aren't reached by the /website
# npm entry (website/package.json has no npm workspaces).
- package-ecosystem: npm
  directory: /website/plugins/custom-loaders
  labels:
    - dependencies
    - javascript
    - no-release
  schedule:
    interval: weekly
    day: sunday
  cooldown:
