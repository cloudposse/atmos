self-hosted-runner:
  labels:
    - runner=terraform
    - tag=atmos
    - extras=s3-cache
    - private=false

# actionlint 1.7.12 predates GitHub's checkout-free self-repository syntax.
# Suppress only this exact supported reference until actionlint supports $/.
paths:
  .github/workflows/*:
    ignore:
      - 'specifying action "\$/\.github/actions/harden-runner(?:/(?:runtime|diagnostics))?" in invalid format because ref is missing'
