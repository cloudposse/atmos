name: CI Test Kubernetes
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - README.md
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
      - release/v*
    paths-ignore:
      - .github/**
      - docs/**
      - examples/**
      - test/**
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
cache-mode: read

permissions:
  checks: read
  contents: read
  packages: read
  pull-requests: read
  actions: read
env:
  ATMOS_BOOTSTRAP_VERSION: 1.223.0
  HELMFILE_UPGRADE_NOTICE_DISABLED: 'true'
  TEST_SHARD_COUNT: '10'
  RACE_SHARD_COUNT: '4'
  GOPROXY: https://proxy.golang.org
  CI_SOURCE_REVISION: ${{ github.sha }}
  CI_SOURCE_EVENT: ${{ github.event_name }}
  CI_SOURCE_DRAFT: ${{ github.event.pull_request.draft || false }}
  CI_BUILD_RUN_ID: ''
jobs:
  kubernetes-e2e:
    name: ${{ vars.CI_SPLIT_WORKFLOWS != 'true' && 'Split disabled / ' || '' }}[kubernetes] e2e tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: |
            api.github.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            *.apple.com:443
            *.aaplimg.com:443
            *.mzstatic.com:443
            *.icloud.com:443
            *.apple-dns.net:443
            ocsp.usertrust.com:80
            ocsp.digicert.com:80
            *.pool.ntp.org:123
      - name: Check out code into the Go module directory
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ env.CI_SOURCE_REVISION || github.sha }}
      - name: Set up Go
        uses: $/.github/actions/setup-go-cache
      - name: Download Go dependencies
        shell: bash
        run: |
          # This job compiles directly from a cold module cache instead of using
          # the build job's dependency step. Retry transient hosted-runner DNS
          # and network failures here so they do not appear as test failures.
          delay=5
          for attempt in {1..5}; do
            if go mod download; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi

            echo "go mod download failed (attempt $attempt/5); retrying in ${delay}s"
            sleep "$delay"
            delay=$((delay * 2))
          done
      - name: Run Kubernetes end-to-end tests
        env:
          GOTMPDIR: ${{ runner.temp }}/go-tmp
          TMPDIR: ${{ runner.temp }}/tmp
          CGO_ENABLED: '0'
          ATMOS_ENVTEST_REQUIRED: 'true'
        run: |
          mkdir -p "$GOTMPDIR" "$TMPDIR"
          go test -tags envtest -count=1 ./pkg/component/kubernetes/... -run TestEnvtest
    if: ${{ vars.CI_SPLIT_WORKFLOWS == 'true' }}
run-name: CI revision ${{ github.sha }} base ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha ||
  github.event.before || github.sha }}
