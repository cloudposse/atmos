---
name: Verify SHA Pinning
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/verify-sha-pinning/**'
  schedule:
    # Weekly Monday 9am UTC — catch upstream tag mutations
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Verifier code and allowlist.json are read from the PR's own head, same
      # as gitleaks/git-secrets read their allowlist config from the diff
      # being scanned — protection against a self-serving allowlist entry (or
      # a patched verifier) comes from required review before merge (main
      # requires 1 approval, code-owner review, and dismisses stale approvals
      # on new pushes), not from hiding the policy behind a base-branch
      # checkout. A base-only policy also can't be extended by the PR that
      # needs the extension, which defeats the point of an allowlist.
      - uses: ./.github/actions/verify-sha-pinning
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
