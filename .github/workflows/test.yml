name: Tests
on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Diagnostic scope
        type: choice
        options: [comparison, action, nested]
        default: comparison
permissions:
  contents: read
jobs:
  windows-reserve:
    if: inputs.diagnostic == 'comparison'
    name: Exception reserve (${{ matrix.os }}, host ${{ matrix.host }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        host: [1, 2, 3, 4]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            get.helm.sh:443
            github.com:443
            raw.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443
            tuf-repo-cdn.sigstore.dev:443
            us.i.posthog.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            google.golang.org:443
            modernc.org:443
            www.msftconnecttest.com:443
            ipv6.msftconnecttest.com:443
            www.msftncsi.com:443
            ipv6.msftncsi.com:443
            time.windows.com:443
            client.wns.windows.com:443
            settings-win.data.microsoft.com:443
            *.events.data.microsoft.com:443
            *.update.microsoft.com:443
            ecs.office.com:443
            pti.store.microsoft.com:443
            login.live.com:443
            go.microsoft.com:443
            www.microsoft.com:443
            ocsp.sectigo.com:80
            ocsp.sectigo.com:443
            crl.sectigo.com:80
            crl.sectigo.com:443
            *.apple.com:443
            *.aaplimg.com:443
            *.mzstatic.com:443
            *.icloud.com:443
            *.apple-dns.net:443
            ocsp.usertrust.com:80
            ocsp.digicert.com:80
            *.pool.ntp.org:123
            go.dev:443
            golang.org:443
            dl.google.com:443
      - name: Check out diagnostic harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Guard DNS cleanup
        uses: ./.github/actions/windows-dns-guard
      - name: Check out unchanged stack source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: b8173027740bfaf274ba32d2227f9213aeaefe8f
          path: source
          persist-credentials: false
      - name: Set up failing Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.9'
          cache: false
      - name: Compare stock and larger Windows exception reserve
        shell: pwsh
        env:
          GOTOOLCHAIN: local
          GOPROXY: https://proxy.golang.org
        run: ./.github/diagnostics/windows-reserve.ps1
      - name: Preserve host and runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-reserve-${{ matrix.os }}-${{ matrix.host }}
          path: ${{ runner.temp }}/windows-reserve-diagnostics/
          retention-days: 7
  action-validation:
    if: inputs.diagnostic == 'action'
    name: Validate the exact Windows CI action
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            get.helm.sh:443
            github.com:443
            raw.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443
            tuf-repo-cdn.sigstore.dev:443
            us.i.posthog.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            google.golang.org:443
            modernc.org:443
            www.msftconnecttest.com:443
            ipv6.msftconnecttest.com:443
            www.msftncsi.com:443
            ipv6.msftncsi.com:443
            time.windows.com:443
            client.wns.windows.com:443
            settings-win.data.microsoft.com:443
            *.events.data.microsoft.com:443
            *.update.microsoft.com:443
            ecs.office.com:443
            pti.store.microsoft.com:443
            login.live.com:443
            go.microsoft.com:443
            www.microsoft.com:443
            ocsp.sectigo.com:80
            ocsp.sectigo.com:443
            crl.sectigo.com:80
            crl.sectigo.com:443
            *.apple.com:443
            *.aaplimg.com:443
            *.mzstatic.com:443
            *.icloud.com:443
            *.apple-dns.net:443
            ocsp.usertrust.com:80
            ocsp.digicert.com:80
            *.pool.ntp.org:123
            go.dev:443
            golang.org:443
            dl.google.com:443
      - name: Check out the action under test
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Guard DNS cleanup
        uses: ./.github/actions/windows-dns-guard
      - name: Set up failing Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.9'
          cache: false
      - name: Run the exact guarded action
        uses: ./.github/actions/windows-exception-reserve
      - name: Run the stress probe with the exported overlay
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          $source = Get-Content -Raw .github/diagnostics/windows-reserve.ps1
          $start = $source.IndexOf("package main")
          $end = $source.IndexOf("'@ | Set-Content", $start)
          if ($start -lt 0 -or $end -lt 0) { throw 'Probe source not found' }
          $probe = Join-Path $env:RUNNER_TEMP 'reserve-probe.go'
          [IO.File]::WriteAllText($probe, $source.Substring($start, $end - $start))
          go run $probe
          if ($LASTEXITCODE -ne 0) { throw 'Guarded action probe failed' }
  nested-validation:
    if: inputs.diagnostic == 'nested'
    name: Validate real Windows CLI subprocess builds
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            get.helm.sh:443
            github.com:443
            raw.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443
            tuf-repo-cdn.sigstore.dev:443
            us.i.posthog.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            google.golang.org:443
            modernc.org:443
            www.msftconnecttest.com:443
            ipv6.msftconnecttest.com:443
            www.msftncsi.com:443
            ipv6.msftncsi.com:443
            time.windows.com:443
            client.wns.windows.com:443
            settings-win.data.microsoft.com:443
            *.events.data.microsoft.com:443
            *.update.microsoft.com:443
            ecs.office.com:443
            pti.store.microsoft.com:443
            login.live.com:443
            go.microsoft.com:443
            www.microsoft.com:443
            ocsp.sectigo.com:80
            ocsp.sectigo.com:443
            crl.sectigo.com:80
            crl.sectigo.com:443
            *.apple.com:443
            *.aaplimg.com:443
            *.mzstatic.com:443
            *.icloud.com:443
            *.apple-dns.net:443
            ocsp.usertrust.com:80
            ocsp.digicert.com:80
            *.pool.ntp.org:123
            go.dev:443
            golang.org:443
            dl.google.com:443
      - name: Check out the action under test
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Guard DNS cleanup
        uses: ./.github/actions/windows-dns-guard
      - name: Set up failing Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.9'
          cache: false
      - name: Run the exact guarded action
        uses: ./.github/actions/windows-exception-reserve
      - name: Check out the published source with its real test workflow
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: bc1c706151264b6e51a550383ede9fe68b7f1011
          path: source
          persist-credentials: false
      - name: Compare nested CLI build environments
        shell: pwsh
        env:
          GOTOOLCHAIN: local
          GOPROXY: https://proxy.golang.org
        run: ./.github/diagnostics/windows-nested-env.ps1
      - name: Preserve nested-build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-nested-build-environment
          path: ${{ runner.temp }}/windows-nested-build-environment/
          retention-days: 7
