name: Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-diagnostics:
    name: Windows acceptance diagnostics (${{ matrix.mode }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [race, checkptr]
    steps:
      - name: Check out diagnostic commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The acceptance verifier reads the real Tests shard matrix.
          # Run against the unchanged stack source, not this diagnostic workflow.
          ref: 3755e7a0dd50fc1ae9bfb25647e178a8533cf450
          persist-credentials: false
      - name: Set up failing Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.9'
          cache: false
      - name: Inspect runtime and test acceptance orchestration
        shell: pwsh
        env:
          DIAGNOSTIC_MODE: ${{ matrix.mode }}
          GOTOOLCHAIN: go1.26.9
          GOPROXY: https://proxy.golang.org
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          go version | Tee-Object diagnostics/toolchain.txt
          go env | Tee-Object -Append diagnostics/toolchain.txt
          if ($env:DIAGNOSTIC_MODE -eq 'race') {
            $env:CGO_ENABLED = '1'
            go test -race -count=5 -parallel=2 -timeout=20m ./internal/ci/acceptance 2>&1 | Tee-Object diagnostics/test.log
          } else {
            $env:CGO_ENABLED = '0'
            go test -gcflags=all=-d=checkptr=2 -count=5 -parallel=2 -timeout=20m ./internal/ci/acceptance 2>&1 | Tee-Object diagnostics/test.log
          }
          exit $LASTEXITCODE
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-acceptance-${{ matrix.mode }}
          path: diagnostics/
          retention-days: 7
