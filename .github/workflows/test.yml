name: Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-git-config:
    name: Windows Git fixture configuration
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out fixed stack source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: b0c1b3afc24a4b872b18219f60619a24f63b2a89
          persist-credentials: false
      - name: Set up CI Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.9'
          cache: false
      - name: Verify Git null configuration paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          git --version | Tee-Object diagnostics/git-version.txt
          $env:GIT_CONFIG_GLOBAL = 'NUL'
          $env:GIT_CONFIG_NOSYSTEM = '1'
          git init --quiet diagnostics/nul-control 2>&1 | Tee-Object diagnostics/nul-control.log
          if ($LASTEXITCODE -eq 0) { throw 'Expected the reported NUL config failure' }
          $env:GIT_CONFIG_GLOBAL = '/dev/null'
          git init --quiet diagnostics/fixed-control 2>&1 | Tee-Object diagnostics/fixed-control.log
          if ($LASTEXITCODE -ne 0) { throw 'Git rejected /dev/null' }
          exit 0
      - name: Test Git fixtures with race detection
        shell: pwsh
        env:
          GOTOOLCHAIN: go1.26.9
          CGO_ENABLED: '1'
          GOPROXY: https://proxy.golang.org
        run: |
          go test -race -count=1 -timeout=15m ./tests/testhelpers/gitmirror ./pkg/git/providers/cli ./pkg/provisioner/target/git 2>&1 | Tee-Object diagnostics/fixtures.log
          exit $LASTEXITCODE
      - name: Verify acceptance test startup and enumeration
        shell: pwsh
        env:
          GOTOOLCHAIN: go1.26.9
          CGO_ENABLED: '0'
          GOPROXY: https://proxy.golang.org
        run: |
          go test ./tests -list '^(Test|Example|Fuzz)' -timeout=10m 2>&1 | Tee-Object diagnostics/acceptance-startup.log
          exit $LASTEXITCODE
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-git-config
          path: diagnostics/
          retention-days: 7
