name: Link Check

on:
  pull_request:
    paths:
      - '**.md'
      - '!website/**'
      - 'lychee.toml'
  push:
    branches: [main]
    paths:
      - '**.md'
      - '!website/**'
      - 'lychee.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # lychee hits every external URL referenced in whatever markdown changed
          # (87+ distinct domains observed in a single run, a different set each
          # time) — unbounded/content-driven egress, stays in audit intentionally.
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config lychee.toml --root-dir ${{ github.workspace }} '**/*.md'
          fail: true
          jobSummary: true
          token: ${{ secrets.GITHUB_TOKEN }}
