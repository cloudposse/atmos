name: Release milestones

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, milestoned, demilestoned, closed, enqueued, dequeued]
  issues:
    types: [closed, reopened, edited, milestoned, demilestoned]
  milestone:
    types: [created, opened, edited, closed, deleted]
  release:
    types: [published]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions: {}

# Every event reconciles current state, so a superseded pending event loses no
# state. The scheduled run also recovers missed or suppressed bot-token events.
concurrency:
  group: release-milestone-policy
  cancel-in-progress: false

jobs:
  maintain:
    if: github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - name: Checkout trusted milestone tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/release-milestones
        with:
          operation: ensure
          github-token: ${{ github.token }}

  enforce:
    needs: maintain
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - name: Checkout trusted milestone tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/release-milestones
        with:
          operation: check
          github-token: ${{ github.token }}

  previews:
    needs: maintain
    if: always() && github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/release-preview
        with:
          github-token: ${{ github.token }}
