name: Release milestones

on:
  # The unprivileged signal only wakes this default-branch reconciler. Its
  # conclusion and artifacts are never authority for a release-policy verdict.
  workflow_run:
    workflows: [Quality Gate Signal]
    types: [completed]
  push:
    branches: [main]
  issues:
    types: [closed, reopened, edited, milestoned, demilestoned]
  milestone:
    types: [created, opened, edited, closed, deleted]
  release:
    types: [published]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions: {}

# Every event reconciles current state, so a superseded pending event loses no
# state. The scheduled run also recovers missed or suppressed bot-token events.
concurrency:
  group: release-milestone-policy
  cancel-in-progress: false

jobs:
  maintain:
    if: github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout trusted milestone tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/release-milestones
        with:
          operation: ensure
          github-token: ${{ github.token }}

  enforce:
    needs: maintain
    # Review signals refresh quality only; release policy needs PR metadata events.
    if: always() && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout trusted milestone tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/release-milestones
        with:
          operation: check
          github-token: ${{ github.token }}

  previews:
    needs: maintain
    if: always() && github.event_name != 'merge_group' && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-notes
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/release-preview
        with:
          github-token: ${{ github.token }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
