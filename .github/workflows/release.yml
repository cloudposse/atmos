name: Release

# Notes only. Builds and publication belong to publish-release.yml; a mutable
# draft must never carry binaries compiled for an earlier tag or commit.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions: {}

# Shared by ALL release writers, including manual, nightly and feature release
# entrypoints. Never cancel an active upload or publication.
concurrency:
  group: atmos-release
  cancel-in-progress: false

jobs:
  draft:
    name: Draft release notes
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: release
    outputs:
      id: ${{ steps.draft.outputs.id }}
      exists: ${{ steps.draft.outputs.exists }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Draft release notes
        id: draft
        uses: $/.github/actions/release-draft
        with:
          app-id: ${{ vars.BOT_GITHUB_APP_ID }}
          app-private-key: ${{ secrets.BOT_GITHUB_APP_PRIVATE_KEY }}
          prerelease: 'false'


  summarize-notes:
    name: Rewrite release notes with condensed PR summaries
    needs: [draft]
    # draft.outputs.id is empty when the drafting action found nothing to
    # release (has-duplicate short-circuit) - nothing to rewrite then.
    if: needs.draft.outputs.id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # release-drafter (via .github/auto-release.yml) only writes a skeleton:
    # one bullet per PR. This job fetches each PR's description
    # (pull-requests: read), condenses it - with the model when the
    # OPENAI_API_KEY secret is configured, otherwise CodeRabbit's summary or
    # a truncated description - and rewrites the release (contents: write)
    # as collapsible per-PR notes. It never fails the release: any error is
    # logged and the skeleton stays (see magefiles/release/release_notes.go).
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          # api.github.com: read/update the release. api.openai.com: the
          # summarization call. golang.org/go.dev/raw.githubusercontent.com/
          # release-assets.githubusercontent.com/dl.google.com: actions/setup-go
          # resolving and downloading the Go toolchain (golang.org was missing,
          # so setup-go failed with
          # "getaddrinfo EAI_AGAIN golang.org" before the summarizer ran). The
          # rest is the module download behind `go tool mage`.
          allowed-endpoints: >
            api.github.com:443
            api.openai.com:443
            github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            golang.org:443
            go.dev:443
            dl.google.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            google.golang.org:443
            modernc.org:443

      - name: Check out code into the Go module directory
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Deliberately no `ref:` - workflow_run checks out the default
          # branch, never the triggering run's head, so this step always runs
          # trusted code regardless of what triggered Tests.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Summarize release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: |
          set -euo pipefail
          go tool mage release:summarizeNotes "$REPO" "$RELEASE_ID"
