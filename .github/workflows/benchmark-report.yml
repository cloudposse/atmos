name: Benchmark Report

on:
  # Automatic publication is handled by the final quality report, after CI completes.
  workflow_dispatch:
    inputs:
      run-id:
        description: Completed PR benchmark run to recover manually.
        required: true
        type: string

permissions: {}

# Serialize manual recovery for a benchmark run. The publisher verifies its PR head.
concurrency:
  group: atmos-benchmark-recovery-${{ inputs.run-id }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: write
      issues: write
    env:
      GOPROXY: https://proxy.golang.org
      GITHUB_TOKEN: ${{ github.token }}
      BENCHMARK_RUN_ID: ${{ inputs.run-id }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          # setup-go follows GitHub release redirects; the Go hosts cover its fallback.
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            golang.org:443
            go.dev:443
            dl.google.com:443
            *.blob.core.windows.net:443
            *.actions.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
      # Never check out the PR or run anything downloaded from its artifacts.
      - name: Check out trusted reporter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Go and restore build cache
        uses: ./.github/actions/setup-go-cache
      - name: Compare snapshots and update sticky comment
        run: go tool mage bench:report "$GITHUB_REPOSITORY" "$BENCHMARK_RUN_ID"
      - name: Save full comparisons
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-report-${{ inputs.run-id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/benchmarks/report/
          retention-days: 90
          if-no-files-found: ignore
