name: vhs
on:
  pull_request:
    types: [labeled, opened, synchronize]

env:
  TERM: "xterm-256color"
  COLORTERM: "truecolor"
  LANG: "en_US.UTF-8"
  ATMOS_LOGS_LEVEL: "Info"

# Least-privilege default; every job below declares its own narrower
# job-level permissions that override this baseline.
permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for vhs label
        id: labeled
        run: |
          labels=$(jq -r '.pull_request.labels[]?.name' "$GITHUB_EVENT_PATH")
          if [[ $labels =~ "vhs" ]]; then
            echo "labeled=true" >> $GITHUB_OUTPUT
          else
            echo "labeled=false" >> $GITHUB_OUTPUT
          fi

      - name: Get modified .tape files
        id: tapes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_LABELED: ${{ steps.labeled.outputs.labeled }}
        run: |
          # Landing-page tapes (demo/landing/**) are rendered by landing-demos.yaml,
          # not here — exclude them so they never enter this matrix.
          if [[ "$IS_LABELED" == "true" ]]; then
            files=$(find . -path './build-harness' -prune -o -path './demo/landing' -prune -o -type f -name '*.tape' ! -name 'style.tape' ! -name 'defaults.tape' -print | cut -d/ -f2-)
          else
            files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep '\.tape$' | grep -vE '(^|/)(style|defaults)\.tape$' | grep -v '^demo/landing/' | cut -d/ -f2- || true)
          fi
          # A multi-line value is invalid for $GITHUB_OUTPUT and would break the matrix
          # split; collapse to a single space-separated line.
          files=$(printf '%s' "$files" | tr '\n' ' ' | sed -E 's/ +/ /g; s/^ //; s/ $//')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Set up matrix
        id: create-matrix
        env:
          TAPE_FILES: ${{ steps.tapes.outputs.files }}
        run: |
          echo "matrix=$(echo -n "$TAPE_FILES" | jq -R -s -c 'split(" ")')" >> $GITHUB_OUTPUT

    outputs:
      matrix: ${{ steps.create-matrix.outputs.matrix }}
      labeled: ${{ steps.labeled.outputs.labeled }}

  vhs:
    needs: [prepare]
    if: needs.prepare.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      # Render-only. .tape files come from the PR diff and vhs-action executes
      # their directives, so this job must never hold a write token — the
      # actual push happens in the trusted `commit` job below, which never
      # runs vhs-action and only ever consumes this job's artifact output.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        file: ${{fromJson(needs.prepare.outputs.matrix)}}
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.file }}
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install atmos
        uses: jaxxstorm/action-install-gh-release@cd6b2b78ad38bdd294341cda064ec0692b06215b # v1.14.0
        with: # Grab the latest version
          repo: cloudposse/atmos
          chmod: 0755
          extension-matching: disable
          rename-to: atmos

      - uses: charmbracelet/vhs-action@5bc47255c016b6af28ad6b633ee9a07b79468804 # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ matrix.file }}
          install-fonts: true

      # VHS determines the output path from the tape's own `Output <path>.gif`
      # directive, so the workflow can't know it ahead of time — discover it
      # from the working-tree diff instead, same trust boundary as the old
      # file_pattern: '*.gif' passed to git-auto-commit-action.
      - name: Detect rendered GIF
        id: detect
        run: |
          changed=$(git status --porcelain --untracked-files=all -- '*.gif' | cut -c4-)
          if [ -z "$changed" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "files<<GIF_EOF"
            echo "$changed"
            echo "GIF_EOF"
          } >> "$GITHUB_OUTPUT"

      # A tape whose render didn't change its GIF is a normal no-op, not a
      # failure — only upload when there's something for `commit` to push.
      - name: Upload rendered GIF
        if: steps.detect.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vhs-gif-${{ strategy.job-index }}
          path: ${{ steps.detect.outputs.files }}
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit rendered GIFs
    needs: [vhs]
    # Runs whenever `vhs` actually executed (not skipped for zero tape files),
    # on both full success and partial per-leg failure (fail-fast: false lets
    # good legs upload before a broken tape fails its own leg) — but not if
    # the run was cancelled outright.
    if: (success() || failure()) && needs.vhs.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      # The only job in this workflow with push rights. Starts from a fresh
      # checkout and only ever pulls in files via the artifact API (an opaque
      # blob store), so it never inherits any working-tree/git state a
      # PR-controlled tape may have tampered with in the `vhs` job.
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-commit
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: false

      # Zero-artifact case (every leg was a no-op, or vhs failed before any
      # leg uploaded) must not fail the step — warn and let auto-commit below
      # find nothing to do.
      - name: Download rendered GIFs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vhs-gif-*
          path: .
          merge-multiple: true
          if-no-artifact-found: warn

      - uses: stefanzweifel/git-auto-commit-action@3ea6ae190baf489ba007f7c92608f33ce20ef04a # v4
        id: auto-commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: "chore: update demo gif"
          commit_user_name: vhs-action 📼
          commit_user_email: actions@github.com
          commit_author: vhs-action 📼 <actions@github.com>
          file_pattern: '*.gif'

      - name: Add Image to Job Summary
        if: steps.auto-commit.outputs.changes_detected == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          COMMIT_HASH: ${{ steps.auto-commit.outputs.commit_hash }}
        run: |
          echo "## Demo GIF" >> $GITHUB_STEP_SUMMARY
          echo "![Demo GIF](https://github.com/${GH_REPO}/blob/${COMMIT_HASH}/docs/demo.gif?raw=true)" >> $GITHUB_STEP_SUMMARY

      - name: No changes
        if: steps.auto-commit.outputs.changes_detected == 'false'
        run: |
          echo "No changes to demo" >> $GITHUB_STEP_SUMMARY
