name: "Website Preview Deploy"

on:
  workflow_run:
    workflows: [Website Preview Build]
    types:
      - completed

env:
  AWS_REGION: us-east-2
  IAM_ROLE_ARN: arn:aws:iam::068007702576:role/cplive-plat-ue2-dev-atmos-docs-gha
  IAM_ROLE_SESSION_NAME: cloudposse-atmos-ci-deploy-pr-${{ github.event.workflow_run.pull_requests[0].number }}
  S3_BUCKET_NAME: cplive-plat-ue2-dev-atmos-docs-origin
  PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
  DEPLOYMENT_HOST: pr-${{ github.event.workflow_run.pull_requests[0].number }}.atmos-docs.ue2.dev.plat.cloudposse.org

# Least-privilege default; the job below declares its own narrower
# job-level permissions that override this baseline.
permissions:
  contents: read

jobs:
  website-deploy-preview:
    # Do not deploy the website to the preview environment if the PR has the label 'website-no-deploy' or the workflow run failed
    if: ${{ github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.pull_requests.*.labels.*.name, 'website-no-deploy')  }}
    runs-on: ubuntu-latest
    environment:
      name: release
    # id-token: write is needed to interact with GitHub's OIDC token endpoint
    # (Configure AWS Credentials); deployments: write for the deployment
    # status updates below.
    permissions:
      contents: read
      id-token: write
      deployments: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            sts.us-east-2.amazonaws.com:443
            *.actions.githubusercontent.com:443
            cplive-plat-ue2-dev-atmos-docs-origin.s3.us-east-2.amazonaws.com:443

      - name: Start deployment
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1
        id: deployment
        with:
          step: start
          env: preview
          override: false
          ref: ${{ github.event.workflow_run.pull_requests[0].head.ref }}

      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # https://github.com/marketplace/actions/configure-aws-credentials-action-for-github-actions
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          role-session-name: ${{ env.IAM_ROLE_SESSION_NAME }}

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: github-app
        with:
          app-id: ${{ vars.BOT_GITHUB_APP_ID }}
          private-key: ${{ secrets.BOT_GITHUB_APP_PRIVATE_KEY }}
          permission-actions: read

      - name: Download artifacts
        uses: ./.github/actions/download-artifact-retry
        with:
          name: website
          path: website/build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ steps.github-app.outputs.token }}

      - name: Copy Website to S3 Bucket PR Folder
        run: |
          ./.github/scripts/s3-deploy-with-charset.sh \
            website/build \
            s3://${{ env.S3_BUCKET_NAME }}/pr-${{ env.PR_NUMBER }}/

      - name: Update deployment status
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1
        if: always()
        with:
          step: finish
          status: ${{ job.status }}
          override: false
          env: ${{ steps.deployment.outputs.env }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env_url: https://${{ env.DEPLOYMENT_HOST }}
          auto_inactive: true
