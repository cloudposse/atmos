name: Setup Go Cache Warmup
on:
  workflow_dispatch:
  schedule:
  # Run at 00:35 UTC (12:35 AM UTC) daily.
  # • Pacific Time (PT): 4:35 PM (previous day)
  # • Mountain Time (MT): 5:35 PM (previous day)
  # • Central Time (CT): 6:35 PM (previous day)
  # • Eastern Time (ET): 7:35 PM (previous day)
    - cron: "35 0 * * *"

permissions:
  contents: read

env:
  ATMOS_BOOTSTRAP_VERSION: "1.223.0"
  # No `|direct` fallback: under harden-runner's block mode a direct fetch
  # only fans out to blocked vanity-import hosts and burns minutes; see the
  # GOPROXY comment in test.yml.
  GOPROXY: "https://proxy.golang.org"

jobs:
  cache-warmup:
    name: Cache warmup (${{ matrix.target }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          # Build (macos-intel) uses this Intel runner and has no self-hosted
          # s3-cache like Linux, so without a nightly warmup here its Go build
          # cache is always cold — risking the 30m build timeout that a warm
          # ARM `macos` cache comfortably avoids.
          - os: macos-15-intel
            target: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Operating-system background services on the hosted Windows and
          # macOS images are listed after the job-specific endpoints; see the
          # `test` job's allowed-endpoints comment in test.yml for the
          # rationale and keep the two lists in sync.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            google.golang.org:443
            modernc.org:443
            www.msftconnecttest.com:443
            ipv6.msftconnecttest.com:443
            www.msftncsi.com:443
            ipv6.msftncsi.com:443
            time.windows.com:443
            client.wns.windows.com:443
            settings-win.data.microsoft.com:443
            *.events.data.microsoft.com:443
            *.update.microsoft.com:443
            ecs.office.com:443
            pti.store.microsoft.com:443
            login.live.com:443
            go.microsoft.com:443
            www.microsoft.com:443
            ocsp.sectigo.com:80
            ocsp.sectigo.com:443
            crl.sectigo.com:80
            crl.sectigo.com:443
            *.apple.com:443
            *.aaplimg.com:443
            *.mzstatic.com:443
            *.icloud.com:443
            *.apple-dns.net:443
            ocsp.usertrust.com:80
            ocsp.digicert.com:80
            *.pool.ntp.org:123

      - name: Add GNU tar to PATH (significantly faster than windows tar)
        if: matrix.target == 'windows'
        shell: pwsh
        run: echo "C:\Program Files\Git\usr\bin" >> $Env:GITHUB_PATH

      - name: Check out code into the Go module directory
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # See test.yml: repairs DNS if harden-runner's Windows post step kills
      # its agent before it has restored the runner's DNS settings.
      - name: Guard DNS against the harden-runner post-step race
        if: matrix.target == 'windows'
        uses: ./.github/actions/windows-dns-guard

      - name: Upload DNS guard log
        # Best-effort diagnostic for the "guard ran but the job still hung"
        # case (see docs/fixes/2026-09-04-dns-guard-log-artifact.md): the log
        # was previously never uploaded, so a residual occurrence of the race
        # this guard exists for couldn't be root-caused after the fact.
        if: always() && matrix.target == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dns-guard-log-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}\atmos-dns-guard.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: "go.mod"
        id: go

      - name: Set up Atmos
        uses: cloudposse/github-action-setup-atmos@60878d48037763f759aedee74e9cc0c2dc88e9ec # v3.5.0
        with:
          atmos-version: ${{ env.ATMOS_BOOTSTRAP_VERSION }}
          install-wrapper: false

      - name: Get deps
        run: go mod download
