name: Tagged release pipeline
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      milestone:
        type: string
        default: ''
      version:
        type: string
        default: ''
      commit:
        type: string
        default: ''
      pr:
        type: string
        default: ''
permissions: {}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.mode == 'feature' && 'feature-releases' || 'release' }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      commit: ${{ steps.prepare.outputs.commit }}
      plan-artifact: ${{ steps.plan.outputs.artifact-id }}
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_GITHUB_APP_ID }}
          private-key: ${{ secrets.BOT_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: read
          permission-pull-requests: read
      - id: prepare
        uses: ./.github/actions/release-prepare
        with:
          mode: ${{ inputs.mode }}
          milestone: ${{ inputs.milestone }}
          version: ${{ inputs.version }}
          commit: ${{ inputs.commit }}
          pr: ${{ inputs.pr }}
          github-token: ${{ steps.token.outputs.token }}
      - id: plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-plan.json
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact: ${{ steps.artifacts.outputs.artifact-id }}
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-build
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          commit: ${{ needs.prepare.outputs.commit }}
      - id: artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/dist
          if-no-files-found: error
          compression-level: 0

  verify:
    needs: [prepare, build]
    outputs:
      release-id: ${{ steps.verify.outputs.release-id }}
      artifact: ${{ steps.sealed.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.mode == 'feature' && 'feature-releases' || 'release' }}
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.plan-artifact }}
          path: ${{ runner.temp }}/release-plan
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: source/dist
          merge-multiple: true
      - id: verify
        uses: ./.github/actions/release-verify
        with:
          signing-workflow-ref: ${{ github.repository }}/.github/workflows/release-pipeline.yml@${{ github.ref }}
          tag: ${{ needs.prepare.outputs.tag }}
          commit: ${{ needs.prepare.outputs.commit }}
          mode: ${{ inputs.mode }}
          plan-file: ${{ runner.temp }}/release-plan/release-plan.json
          app-id: ${{ vars.BOT_GITHUB_APP_ID }}
          app-private-key: ${{ secrets.BOT_GITHUB_APP_PRIVATE_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
      - id: sealed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sealed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-upload
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.mode == 'feature' && 'feature-releases' || 'release' }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.plan-artifact }}
          path: ${{ runner.temp }}/release-plan
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact }}
          path: ${{ runner.temp }}/release-upload
          merge-multiple: true
      - uses: ./.github/actions/release-finalize
        with:
          app-id: ${{ vars.BOT_GITHUB_APP_ID }}
          app-private-key: ${{ secrets.BOT_GITHUB_APP_PRIVATE_KEY }}
          release-id: ${{ needs.verify.outputs.release-id }}
          tag: ${{ needs.prepare.outputs.tag }}
          commit: ${{ needs.prepare.outputs.commit }}
          mode: ${{ inputs.mode }}
          plan-file: ${{ runner.temp }}/release-plan/release-plan.json

  complete:
    needs: [prepare, publish]
    if: inputs.mode == 'cut'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.plan-artifact }}
          path: ${{ runner.temp }}/release-plan
          merge-multiple: true
      - uses: ./.github/actions/setup-go-cache
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_GITHUB_APP_ID }}
          private-key: ${{ secrets.BOT_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
      - name: Complete stable milestone
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_PLAN: ${{ runner.temp }}/release-plan/release-plan.json
        run: go tool mage release:complete "$GITHUB_REPOSITORY" "$RELEASE_PLAN"
