---
# The workflow name **must** be "autofix.ci" for Autofix CI to function correctly.
# Any deviation from this name will cause Autofix CI to fail, as it relies on this
# specific identifier for execution. This is a strict requirement of Autofix CI.
name: autofix.ci
on: pull_request
permissions:
  contents: read
jobs:
  autofix:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: $/.github/actions/harden-runner # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          # No workload endpoints are needed; retain StepSecurity implicit endpoints.
          policies: >-
            none
          # Keep default DNS repair: the runner still needs final job reporting.
      - run: echo "See Atmos Pro"
