name: "Website Deploy Prod"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types:
      - released

# Serialize deploys. The merge queue can land several PRs on main minutes apart, and
# each push triggers a content-aware deploy against the ONE shared origin prefix. Two
# runs in flight at once race: run A uploads its hashed bundles and index.html, then
# run B's manifest delta removes A's bundles (they are not in B's build)
# while A's index.html still references them -- the site goes blank until the next
# deploy. Only the newest pending run is kept per group; the in-flight run is never
# cancelled because aborting mid-sync would leave a half-uploaded site.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  IAM_ROLE_ARN: arn:aws:iam::557075604627:role/cplive-plat-ue2-prod-atmos-docs-gha
  IAM_ROLE_SESSION_NAME: cloudposse-atmos-ci-deploy-release
  S3_BUCKET_NAME: cplive-plat-ue2-prod-atmos-docs-origin
  DEPLOYMENT_HOST: atmos.tools
  # atmos-docs-site-spa (plat-ue2-prod) in cloudposse/infra-live.
  CLOUDFRONT_DISTRIBUTION_ID: E2WVYUGW40ZPA8

# These permissions are needed to interact with the GitHub's OIDC Token endpoint
permissions:
  id-token: write
  contents: read

jobs:
  website-deploy-prod:
    runs-on: ubuntu-24.04

    environment:
      name: production
      url: https://${{ env.DEPLOYMENT_HOST }}

    steps:
      - name: Harden Runner
        uses: $/.github/actions/harden-runner # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          # https://github.com/marketplace/actions/configure-aws-credentials-action-for-github-actions
          policies: >-
            github
            github-releases
            github-content
            github-actions
            telemetry
            website-build
            go-proxy
            go-toolchain
            website-production-storage
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # pnpm before Node: setup-node's pnpm-store cache needs the pnpm binary
      # on PATH to locate the store. Previously nothing cached the store and
      # `pnpm install --frozen-lockfile` downloaded the full dependency tree
      # on every run.
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: "website/.nvmrc"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Set up Go
        uses: ./.github/actions/setup-go-cache
        with:
          go-version-file: "go.mod"

      # Retry downloads for modules missing from the restored cache so a
      # transient proxy.golang.org reset cannot abort schema generation; see
      # docs/fixes/2026-08-25-build-atmos-go-mod-download-retry.md.
      - name: Download Go modules (with retry)
        uses: ./.github/actions/go-mod-download-retry

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          role-session-name: ${{ env.IAM_ROLE_SESSION_NAME }}

      - name: Publish atmos-manifest schema
        uses: ./.github/actions/publish-atmos-schema
        with:
          schema-name: atmos-manifest
          subcommand: stack schema
          s3-bucket: ${{ env.S3_BUCKET_NAME }}
          release-tag: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

      - name: Publish atmos-config schema
        uses: ./.github/actions/publish-atmos-schema
        with:
          schema-name: atmos-config
          subcommand: config schema
          s3-bucket: ${{ env.S3_BUCKET_NAME }}
          release-tag: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

      - name: Install Dependencies and Build Website
        run: |
          node --version
          # Wall-clock plugin data changes content-hashed bundles and thousands
          # of HTML references, defeating the incremental S3 uploader.
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          cd website
          pnpm install --frozen-lockfile
          pnpm run test:build-timestamp
          pnpm run build:site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Builds can outlive the initial AWS session; refresh before deployment.
      - name: Refresh AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          role-session-name: ${{ env.IAM_ROLE_SESSION_NAME }}

      # `s3 sync --delete` can remove hashed JS/CSS bundles that an edge location's
      # cached `index.html` from the previous deploy still references (the
      # distribution's default cache behavior floors caching at
      # cloudfront_min_ttl=60s regardless of origin Cache-Control headers), so this
      # also invalidates the distribution -- see s3-deploy/action.yml. The deploy
      # role already has cloudfront:CreateInvalidation on this distribution
      # (infra-live github-actions-iam-policy.tf).
      - name: Copy Website to S3 Bucket
        uses: ./.github/actions/s3-deploy
        with:
          local-dir: website/build
          s3-uri: s3://${{ env.S3_BUCKET_NAME }}/
          cloudfront-distribution-id: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}

      - name: Trigger ReIndexing of atmos.tools and docs.cloudposse.com Docs
        run: |
          curl \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.TRIGGER_DOCS_REDEPLOY_WORKFLOW_REFARCH }}" \
            -H "Accept: application/vnd.github.everest-preview+json" \
            https://api.github.com/repos/cloudposse/refarch-scaffold/dispatches \
            -d '{"event_type": "reindex"}'

  # Algolia crawler config deploy + reindex are owned by .github/workflows/algolia.yaml,
  # which is triggered via workflow_run after this workflow succeeds. That ordering
  # guarantees the reindex runs against the freshly-deployed site AND the just-PATCHed
  # crawler config — neither can race the other.
