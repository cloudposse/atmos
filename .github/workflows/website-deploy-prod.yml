name: "Website Deploy Prod"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types:
      - released

# Serialize deploys. The merge queue can land several PRs on main minutes apart, and
# each push triggers a deploy that runs `aws s3 sync --delete` against the ONE shared
# origin prefix. Two runs in flight at once race: run A uploads its hashed bundles and
# index.html, then run B's --delete removes A's bundles (they are not in B's build)
# while A's index.html still references them -- the site goes blank until the next
# deploy. Only the newest pending run is kept per group; the in-flight run is never
# cancelled because aborting mid-sync would leave a half-uploaded site.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  IAM_ROLE_ARN: arn:aws:iam::557075604627:role/cplive-plat-ue2-prod-atmos-docs-gha
  IAM_ROLE_SESSION_NAME: cloudposse-atmos-ci-deploy-release
  S3_BUCKET_NAME: cplive-plat-ue2-prod-atmos-docs-origin
  DEPLOYMENT_HOST: atmos.tools

# These permissions are needed to interact with the GitHub's OIDC Token endpoint
permissions:
  id-token: write
  contents: read

jobs:
  website-deploy-prod:
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://${{ env.DEPLOYMENT_HOST }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            sts.us-east-2.amazonaws.com:443
            *.actions.githubusercontent.com:443
            github.com:443
            api.github.com:443
            nodejs.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            storage.googleapis.com:443
            us.i.posthog.com:443
            cplive-plat-ue2-prod-atmos-docs-origin.s3.us-east-2.amazonaws.com:443
            api.scorecard.dev:443
            www.bestpractices.dev:443

      # https://github.com/marketplace/actions/configure-aws-credentials-action-for-github-actions
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          role-session-name: ${{ env.IAM_ROLE_SESSION_NAME }}

      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # pnpm before Node: setup-node's pnpm-store cache needs the pnpm binary
      # on PATH to locate the store. Previously nothing cached the store and
      # `pnpm install --frozen-lockfile` downloaded the full dependency tree
      # on every run.
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: "website/.nvmrc"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Set up Go
        # setup-go v6 requires runner v2.327.1+ and can affect toolchain handling.
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: "go.mod"

      # `go run .` below has no prior module cache warm-up, so a single
      # mid-stream proxy.golang.org reset (e.g. "stream error: ...
      # INTERNAL_ERROR; received from peer") aborts it outright -- see
      # docs/fixes/2026-08-25-build-atmos-go-mod-download-retry.md.
      - name: Download Go modules (with retry)
        uses: ./.github/actions/go-mod-download-retry

      - name: Publish atmos-manifest schema
        uses: ./.github/actions/publish-atmos-schema
        with:
          schema-name: atmos-manifest
          subcommand: stack schema
          s3-bucket: ${{ env.S3_BUCKET_NAME }}
          release-tag: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

      - name: Publish atmos-config schema
        uses: ./.github/actions/publish-atmos-schema
        with:
          schema-name: atmos-config
          subcommand: config schema
          s3-bucket: ${{ env.S3_BUCKET_NAME }}
          release-tag: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

      - name: Install Dependencies and Build Website
        run: |
          node --version
          cd website
          pnpm install --frozen-lockfile
          pnpm run build:site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy Website to S3 Bucket
        uses: ./.github/actions/s3-deploy
        with:
          local-dir: website/build
          s3-uri: s3://${{ env.S3_BUCKET_NAME }}/

      - name: Trigger ReIndexing of atmos.tools and docs.cloudposse.com Docs
        run: |
          curl \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.TRIGGER_DOCS_REDEPLOY_WORKFLOW_REFARCH }}" \
            -H "Accept: application/vnd.github.everest-preview+json" \
            https://api.github.com/repos/cloudposse/refarch-scaffold/dispatches \
            -d '{"event_type": "reindex"}'

  # Algolia crawler config deploy + reindex are owned by .github/workflows/algolia.yaml,
  # which is triggered via workflow_run after this workflow succeeds. That ordering
  # guarantees the reindex runs against the freshly-deployed site AND the just-PATCHed
  # crawler config — neither can race the other.
