name: Quality Gate Signal

# Fork review events have read-only tokens. This workflow executes no checkout;
# completion wakes the trusted default-branch CI Timing Summary coordinator.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, labeled, unlabeled, milestoned, demilestoned, closed, enqueued, dequeued]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions: {}

jobs:
  signal:
    # Avoid allocating a signal runner for unrelated labels. A skipped workflow
    # can still emit workflow_run; reporters always recompute live state.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      contains(fromJSON('["major","minor","patch","no-release"]'), github.event.label.name)
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Notify trusted quality reporter
        run: 'true'
