name: CI Timing Summary

on:
  # GitHub does not have a native "all PR workflows completed" event. Every
  # relevant completion invokes this coordinator; it calls the quality
  # reporter only when all latest workflows/jobs for the PR head are complete.
  # Keep this list in sync with workflows that can run for an open PR.
  workflow_run:
    workflows:
      - Algolia
      - Benchmarks
      - Quality Gate Signal
      - atmos.ci
      - autofix.ci
      - Claude Quality Checks
      - CodeQL
      - Dependency Review
      - Feature release
      - Go Version Change Detection
      - install.sh smoke
      - landing-demos
      - Link Check
      - Native CI
      - Planfile Artifacts E2E
      - Planfile Verify E2E
      - PR Size Labeler
      - Pre-commit
      - Release Documentation Check
      - Screengrabs
      - Tests
      - TruffleHog secret scan
      - Validate Agent Skills
      - Validate Codeowners
      - Validation E2E
      - Verify Repository Symlinks
      - Verify SHA Pinning
      - Version Tracker
      - Website Preview Build
    types: [completed]

# Deny by default; the coordinator job grants only the API access it uses.
permissions: {}

# A later completion for the same commit supersedes an older coordinator. The
# action also verifies the PR still points at this SHA immediately before write.
concurrency:
  group: ci-timing-summary-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  summarize:
    # Admit runs explicitly associated with a PR even when their original event
    # was workflow_dispatch or another non-PR event. The action still verifies
    # that the open PR points at the triggering run's exact head SHA.
    if: >-
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'pull_request_target' ||
      github.event.workflow_run.pull_requests[0].number > 0
    outputs:
      published: ${{ steps.timing.outputs.published }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      # Required to create and update timing comments on pull requests.
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: $/.github/actions/harden-runner
        with:
          # workflow_run executes with default-branch privileges. Load only the
          # reviewed action implementation from that branch, never from the PR.
          policies: >-
            github
      - name: Check out timing action from the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/stopwatch

      - name: Update sticky CI timing comment
        id: timing
        uses: ./.github/actions/stopwatch
        with:
          github-token: ${{ github.token }}
          workflow-run-id: ${{ github.event.workflow_run.id }}
          settle-seconds: "30"

  quality-report:
    needs: summarize
    if: needs.summarize.outputs.published == 'true'
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: write
      issues: write
    uses: ./.github/workflows/quality-report.yml
