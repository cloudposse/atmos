name: Nightly Builds
on:
  workflow_dispatch:
  schedule:
  # Run at 00:15 UTC (12:15 AM UTC) daily.
  # • Pacific Time (PT): 4:15 PM (previous day)
  # • Mountain Time (MT): 5:15 PM (previous day)
  # • Central Time (CT): 6:15 PM (previous day)
  # • Eastern Time (ET): 7:15 PM (previous day)
    - cron: "15 0 * * *"

# Matches feature-release.yml's permissions for the same reusable release
# workflow (shared-go-auto-release.yml) called with publish: true below.
permissions:
  attestations: write
  contents: write
  id-token: write
  pull-requests: write
  packages: write
  issues: write

jobs:
  release:
    uses: cloudposse/.github/.github/workflows/shared-go-auto-release.yml@49ac8cd5c4cf74abdbf24a80027cd3bde811133a # main
    with:
      publish: true
      format: binary
      prerelease: true
      runs-on: '["runs-on=${{github.run_id}}", "runner=large", "tag=atmos","extras=s3-cache", "private=false"]'
    # Explicit least-privilege list instead of `secrets: inherit` -- the full set this
    # reusable workflow (and its own nested reusable-workflow calls) actually consumes,
    # traced through cloudposse/.github's shared-go-auto-release.yml -> shared-auto-release.yml.
    secrets:
      BOT_GITHUB_APP_PRIVATE_KEY: ${{ secrets.BOT_GITHUB_APP_PRIVATE_KEY }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PRIVATE_KEY_PASSPHRASE: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}
