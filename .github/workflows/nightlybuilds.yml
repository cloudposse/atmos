name: Nightly Builds
on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"
permissions: {}
concurrency:
  group: atmos-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-pipeline.yml
    # Required for environment-secret resolution in reusable workflows (actions/runner#4453).
    secrets: inherit
    with:
      mode: nightly
