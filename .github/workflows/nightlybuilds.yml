name: Nightly Builds
on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"
permissions: {}
concurrency:
  group: atmos-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-pipeline.yml
    # Named forwarding also enables secrets defined only in the called job environment.
    secrets:
      BOT_GITHUB_APP_PRIVATE_KEY: ${{ secrets.BOT_GITHUB_APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    with:
      mode: nightly
