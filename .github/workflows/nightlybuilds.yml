name: Nightly Builds
on:
  workflow_dispatch:
  schedule:
  # Run at 00:15 UTC (12:15 AM UTC) daily.
  # • Pacific Time (PT): 4:15 PM (previous day)
  # • Mountain Time (MT): 5:15 PM (previous day)
  # • Central Time (CT): 6:15 PM (previous day)
  # • Eastern Time (ET): 7:15 PM (previous day)
    - cron: "15 0 * * *"

permissions:
  contents: read

jobs:
  release:
    # Matches feature-release.yml's permissions for the same reusable release
    # workflow (shared-go-auto-release.yml) called with publish: true below.
    # Scoped to this job (the workflow's only job) instead of the top level:
    # OpenSSF Scorecard's Token-Permissions check penalizes top-level
    # contents/packages/actions write grants heavily (they apply workflow-wide
    # by default), but doesn't penalize the same grant scoped to the job that
    # actually needs it -- same effective access, better score.
    permissions:
      attestations: write
      contents: write
      id-token: write
      pull-requests: write
      packages: write
      issues: write
    uses: cloudposse/.github/.github/workflows/shared-go-auto-release.yml@8293d764b32a1211aacc40e24328f13e8fc5cf32 # main
    with:
      # shared-go-auto-release.yml declares publish/prerelease as `type: string`,
      # not boolean — quote/stringify these so the values match the declared
      # input type.
      publish: 'true'
      format: binary
      prerelease: 'true'
      runs-on: '["runs-on=${{github.run_id}}", "runner=large", "tag=atmos","extras=s3-cache", "private=false"]'
    # `secrets: inherit`, not an explicit map: shared-go-auto-release.yml doesn't declare a
    # `workflow_call.secrets:` schema, so GitHub rejects a named-secret map against it outright
    # (observed as a startup_failure -- "likely failed because of a workflow file issue" -- with
    # zero jobs ever created, on both test.yml and feature-release.yml after an earlier attempt
    # to narrow this to an explicit list).
    secrets: inherit
