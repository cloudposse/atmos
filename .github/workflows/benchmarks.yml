name: Benchmarks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOPROXY: https://proxy.golang.org
      ATMOS_BENCH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
      - name: Check out measured revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Go and restore build cache
        uses: ./.github/actions/setup-go-cache
      - name: Collect measurements
        run: go tool mage bench:run build/benchmarks/candidate
      - name: Save measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/benchmarks/candidate/manifest.json
            build/benchmarks/candidate/bench.txt
          retention-days: 90
          if-no-files-found: warn
