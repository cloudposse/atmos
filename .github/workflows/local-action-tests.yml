name: Local action tests

on:
  pull_request:
    paths:
      - '.atmos.d/test.yaml'
      - 'magefiles/localactions/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.goreleaser.yml'
      - 'magefiles/release/**'
      - 'internal/releaseidentity/**'
      - 'pkg/version/**'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - '.atmos.d/test.yaml'
      - 'magefiles/localactions/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.goreleaser.yml'
      - 'magefiles/release/**'
      - 'internal/releaseidentity/**'
      - 'pkg/version/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-action-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Action scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Set up pinned Atmos
        uses: $/.github/actions/setup-atmos-bootstrap
        with:
          atmos-version: '1.233.0'

      - name: Test standalone JavaScript scripts
        run: atmos test local-actions javascript

      - name: Test Python actions
        run: atmos test local-actions python

      - name: Test packaged JavaScript and TypeScript actions
        run: atmos test local-actions packages

  release-rehearsal:
    name: Release guard and GoReleaser rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.18.3'
          install-only: true

      - name: Validate production GoReleaser configuration
        run: goreleaser check --config .goreleaser.yml

      - name: Test Starlark action test orchestration
        run: go test -race -count=1 ./magefiles/localactions

      - name: Test all release guards and rehearse stable, nightly and feature builds
        env:
          ATMOS_TEST_GORELEASER: goreleaser
        run: go test -tags=mage -race -count=1 -v ./magefiles/release ./internal/releaseidentity ./pkg/version
