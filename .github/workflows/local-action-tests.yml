name: Local action tests

on:
  pull_request:
    paths:
      - '.claude/hooks/**'
      - '.atmos.d/test.yaml'
      - '.atmos.d/release.yaml'
      - 'magefiles/localactions/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.goreleaser.yml'
      - '.github/release-notes.yml'
      - 'magefiles/release/**'
      - 'magefiles/qualitygate/**'
      - 'magefiles/internal/githubapi/**'
      - 'magefiles/internal/githubtest/**'
      - 'internal/releaseidentity/**'
      - 'pkg/version/**'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - '.claude/hooks/**'
      - '.atmos.d/test.yaml'
      - '.atmos.d/release.yaml'
      - 'magefiles/localactions/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.goreleaser.yml'
      - '.github/release-notes.yml'
      - 'magefiles/release/**'
      - 'magefiles/qualitygate/**'
      - 'magefiles/internal/githubapi/**'
      - 'magefiles/internal/githubtest/**'
      - 'internal/releaseidentity/**'
      - 'pkg/version/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-action-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Action scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Set up pinned Atmos
        uses: $/.github/actions/setup-atmos-bootstrap # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          atmos-version: '1.233.0'

      - name: Test standalone JavaScript scripts
        run: atmos test local-actions javascript

      - name: Test Python actions
        run: atmos test local-actions python

      - name: Test packaged JavaScript and TypeScript actions
        run: atmos test local-actions packages

  release-rehearsal:
    name: Release process tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go-cache
        with:
          go-version-file: go.mod

      # Both the contract tests and the race-enabled rehearsal compile CGO dependencies.
      - name: Install package inspection tools and Linux build dependencies
        run: |
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libarchive-tools libudev-dev pkg-config

      - name: Validate release action contracts before the build rehearsal
        run: go test -tags=mage ./magefiles/release -run 'TestRelease(CompositeActions|GuardInput|LocalActionInput)' -count=1

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: 'v2.18.3'
          install-only: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Validate production GoReleaser configuration
        run: goreleaser check --config .goreleaser.yml

      - name: Test Starlark action test orchestration
        run: go test -race -count=1 ./magefiles/localactions

      - name: Test all release guards and rehearse stable, nightly and feature builds
        env:
          ATMOS_TEST_GORELEASER: goreleaser
        run: go test -tags=mage -race -count=1 -v -coverprofile=release-coverage.out ./magefiles/release/... ./magefiles/qualitygate ./internal/releaseidentity ./pkg/version

      # This focused report contains only release-related packages. Publishing
      # it separately makes Codecov report inflated project coverage before
      # the acceptance suite finishes. test.yml owns the aggregate upload and
      # already includes magefiles coverage; retain this rehearsal for diagnosis.
      - name: Save release rehearsal coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rehearsal-coverage
          path: release-coverage.out
          if-no-files-found: error
          retention-days: 7
