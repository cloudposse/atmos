name: Local action tests

on:
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.goreleaser.yml'
      - 'magefiles/release/**'
      - 'internal/releaseidentity/**'
      - 'pkg/version/**'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.goreleaser.yml'
      - 'magefiles/release/**'
      - 'internal/releaseidentity/**'
      - 'pkg/version/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-action-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Action scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      # Discover offline suites before installing npm dependencies. The live
      # verify-sha-pinning/test.mjs smoke test is intentionally not a *.test file.
      - name: Test standalone JavaScript scripts
        run: |
          suites=()
          while IFS= read -r -d '' suite; do
            suites+=("$suite")
          done < <(find .github/actions .github/scripts -type d \( -name node_modules -o -name dist \) -prune -o -type f \( -name '*.test.cjs' -o -name '*.test.mjs' \) -print0)
          test "${#suites[@]}" -gt 0
          node --test --experimental-test-coverage "${suites[@]}"

      - name: Test Python actions
        run: |
          shopt -s nullglob
          count=0
          for action in .github/actions/*/; do
            suites=("$action"test_*.py)
            if (( ${#suites[@]} > 0 )); then
              python -m unittest discover -s "$action" -p 'test_*.py' -v
              count=$((count + 1))
            fi
          done
          test "$count" -gt 0

      - name: Test packaged JavaScript and TypeScript actions
        run: |
          shopt -s nullglob
          packages=(.github/actions/*/package.json)
          test "${#packages[@]}" -gt 0
          for package in "${packages[@]}"; do
            action="${package%/package.json}"
            npm ci --prefix "$action"
            npm test --prefix "$action"
            npm run typecheck --if-present --prefix "$action"
          done

  release-rehearsal:
    name: Release guard and GoReleaser rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install pinned GoReleaser and validate production configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.18.3'
          args: check --config .goreleaser.yml

      - name: Test all release guards and rehearse stable, nightly and feature builds
        env:
          ATMOS_TEST_GORELEASER: goreleaser
        run: go test -tags=mage -race -count=1 -v ./magefiles/release ./internal/releaseidentity ./pkg/version
