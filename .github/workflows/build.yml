name: "Build CLI and attach to GitHub release"

on:
  release:
    types: [published]

  workflow_dispatch:

# Least-privilege default; every job below declares its own job-level
# permissions that override this baseline (job-level permissions REPLACE,
# not extend, this block).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    # Matches exactly what shared-release-branches.yml itself requests
    # (id-token/contents/pull-requests) — a reusable workflow's effective
    # permissions are the caller job's grant intersected with what the
    # callee declares, so granting more here wouldn't reach it anyway.
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    uses: cloudposse/.github/.github/workflows/shared-release-branches.yml@281621d6f2e63a883ea884559ffdbb4895c1bd98 # main
    # `secrets: inherit`, not an explicit map: shared-release-branches.yml doesn't declare a
    # `workflow_call.secrets:` schema, so GitHub rejects a named-secret map against it outright
    # (this job only triggers on `release`/`workflow_dispatch`, not `pull_request`, so the
    # earlier attempt to narrow this never actually ran here -- but test.yml and
    # feature-release.yml hit the identical mistake against shared-go-auto-release.yml, which
    # has the same missing-schema shape, and failed with a startup_failure).
    secrets: inherit

  homebrew:
    if: ${{ github.event.release.prerelease == false }}
    name: "Bump Homebrew formula"
    runs-on: ubuntu-latest
    needs: release
    environment: release
    # Authenticates via secrets.GH_BOT_TOKEN, not GITHUB_TOKEN — no elevated
    # GITHUB_TOKEN scope needed.
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # No StepSecurity telemetry found across 3 sampled release runs despite
          # this job succeeding on GitHub — a data gap (rare release-only trigger),
          # not zero egress. Stays audit until a real run can be sampled.
          egress-policy: audit

      # dawidd6/action-homebrew-bump-formula wraps `brew bump-formula-pr`, but its
      # Ruby git helper calls Homebrew's `safe_system`, which the Homebrew 5.x now
      # on GitHub runners no longer exposes to the module scope, so the action dies
      # with "undefined method 'safe_system' for module Homebrew". Upstream reverted
      # their Homebrew-5 fix, so bumping the pin to v8 does not help (identical
      # code). Call the wrapped command directly instead - it is unaffected by the
      # wrapper bug. atmos lives in Homebrew/homebrew-core; bump-formula-pr forks it
      # under the bot and opens the version-bump PR.
      #
      # bump-formula-pr is a developer command that edits the formula's `.rb` file,
      # so it needs homebrew/core checked out as a local tap. A fresh runner uses
      # the formulae API with no tap, so bump-formula-pr fails with "No available
      # formula with the name atmos" (verified across
      # v1.228.0/v1.229.0/v1.230.0/v1.230.1/v1.231.0 release runs). Dropping
      # HOMEBREW_NO_INSTALL_FROM_API never fixed this because the tap was still
      # absent either way. The step below taps homebrew/core explicitly so the
      # formula file exists; once tapped, bump-formula-pr resolves and edits atmos
      # and opens the version-bump PR. Leave HOMEBREW_NO_INSTALL_FROM_API unset - it
      # is unnecessary once the tap is present.
      - name: "Bump Homebrew formula"
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # An unspecified-`shell` Linux `run:` step runs under `bash -e {0}` - a
          # non-login, non-interactive shell that does not source /etc/profile.d/*,
          # so the runner-preinstalled Homebrew's PATH entry
          # (/home/linuxbrew/.linuxbrew/bin) is never loaded and `brew` resolves to
          # "command not found" (exit 127) - the bump silently failed on every
          # release. Load Homebrew explicitly here instead of relying on a login
          # shell (see docs/fixes).
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          # bump-formula-pr edits the formula `.rb`, so homebrew/core must be tapped
          # (see the comment above). Without this the bump fails "No available
          # formula with the name atmos" on every release.
          brew tap homebrew/core
          brew bump-formula-pr --no-browse --no-audit --version="${TAG#v}" atmos

  docker:
    name: "Build and push Docker image for Atmos CLI"
    runs-on: ubuntu-latest
    needs: release
    if: ${{ github.event_name == 'release' }}
    # The pushed image reference, for jobs that run inside it (plugin-version).
    outputs:
      image: ${{ steps.build.outputs.image }}
      tag: ${{ steps.build.outputs.tag }}
    # Job-level permissions REPLACE (not extend) the workflow-level block above,
    # so everything this job needs must be re-listed here: contents/packages for
    # the checkout+push, id-token for cosign keyless signing, security-events for
    # the Trivy SARIF upload.
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # No StepSecurity telemetry found across sampled release runs despite
          # this job succeeding on GitHub — a data gap (rare release-only trigger),
          # not zero egress. Stays audit until a real run can be sampled.
          egress-policy: audit

      - name: "Checkout source code at current commit"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: "Docker Build"
        id: build
        uses: cloudposse/github-action-docker-build-push@ff59bd5b5c0c953aef60f5eb9b80178fff407597 # v3.2.1
        with:
          registry: ghcr.io
          organization: "${{ github.event.repository.owner.login }}"
          repository: "${{ github.event.repository.name }}"
          login: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
          platforms: linux/amd64,linux/arm64
          binfmt-image: mirror.gcr.io/tonistiigi/binfmt:qemu-v7.0.0
          file: Dockerfile
          build-args: |
            ATMOS_VERSION=${{ github.event.release.tag_name }}
          provenance: true
          sbom: true

      - name: "Verify Image"
        env:
          DOCKER_IMAGE: ${{ steps.build.outputs.image }}
          DOCKER_TAG: ${{ steps.build.outputs.tag }}
        run: |
          docker pull "$DOCKER_IMAGE:$DOCKER_TAG"

      - name: "Install cosign"
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless OIDC signing — no key material, no secrets. Verifiable with:
      #   cosign verify <image>@<digest> \
      #     --certificate-identity-regexp='^https://github.com/cloudposse/atmos/' \
      #     --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      - name: "Sign image with cosign"
        env:
          DOCKER_IMAGE: ${{ steps.build.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${DOCKER_IMAGE}@${DIGEST}"

      # Non-blocking (exit-code: 0) for now — surface findings via the code-scanning
      # tab first and triage before flipping this to a release-blocking gate.
      - name: "Scan image with Trivy"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.image }}:${{ steps.build.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          scanners: vuln,secret
          exit-code: '0'

      - name: "Upload Trivy scan results to code-scanning"
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-results.sarif

      - name: "Job Summary"
        env:
          DOCKER_IMAGE: ${{ steps.build.outputs.image }}
          DOCKER_TAG: ${{ steps.build.outputs.tag }}
        run: |
          echo "## Docker Image Summary" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          docker inspect "$DOCKER_IMAGE:$DOCKER_TAG" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # Keeps the Claude Code plugin manifests (agent-skills/.claude-plugin/plugin.json
  # and .claude-plugin/marketplace.json) in step with each stable release, so
  # `claude plugin update` can see new skills (#2895). Runs inside the image the
  # `docker` job just pushed: `atmos version track update` resolves the latest
  # release (version.dependencies.atmos in atmos.yaml) and `apply` rewrites both
  # manifests (version.files, json manager), then a PR carries the change.
  #
  # A sibling job rather than a workflow triggered by the image's
  # `registry_package` event: the image is pushed with the default GITHUB_TOKEN,
  # and GitHub does not start workflow runs from events that token causes, so
  # that trigger would likely never fire. `needs: docker` also guarantees the
  # image exists before `container:` pulls it.
  plugin-version:
    name: "Update Claude Code plugin version"
    runs-on: ubuntu-latest
    needs: docker
    if: ${{ github.event.release.prerelease == false }}
    # Same environment as the other release jobs that mint a token from the
    # GitHub App (see release-major-tag.yml).
    environment: release
    # The default GITHUB_TOKEN only reads (release lookups); every write goes
    # through the GitHub App token below.
    permissions:
      contents: read
    container:
      image: ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag }}
    steps:
      - name: "Checkout the default branch"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: "Update plugin manifests from the resolved atmos version"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          atmos version track update
          atmos version track apply
          echo "PLUGIN_VERSION=$(atmos version track get atmos)" >> "$GITHUB_ENV"

      - name: "Generate a token"
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: github-app
        with:
          app-id: ${{ vars.BOT_GITHUB_APP_ID }}
          private-key: ${{ secrets.BOT_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: "Create or update PR"
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.github-app.outputs.token }}
          branch: "chore/update-plugin-version"
          title: "chore: bump Claude Code plugin version to ${{ env.PLUGIN_VERSION }}"
          delete-branch: true
          sign-commits: true
          add-paths: |
            agent-skills/.claude-plugin/plugin.json
            .claude-plugin/marketplace.json
            versions.lock.yaml
          commit-message: |
            chore: bump Claude Code plugin version to ${{ env.PLUGIN_VERSION }}
          base: ${{ github.event.repository.default_branch }}
          labels: "no-release"

  # Rebuilds the release binaries from source at the published tag and
  # replaces GoReleaser's already-published assets with natively signed/SBOM'd
  # ones — see .goreleaser.yml's `signs:`/`sboms:` blocks. Deliberately runs a
  # *real* `goreleaser release` again here (idempotent: .goreleaser.yml's
  # release: block already has replace_existing_artifacts: true, mode:
  # keep-existing, specifically to make repeated runs against the same tag
  # safe) rather than downloading and re-signing already-published assets —
  # signing what this job actually built, not what it fetched, closes a real
  # TOCTOU gap: anything able to tamper with a just-published release asset in
  # a download-then-sign window would get a valid-looking signature over
  # tampered bytes. See docs/prd/native-goreleaser-release-pipeline.md.
  #
  # Gated the same as `docker` (any release event, not homebrew's
  # prerelease==false) so this is exercisable pre-merge: label a non-draft PR
  # `release/feature` to publish a real prerelease and fire this job.
  sign-and-attest-release:
    name: "Rebuild, sign, SBOM, and attest release artifacts"
    runs-on: ubuntu-latest
    needs: release
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # No StepSecurity telemetry found across sampled release runs despite
          # this job succeeding on GitHub — a data gap (rare release-only trigger),
          # not zero egress. Stays audit until a real run can be sampled.
          egress-policy: audit

      - name: "Checkout source at release tag"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up Go"
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: "Install cosign"
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # syft binary that .goreleaser.yml's sboms: block shells out to.
      - name: "Install syft"
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: "Run goreleaser release"
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # This job runs on `release: published`, so the GitHub Release already
          # exists with its assets from the draft build. `--skip=publish` rebuilds
          # dist/* locally for provenance attestation without re-PATCHing the
          # release; without it GoReleaser tries to update target_commitish, which
          # GitHub rejects on a published release (422 Validation Failed).
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # .goreleaser.yml's nfpms: block already built dist/*.deb, dist/*.rpm,
      # dist/*.apk above and attached them to the GitHub Release directly.
      # Pushing those same packages to Cloudsmith (currently done by an
      # external pipeline this repo doesn't own — see
      # docs/prd/native-goreleaser-release-pipeline.md) is intentionally left
      # commented out: the real Cloudsmith org/repo/distro names and an API
      # key secret are unknown from this repo today. Wire this up in a
      # follow-up PR once those are confirmed — do not uncomment with the
      # placeholder values below as-is.
      #
      # - name: "Push packages to Cloudsmith"
      #   env:
      #     CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      #   run: |
      #     pip install --user cloudsmith-cli
      #     for f in dist/*.deb; do cloudsmith push deb <CLOUDSMITH_ORG>/<CLOUDSMITH_REPO>/any-distro/any-version "$f"; done
      #     for f in dist/*.rpm; do cloudsmith push rpm <CLOUDSMITH_ORG>/<CLOUDSMITH_REPO>/any-distro/any-version "$f"; done
      #     for f in dist/*.apk; do cloudsmith push alpine <CLOUDSMITH_ORG>/<CLOUDSMITH_REPO>/alpine/edge "$f"; done

      # Real Sigstore-backed provenance for every binary this job just built
      # locally — no longer a re-fetch, so this is genuine build-time
      # GitHub-native attestation stacked on top of cosign (a different
      # verification mechanism/consumer than cosign, e.g. `gh attestation
      # verify`), not a second re-fetch-and-sign layer.
      - name: "Attest build provenance"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: "Resolve checksums file"
        id: checksums
        run: |
          file="$(find dist -maxdepth 1 -name '*_SHA256SUMS' -print -quit)"
          if [ -z "$file" ]; then
            echo "No *_SHA256SUMS file found in dist/" >&2
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      # Bind a source-tree SBOM to the checksums file — it already commits to
      # every binary's exact digest, so it's a well-defined single-artifact
      # anchor for a release that ships multiple platform binaries. Separate
      # from .goreleaser.yml's per-archive sboms: block (bound to individual
      # archives, uploaded to the release directly by GoReleaser itself).
      - name: "Generate and attest source-tree SBOM"
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/atmos-sbom.spdx.json

      - name: "Attest SBOM"
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.checksums.outputs.file }}
          sbom-path: dist/atmos-sbom.spdx.json

      - name: "Upload source-tree SBOM to the release"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" dist/atmos-sbom.spdx.json \
            --repo "${{ github.repository }}" --clobber
