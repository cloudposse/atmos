name: Official plugin packages
on:
  workflow_call:
permissions:
  contents: read
  packages: read
env:
  ATMOS_CI: 'true'
  CGO_ENABLED: '0'
  GOWORK: 'off'
  GOFLAGS: '-trimpath -buildvcs=false'
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-atmos-install
        with:
          target: linux
          path: ${{ runner.temp }}/release-tools
          add-to-path: 'true'
      - uses: ./.github/actions/setup-go-cache
        with:
          # Official plugins build in their own modules. plugins/terragrunt requires the newest Go in the repository.
          go-version-file: plugins/terragrunt/go.mod
          cache: 'false'
      # A stacked pull request targets its parent branch, so the default comparison base would demand a
      # version bump in every layer that touches a package input. Compare such pull requests with the merge
      # base of the default branch instead, the same range the whole stack is released against. Pushes and
      # pull requests that target the default branch keep the provider's default base.
      # The inventory --check also compares packed bytes with any published version in the registry,
      # so a child cannot reuse its parent's published version for different package bytes.
      - name: Resolve the release comparison base
        id: base
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref != github.event.repository.default_branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # Fail rather than fall back to the PR target when the branches share no history.
        run: |
          base="$(git merge-base HEAD "origin/${DEFAULT_BRANCH}")"
          echo "ref=${base}" >> "$GITHUB_OUTPUT"
      - name: Check plugin releases
        env:
          GOCACHE: ${{ runner.temp }}/plugin-go-build
          GOMODCACHE: ${{ runner.temp }}/plugin-go-mod
          RELEASE_BASE: ${{ steps.base.outputs.ref }}
          GITHUB_TOKEN: ${{ github.token }}
          ATMOS_GITHUB_USERNAME: ${{ github.actor }}
        run: atmos plugin release --inventory plugins/releases.yaml --check ${RELEASE_BASE:+--base "$RELEASE_BASE"}

  release:
    needs: check
    if: github.repository == 'cloudposse/atmos' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: plugin-release
    concurrency:
      group: official-plugin-releases
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-atmos-install
        with:
          target: linux
          path: ${{ runner.temp }}/release-tools
          add-to-path: 'true'
      - uses: ./.github/actions/setup-go-cache
        with:
          # Official plugins build in their own modules. plugins/terragrunt requires the newest Go in the repository.
          go-version-file: plugins/terragrunt/go.mod
          cache: 'false'
      - name: Publish plugin releases and reconcile the catalog
        env:
          GOCACHE: ${{ runner.temp }}/plugin-go-build
          GOMODCACHE: ${{ runner.temp }}/plugin-go-mod
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATMOS_GITHUB_USERNAME: ${{ github.actor }}
        run: >-
          atmos plugin release --inventory plugins/releases.yaml
          --sign --yes --verify-public --catalog cloudposse
