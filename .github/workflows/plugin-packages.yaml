name: Official plugin packages

on:
  pull_request:
    paths: ['plugins/**', 'sdk/**', 'proto/**', 'pkg/plugin/**', '.github/scripts/plugin_release/**', '.github/workflows/plugin-packages.yaml']
  push:
    branches: [main]
    paths: ['plugins/**', 'sdk/**', 'proto/**', 'pkg/plugin/**', '.github/scripts/plugin_release/**', '.github/workflows/plugin-packages.yaml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  GOWORK: 'off'
  GOFLAGS: '-trimpath -buildvcs=false'

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3 coverage==7.10.7
      - name: Test release planning and public publication gates
        run: |
          python3 -m coverage run --source=.github/scripts/plugin_release -m unittest discover -s .github/scripts/plugin_release -p 'test_*.py'
          python3 -m coverage report --fail-under=90 --omit='*/test_*.py'
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=()
          if [[ -n "$BASE" && "$BASE" != 0000000000000000000000000000000000000000 ]]; then args+=(--base "$BASE"); fi
          python3 .github/scripts/plugin_release/plan.py "${args[@]}" > plan.json
          jq -r 'to_entries[] | "\(.key)=\(.value|tojson)"' plan.json >> "$GITHUB_OUTPUT"

  native:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          cache-dependency-path: |
            go.sum
            sdk/go.sum
            plugins/*/go.sum
      - name: Build and test the native plugin and host integration
        shell: bash
        env:
          PACKAGE_PATH: ${{ matrix.path }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$PLATFORM"
          go test ./pkg/plugin/secrets ./pkg/plugin/bridge ./pkg/plugin/credential ./pkg/plugin/adapter/auth ./pkg/plugin/bootstrap
          go -C "$PACKAGE_PATH" test -coverprofile=coverage.out ./...
          go -C "$PACKAGE_PATH" tool cover -func=coverage.out
          atmos_binary="$RUNNER_TEMP/atmos"
          if [[ "$RUNNER_OS" == Windows ]]; then atmos_binary+=".exe"; fi
          go build -o "$atmos_binary" .
          "$atmos_binary" plugin validate "$PACKAGE_PATH"
          "$atmos_binary" plugin build "$PACKAGE_PATH" --platform "$PLATFORM"
          "$atmos_binary" plugin test "$PACKAGE_PATH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}-${{ matrix.artifact }}
          path: ${{ matrix.path }}/bin/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-${{ matrix.name }}-${{ matrix.artifact }}
          path: ${{ runner.temp }}/atmos*
          if-no-files-found: error

  pack:
    needs: [plan, native]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.packages) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ matrix.name }}-*
          path: ${{ matrix.path }}/bin
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-${{ matrix.name }}-linux-amd64
          path: release-tools
      - name: Validate the complete multi-platform release
        env:
          PACKAGE_PATH: ${{ matrix.path }}
        run: |
          chmod +x release-tools/atmos "$PACKAGE_PATH"/bin/linux-*/plugin "$PACKAGE_PATH"/bin/darwin-*/plugin
          release-tools/atmos plugin pack "$PACKAGE_PATH" --output release-layout
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layout-${{ matrix.name }}
          path: release-layout
          if-no-files-found: error

  publish:
    needs: [plan, pack]
    if: github.repository == 'cloudposse/atmos' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.packages) }}
    runs-on: ubuntu-24.04
    environment: plugin-release
    concurrency:
      group: official-plugin-${{ matrix.name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: layout-${{ matrix.name }}
          path: release-layout
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-${{ matrix.name }}-linux-amd64
          path: release-tools
      - name: Require public visibility, publish immutable index, and verify anonymous access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATMOS_GITHUB_USERNAME: ${{ github.actor }}
          PACKAGE_PATH: ${{ matrix.path }}
          REPOSITORY: ${{ matrix.repository }}
          VERSION: ${{ matrix.version }}
        run: |
          python3 .github/scripts/plugin_release/public.py "$REPOSITORY"
          chmod +x release-tools/atmos
          release-tools/atmos plugin publish release-layout --to "$REPOSITORY" --sign --yes
          expected_digest="$(jq -er ' .manifests[0].digest ' release-layout/index.json)"
          python3 .github/scripts/plugin_release/public.py "$REPOSITORY" --reference "$VERSION" --digest "$expected_digest"

  catalog:
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    environment: plugin-release
    concurrency:
      group: official-plugin-catalog
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Reconcile current accepted releases under the catalog lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATMOS_GITHUB_USERNAME: ${{ github.actor }}
        run: |
          go build -o "$RUNNER_TEMP/atmos" .
          python3 .github/scripts/plugin_release/catalog.py --atmos "$RUNNER_TEMP/atmos"
