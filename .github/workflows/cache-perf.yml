name: Cache perf lab (windows)

# A lab for iterating on Windows Go-cache restore time without running the
# full Tests suite. Per cache layout, a `seed` job populates a real
# go-build+mod archive (go mod download + go build ./...) that setup-go's
# post step saves under THIS branch's cache scope; the paired `restore` job
# then restores that archive under one tar configuration, asserts it was a
# real cache hit, prints which `tar` was actually selected, and writes its
# "Set up Go" duration to the step summary. Compare the rows. The shared
# step sequence lives in .github/actions/cache-perf-lab.
#
# The lab seeds its own archive rather than reusing main's because main's
# setup-go archive is routinely evicted: every Tests run writes ~5 GB of
# caches against a 10 GB LRU quota, so the only setup-go-Windows entries that
# survive are PR-scoped (refs/pull/N/merge), which other branches cannot
# read. (The first run of this lab found exactly that: five entries, none on
# refs/heads/main.) Seeding costs one build per layout, and only when the
# archive is gone - after that the seed hits and saves nothing.
#
# Why this exists: on windows-2025 hosted runners, restoring our ~1.9 GB
# go-build+mod cache is ~6.5 minutes of pure tar extraction (download is
# ~16 s). Two measured causes: the runner's C: disk (~540 IOPS -- the fast
# D: was removed from Windows Server 2025 images, actions/runner-images#12416,
# #12647) and the extractor (Git-for-Windows' MSYS GNU tar pays a per-file
# POSIX-shim cost; native bsdtar extracts ~4x faster on the same archive,
# actions/cache#752, actions/toolkit#2379 - unmerged). Windows Defender is
# not a factor: real-time monitoring is disabled at the image level.
#
# Tar configurations:
#   gnu-tar  exactly what test.yml does today: Git's usr\bin prepended to
#            PATH, so @actions/cache picks MSYS GNU tar.
#   bsdtar   the proposed fix, using only released @actions/cache code: the
#            toolkit finds GNU tar via a hardcoded %PROGRAMFILES%\Git\usr\bin\
#            tar.exe existence check, falling back to a PATH lookup that
#            accepts anything reporting "GNU tar". Renaming Git's tar.exe
#            aside for the job and putting C:\Windows\System32 first on PATH
#            makes the lookup land on Windows' native bsdtar. Same archive,
#            same key. (Overriding PROGRAMFILES in a step's env: does not
#            work - the runner keeps the process's own ProgramFiles value,
#            so run 2's "bsdtar" legs silently used GNU tar; verified from
#            the tar command lines in their logs.)
#
# Cache layouts:
#   c        Go's defaults: GOCACHE under %LOCALAPPDATA% and GOMODCACHE under
#            %GOPATH%, both on C:.
#   d        GOCACHE and GOMODCACHE relocated to D:\a\ before setup-go runs,
#            the way actions/setup-go#515 proposes. The `topology` job
#            measured D: as a separate disk with ~8.8x the small-file write
#            rate of C: (4,545 vs 515 files/s), so this is the bigger lever;
#            measured: the same ~1.7 GB archive through the same GNU tar
#            restores in 94 s on D: vs 276 s on C: (run 3), and the seeds'
#            cache *save* dropped from 590 s (C:) to 175 s (D:), with
#            go build ./... 599 s -> 455 s (run 2). It needs
#            its own seed: setup-go's cache *version* hashes the restore
#            paths, and @actions/cache tars with -P (absolute paths), so a D:
#            archive only restores onto D:. Adopting this in production means
#            a fresh cache key/version - a one-time cold start, not a
#            regression.
#
# Each layout also gets its own cache *key*, not just its own version (both
# seeds share go.sum and Go version): setup-go's key hashes
# `cache-dependency-path`, so a one-line layout marker file hashed alongside
# go.sum keeps the two entries unambiguous.
#
# Eviction is the real hazard, and it shapes the job graph: this repo's
# cache sits at the 10 GB quota (measured 9.9 GB across 5 entries, each
# Windows setup-go archive ~1.8 GB), so every save evicts the least
# recently used entries. The second run of this lab lost the D: seed's
# archive in the nine minutes between that seed finishing and the C: seed
# finishing - the restore legs waited on both. Hence one seed→restore pair
# per layout, so each restore starts (and touches its archive) seconds after
# its own seed saved it. The same saturation is why main's archive never
# survives between production runs.
#
# Running it: push to any branch named *ci-cache-perf* and this branch's copy
# of the workflow runs on its own - edit, push, read the step summary, repeat.
# Nothing has to land on the default branch to iterate. (Once the file is on
# the default branch, `gh workflow run cache-perf.yml --ref <branch>` also
# works, since workflow_dispatch only resolves workflows that exist there.)
#
# The `topology` job answers a separate question the same run: whether the
# D:\ that windows-2025-vs2026 images still expose is a distinct disk from
# C: or just a path onto the same slow volume, and how fast each is at the
# small-file writes a cache restore is made of.

on:
  # Every push to a ci-cache-perf* branch runs this branch's copy of the
  # workflow directly - no merge to main needed to iterate. (workflow_dispatch
  # additionally becomes available once the file exists on the default
  # branch.)
  push:
    branches:
      - '**/ci-cache-perf*'
  workflow_dispatch:

# A newer push to the same branch supersedes a stale in-flight run.
concurrency:
  group: cache-perf-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  seed-c:
    name: seed (c)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Same list as test.yml's `build` job, whose Windows leg restores
          # this exact archive under block mode (the Actions cache download
          # itself comes from a GitHub-managed *.blob.core.windows.net host
          # that is not listed here and evidently does not need to be).
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            google.golang.org:443
            modernc.org:443
            releases.hashicorp.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            us.i.posthog.com:443
            www.msftconnecttest.com:443
            ipv6.msftconnecttest.com:443
            www.msftncsi.com:443
            ipv6.msftncsi.com:443
            time.windows.com:443
            client.wns.windows.com:443
            settings-win.data.microsoft.com:443
            *.events.data.microsoft.com:443
            *.update.microsoft.com:443
            ecs.office.com:443
            pti.store.microsoft.com:443
            login.live.com:443
            go.microsoft.com:443
            www.microsoft.com:443
            ocsp.sectigo.com:80
            ocsp.sectigo.com:443
            crl.sectigo.com:80
            crl.sectigo.com:443
            *.apple.com:443
            *.aaplimg.com:443
            *.mzstatic.com:443
            *.icloud.com:443
            *.apple-dns.net:443
            ocsp.usertrust.com:80
            ocsp.digicert.com:80
            *.pool.ntp.org:123

      - name: Check out code into the Go module directory
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The seed saves through production's GNU tar; the tar comparison
      # happens in the restore jobs, not here.
      - name: "Seed the C: layout"
        uses: ./.github/actions/cache-perf-lab
        with:
          mode: seed
          layout: c
          tar: gnu

  seed-d:
    name: seed (d)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            google.golang.org:443
            modernc.org:443
            releases.hashicorp.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            us.i.posthog.com:443
            www.msftconnecttest.com:443
            ipv6.msftconnecttest.com:443
            www.msftncsi.com:443
            ipv6.msftncsi.com:443
            time.windows.com:443
            client.wns.windows.com:443
            settings-win.data.microsoft.com:443
            *.events.data.microsoft.com:443
            *.update.microsoft.com:443
            ecs.office.com:443
            pti.store.microsoft.com:443
            login.live.com:443
            go.microsoft.com:443
            www.microsoft.com:443
            ocsp.sectigo.com:80
            ocsp.sectigo.com:443
            crl.sectigo.com:80
            crl.sectigo.com:443
            *.apple.com:443
            *.aaplimg.com:443
            *.mzstatic.com:443
            *.icloud.com:443
            *.apple-dns.net:443
            ocsp.usertrust.com:80
            ocsp.digicert.com:80
            *.pool.ntp.org:123

      - name: Check out code into the Go module directory
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: "Seed the D: layout"
        uses: ./.github/actions/cache-perf-lab
        with:
          mode: seed
          layout: d
          tar: gnu

  restore-c:
    name: restore (${{ matrix.config }}, c)
    needs: seed-c
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: gnu-tar
            tar: gnu
          - config: bsdtar
            tar: bsd
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            google.golang.org:443
            modernc.org:443
            releases.hashicorp.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            us.i.posthog.com:443
            www.msftconnecttest.com:443
            ipv6.msftconnecttest.com:443
            www.msftncsi.com:443
            ipv6.msftncsi.com:443
            time.windows.com:443
            client.wns.windows.com:443
            settings-win.data.microsoft.com:443
            *.events.data.microsoft.com:443
            *.update.microsoft.com:443
            ecs.office.com:443
            pti.store.microsoft.com:443
            login.live.com:443
            go.microsoft.com:443
            www.microsoft.com:443
            ocsp.sectigo.com:80
            ocsp.sectigo.com:443
            crl.sectigo.com:80
            crl.sectigo.com:443
            *.apple.com:443
            *.aaplimg.com:443
            *.mzstatic.com:443
            *.icloud.com:443
            *.apple-dns.net:443
            ocsp.usertrust.com:80
            ocsp.digicert.com:80
            *.pool.ntp.org:123

      - name: Check out code into the Go module directory
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The gnu-tar leg is byte-identical to production's cache restore.
      - name: "Restore the C: layout (${{ matrix.config }})"
        uses: ./.github/actions/cache-perf-lab
        with:
          mode: restore
          layout: c
          config: ${{ matrix.config }}
          tar: ${{ matrix.tar }}

  restore-d:
    name: restore (bsdtar, d)
    needs: seed-d
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            google.golang.org:443
            modernc.org:443
            releases.hashicorp.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            us.i.posthog.com:443
            www.msftconnecttest.com:443
            ipv6.msftconnecttest.com:443
            www.msftncsi.com:443
            ipv6.msftncsi.com:443
            time.windows.com:443
            client.wns.windows.com:443
            settings-win.data.microsoft.com:443
            *.events.data.microsoft.com:443
            *.update.microsoft.com:443
            ecs.office.com:443
            pti.store.microsoft.com:443
            login.live.com:443
            go.microsoft.com:443
            www.microsoft.com:443
            ocsp.sectigo.com:80
            ocsp.sectigo.com:443
            crl.sectigo.com:80
            crl.sectigo.com:443
            *.apple.com:443
            *.aaplimg.com:443
            *.mzstatic.com:443
            *.icloud.com:443
            *.apple-dns.net:443
            ocsp.usertrust.com:80
            ocsp.digicert.com:80
            *.pool.ntp.org:123

      - name: Check out code into the Go module directory
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: "Restore the D: layout (bsdtar)"
        uses: ./.github/actions/cache-perf-lab
        with:
          mode: restore
          layout: d
          config: bsdtar
          tar: bsd

  topology:
    name: "disk topology (C: vs D:)"
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            www.msftconnecttest.com:443
            ipv6.msftconnecttest.com:443
            www.msftncsi.com:443
            ipv6.msftncsi.com:443
            time.windows.com:443
            client.wns.windows.com:443
            settings-win.data.microsoft.com:443
            *.events.data.microsoft.com:443
            *.update.microsoft.com:443
            ecs.office.com:443
            pti.store.microsoft.com:443
            login.live.com:443
            go.microsoft.com:443
            www.microsoft.com:443
            ocsp.sectigo.com:80
            ocsp.sectigo.com:443
            crl.sectigo.com:80
            crl.sectigo.com:443
            ocsp.usertrust.com:80
            ocsp.digicert.com:80
            *.pool.ntp.org:123

      - name: Disk and volume layout
        shell: pwsh
        run: |
          Write-Host "--- Get-Disk ---";      Get-Disk | Format-Table Number, FriendlyName, Size, BusType, MediaType -AutoSize
          Write-Host "--- Get-Partition ---"; Get-Partition | Where-Object DriveLetter | Format-Table DriveLetter, DiskNumber, Size -AutoSize
          Write-Host "--- Get-Volume ---";    Get-Volume | Where-Object DriveLetter | Format-Table DriveLetter, FileSystemType, Size, SizeRemaining -AutoSize
          Write-Host "--- Get-PSDrive ---";   Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free -AutoSize
          Write-Host "RUNNER_TEMP=$env:RUNNER_TEMP  LOCALAPPDATA=$env:LOCALAPPDATA  TEMP=$env:TEMP"

      # Small-file writes are what a go-build cache restore is made of, so
      # this is the shape that matters, not sequential throughput.
      - name: "Small-file write benchmark (20,000 x 1 KiB) on C: and D:"
        shell: pwsh
        run: |
          $payload = New-Object byte[] 1024
          foreach ($root in @("$env:LOCALAPPDATA\cache-perf-lab", "$env:RUNNER_TEMP\cache-perf-lab")) {
            $drive = $root.Substring(0, 2)
            if (-not (Test-Path "$drive\")) { Write-Host "$drive not present, skipping"; continue }
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            for ($i = 0; $i -lt 20000; $i++) { [System.IO.File]::WriteAllBytes("$root\f$i", $payload) }
            $sw.Stop()
            $secs = [math]::Round($sw.Elapsed.TotalSeconds, 1)
            Write-Host "$drive ($root): 20,000 x 1 KiB files in ${secs}s (~$([int](20000 / $secs)) files/s)"
            Add-Content $env:GITHUB_STEP_SUMMARY "- **$drive** small-file writes: ${secs}s for 20,000 files (~$([int](20000 / $secs)) files/s)"
            Remove-Item -Recurse -Force $root
          }
