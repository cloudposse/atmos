name: Release Cache Warmup

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - .goreleaser.yml
      - .github/actions/setup-go-cache/**
      - .github/actions/setup-release-cache/**
      - .github/actions/release-build/**
      - .github/workflows/release-cache-warmup.yml

permissions:
  contents: read

concurrency:
  group: release-cache-warmup
  cancel-in-progress: false

jobs:
  warmup:
    name: Warm all release targets
    # Only trusted main code may populate this cache. Release/feature jobs
    # restore it but never save their build output back into it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Restore release cache
        id: cache
        uses: ./.github/actions/setup-release-cache
      - name: Warm the production matrix and build flags
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.3
          args: build --snapshot --clean --skip=before --timeout 150m --config .goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # GoReleaser reads the real matrix, flags, architecture variants and
      # CGO/FIPS settings directly from .goreleaser.yml. Save only its Go
      # caches, never the snapshot binaries; every release links its own
      # tag/SHA and runs the existing packaging/signing/provenance stages.
      - name: Save warm release cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: ${{ steps.cache.outputs.cache-primary-key }}-${{ github.run_id }}-${{ github.run_attempt }}
