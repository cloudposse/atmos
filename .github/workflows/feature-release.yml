name: Feature release
on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
    paths-ignore:
      - "README.md"

# Least-privilege default; the release job below declares its own
# job-level permissions that override this baseline.
permissions:
  contents: read

jobs:
  release:
    if: |
      github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release/feature')
    # shared-go-auto-release.yml declares permissions: {} itself — all
    # release-writing operations go through a separately-scoped GitHub App
    # installation token (BOT_GITHUB_APP_ID), not GITHUB_TOKEN. id-token:
    # write is still needed here, though: cosign's keyless OIDC signing (in
    # the goreleaser job's `signs` step) reads the runner's OIDC token-minting
    # endpoint, which is gated purely by this job's own id-token permission —
    # independent of which token is used for git/API calls elsewhere.
    permissions:
      id-token: write
    uses: cloudposse/.github/.github/workflows/shared-go-auto-release.yml@931b65860304c0fdd162d5de85509022d0efb9e9 # auto-release-cosign
    with:
      publish: true
      prerelease: true
      format: binary
      environment: 'feature-releases'
      runs-on: '["runs-on=${{github.run_id}}", "runner=large", "tag=atmos","extras=s3-cache", "private=false"]'
      draft: ${{ github.event.pull_request.draft }}
    secrets: inherit
