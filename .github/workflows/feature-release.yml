name: Feature release
on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
    paths-ignore:
      - "README.md"

# Least-privilege default; the release job below declares its own
# job-level permissions that override this baseline.
permissions:
  contents: read

jobs:
  release:
    if: |
      github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release/feature')
    # shared-go-auto-release.yml declares only id-token: write and
    # contents: read itself — all release-writing operations go through a
    # separately-scoped GitHub App installation token (BOT_GITHUB_APP_ID),
    # not GITHUB_TOKEN. id-token: write is still needed here, though:
    # cosign's keyless OIDC signing (in the goreleaser job's `signs` step)
    # reads the runner's OIDC token-minting endpoint, which is gated by this
    # job's id-token permission and by the called workflow's own permissions
    # block — independent of which token is used for git/API calls elsewhere.
    # A job-level `permissions:` block replaces the workflow-level default
    # entirely rather than merging with it, so contents: read must be listed
    # here explicitly: the called workflow declares it at its own top level,
    # and an omitted scope means `none`, which GitHub rejects at parse time
    # ("requesting 'contents: read', but is only allowed 'contents: none'").
    permissions:
      id-token: write
      contents: read
    uses: cloudposse/.github/.github/workflows/shared-go-auto-release.yml@da6de3218cc965251e38d84f6addd37e7ddde2e6 # main
    with:
      publish: true
      prerelease: true
      format: binary
      environment: 'feature-releases'
      runs-on: '["runs-on=${{github.run_id}}", "runner=large", "tag=atmos","extras=s3-cache", "private=false"]'
      draft: ${{ github.event.pull_request.draft }}
    secrets: inherit
