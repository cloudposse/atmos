name: Feature release
on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
    paths-ignore:
      - "README.md"

permissions: {}

concurrency:
  group: atmos-release
  cancel-in-progress: false

jobs:
  draft:
    # Only a maintainer-labeled, same-repository, non-draft PR may publish.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && contains(github.event.pull_request.labels.*.name, 'release/feature')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: feature-releases
    outputs:
      id: ${{ steps.draft.outputs.id }}
      exists: ${{ steps.draft.outputs.exists }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Draft release notes
        id: draft
        uses: $/.github/actions/release-draft
        with:
          app-id: ${{ vars.BOT_GITHUB_APP_ID }}
          app-private-key: ${{ secrets.BOT_GITHUB_APP_PRIVATE_KEY }}
          prerelease: 'true'


  publish:
    needs: draft
    if: needs.draft.outputs.id != '' && needs.draft.outputs.exists == 'false'
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: feature-releases
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Build and publish verified release
        uses: $/.github/actions/guarded-release
        with:
          release-id: ${{ needs.draft.outputs.id }}
          commit: ${{ github.event.pull_request.head.sha }}
          app-id: ${{ vars.BOT_GITHUB_APP_ID }}
          app-private-key: ${{ secrets.BOT_GITHUB_APP_PRIVATE_KEY }}
          releases-enabled: ${{ vars.ATMOS_GUARDED_RELEASES_ENABLED }}
