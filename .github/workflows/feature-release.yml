name: Feature release
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open pull request number to build as a unique prerelease
        type: string
        required: true
permissions: {}
concurrency:
  group: atmos-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-pipeline.yml
    with:
      mode: feature
      pr: ${{ inputs.pr }}
