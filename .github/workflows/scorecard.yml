name: Scorecard supply-chain security
on:
  # Only the default branch is analyzed. See:
  # https://github.com/ossf/scorecard-action#workflow-location.
  branch_protection_rule:
  schedule:
    # Weekly Wednesday 6am UTC.
    - cron: "0 6 * * 3"
  push:
    branches: ["main"]

# Declared at the workflow level and narrowed further at the job level.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      # Needed for Code scanning upload.
      security-events: write
      # Needed for GitHub OIDC token if publish_results is true.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Harden Runner
        uses: $/.github/actions/harden-runner # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          policies: >-
            github
            sigstore
            scorecard
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to the OpenSSF API for the public badge/dashboard.
          # Safe for public repos; see https://github.com/ossf/scorecard-action#publishing-results.
          publish_results: true

      # Results are uploaded as an artifact for easy access, in addition to
      # being uploaded to the code-scanning dashboard below.
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
