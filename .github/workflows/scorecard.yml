name: Scorecard supply-chain security
on:
  # Only the default branch is analyzed. See:
  # https://github.com/ossf/scorecard-action#workflow-location.
  branch_protection_rule:
  schedule:
    # Weekly Wednesday 6am UTC.
    - cron: "0 6 * * 3"
  push:
    branches: ["main"]

# Declared at the workflow level and narrowed further at the job level.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed for Code scanning upload.
      security-events: write
      # Needed for GitHub OIDC token if publish_results is true.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            www.bestpractices.dev:443
            api.osv.dev:443
            api.deps.dev:443
            fulcio.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            api.scorecard.dev:443

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to the OpenSSF API for the public badge/dashboard.
          # Safe for public repos; see https://github.com/ossf/scorecard-action#publishing-results.
          publish_results: true

      # Results are uploaded as an artifact for easy access, in addition to
      # being uploaded to the code-scanning dashboard below.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
