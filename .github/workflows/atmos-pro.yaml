---
name: atmos.ci
on: pull_request
env:
  GOFUMPT_VERSION: v0.9.1
  # Keep dependency downloads on the proxy, including the license tool.
  GOPROXY: https://proxy.golang.org
permissions:
  contents: read
  id-token: write
jobs:
  autofix:
    # Skip on fork PRs: GitHub withholds id-token (OIDC) and repo vars/secrets
    # from fork-originated pull_request runs, so `atmos pro commit` cannot
    # authenticate or push and the job always fails for external contributors.
    if: >-
      github.actor != 'atmos-pro[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:1.215.0
    permissions:
      contents: read
      id-token: write
    # Source-built runners and pinned tools are prepared before any checks.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Container shell steps use a different HOME from checkout's temporary
      # Git configuration. Trust only this checkout for repository checks and Go VCS.
      - name: Trust the checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Install Go and toolchain dependencies
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - name: Install Go tools
        run: |
          go install "mvdan.cc/gofumpt@${GOFUMPT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install toolchain dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          atmos toolchain install
          atmos toolchain env --format=github

      # gofumpt
      - name: Get changed Go files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          use_rest_api: "false"
          files: |
            **/*.go
      - if: steps.changed-files.outputs.all_changed_files_count != '0'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          # shellcheck disable=SC2086
          gofumpt -l -w $ALL_CHANGED_FILES

      - name: Build repository check runners
        env:
          CGO_ENABLED: "0"
        run: |
          go build -o build/ .

      - name: Run shared whitespace formatters
        run: ./build/atmos format all --only trailing-whitespace,end-of-file-fixer

      # Generate NOTICE file on all PRs to ensure it stays up-to-date
      - name: Generate NOTICE file
        # Pass public event metadata, never a token, to PR-controlled Go code.
        env:
          ATMOS_NOTICE_REPO_DESCRIPTION: ${{ github.event.repository.description }}
        run: go tool mage notice:generate

      # Format HCL files in test fixtures and examples
      - name: Format HCL
        run: |
          atmos toolchain exec -- tofu fmt -recursive tests/fixtures/components/terraform
          atmos toolchain exec -- tofu fmt -recursive examples/

      # Regenerate README.md from README.yaml
      - name: Regenerate README
        run: |
          # Atmos 1.215.0 checks the API quota before fetching raw GitHub files.
          # Fetch the configured template directly without giving PR templates a token.
          readme_dir=$(mktemp -d "$RUNNER_TEMP/atmos-readme.XXXXXX")
          trap 'rm -rf "$readme_dir"' EXIT
          atmos describe config --format=json > "$readme_dir/config.json"
          template_url=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["docs"]["generate"]["readme"]["template"])' "$readme_dir/config.json")
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 60 --retry 2 --retry-max-time 180 \
            --url "$template_url" --output "$readme_dir/README.md.gotmpl"
          python3 -c 'import json, sys; config = json.load(open(sys.argv[1])); config["docs"]["generate"]["readme"]["template"] = sys.argv[2]; json.dump(config, sys.stdout)' \
            "$readme_dir/config.json" "$readme_dir/README.md.gotmpl" > "$readme_dir/override.yaml"
          atmos docs generate readme --config "$readme_dir/override.yaml"

      - name: Commit fixes via Atmos Pro
        env:
          ATMOS_LOGS_LEVEL: debug
          ATMOS_PRO_WORKSPACE_ID: ${{ vars.ATMOS_PRO_WORKSPACE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: atmos pro commit -m "[autocommit] formatting fixes" --all
