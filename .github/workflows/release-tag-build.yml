name: Build tagged release
run-name: Atmos tagged build ${{ github.ref_name }} [${{ inputs.request-id }}]
on:
  workflow_dispatch:
    inputs:
      guarded-releases-enabled:
        description: Parent gate passed before dispatch; parent rechecks before publication
        type: string
        required: true
      parent-run:
        description: Authorized parent release run
        type: string
        required: true
      plan-artifact:
        description: Immutable prepared plan artifact from that run
        type: string
        required: true
      request-id:
        description: Correlation digest computed by the parent
        type: string
        required: true
permissions: {}
concurrency:
  group: atmos-tag-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-go-cache
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.plan-artifact }}
          run-id: ${{ inputs.parent-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-plan
          merge-multiple: true
      - id: validate
        name: Authorize tagged build against the parent's prepared release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLAN: ${{ runner.temp }}/release-plan/release-plan.json
          PLAN_ARTIFACT: ${{ inputs.plan-artifact }}
          PARENT_RUN: ${{ inputs.parent-run }}
          REQUEST_ID: ${{ inputs.request-id }}
          ATMOS_GUARDED_RELEASES_ENABLED: ${{ inputs.guarded-releases-enabled }}
        run: go tool mage release:validateTagBuild "$GITHUB_REPOSITORY" "$RELEASE_PLAN" "$PLAN_ARTIFACT" "$PARENT_RUN" "$REQUEST_ID"
      - uses: ./.github/actions/release-build
        with:
          tag: ${{ steps.validate.outputs.tag }}
          commit: ${{ steps.validate.outputs.commit }}
          signing-workflow: .github/workflows/release-tag-build.yml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/dist
          if-no-files-found: error
          compression-level: 0
