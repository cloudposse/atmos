name: Quality Gate

# Per-PR reports only. Repository-wide true-ups (schedule, merges, milestone and
# release changes, manual true-ups) live in quality-reconcile.yml, so a long true-up
# never holds or cancels a queued report for one PR.
on:
  # CI Timing Summary calls this once a PR's CI completes.
  workflow_call:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to refresh from current GitHub evidence.
        required: true
        type: string

permissions: {}

jobs:
  report:
    # Dispatch from the default branch so both workflow and tooling are trusted.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Serialize reports per PR; keep replacement of pending automatic reports.
    # A global queue: max previously overflowed and delayed reports for hours (#3367).
    concurrency:
      group: >-
        atmos-quality-report-${{
          inputs.pr_number ||
          github.event.pull_request.number ||
          github.event.workflow_run.pull_requests[0].number ||
          github.event.workflow_run.head_sha ||
          github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: write
      issues: write
    steps:
      - name: Harden Runner
        uses: $/.github/actions/harden-runner # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          # setup-go follows GitHub release redirects; the Go hosts cover its fallback.
          policies: >-
            github
            github-archives
            github-releases
            github-actions
            github-blob-storage
            go-checksums
            go-proxy
            go-toolchain
      - name: Check out trusted reporter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Report quality gates for this PR
        uses: ./.github/actions/quality-gate
        with:
          operation: ${{ github.event_name == 'workflow_dispatch' && 'reportPR' || 'report' }}
          pr-number: ${{ inputs.pr_number }}
          github-token: ${{ github.token }}
