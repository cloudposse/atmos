name: Quality Gate

on:
  workflow_call:
  # Release eligibility can change without a new commit. Always run trusted
  # default-branch code; these events never execute pull request source.
  pull_request_target:
    types: [labeled, unlabeled, milestoned, demilestoned, closed]
  milestone:
    types: [created, opened, edited, closed, deleted]
  release:
    types: [published]
  # Actions has no review-thread resolution trigger. Reconcile these changes
  # and third-party events not delivered to Actions every 15 minutes, for open
  # main PRs with a head commit from the last 24 hours or no usable report for
  # their current head. Bot comments and labels do not select a PR.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

# Serialize final reports per PR/head; scheduled recovery has its own group.
concurrency:
  group: >-
    atmos-quality-report-${{
      github.event.issue.number ||
      github.event.workflow_run.pull_requests[0].number ||
      github.event.check_run.pull_requests[0].number ||
      github.event.workflow_run.head_sha ||
      github.event.check_run.head_sha ||
      github.event.sha ||
      'all' }}
  cancel-in-progress: false

jobs:
  report:
    # Our readiness labels must not recursively trigger this reporter.
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      contains(fromJSON('["major","minor","patch","no-release"]'), github.event.label.name)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: write
      issues: write
    steps:
      - name: Harden Runner
        uses: $/.github/actions/harden-runner
        with:
          # setup-go follows GitHub release redirects; the Go hosts cover its fallback.
          policies: >-
            github
            github-archives
            github-releases
            github-actions
            github-blob-storage
            go-checksums
            go-proxy
            go-toolchain
      - name: Check out trusted reporter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Go and restore build cache
        uses: ./.github/actions/setup-go-cache
      - name: Reconcile current-head quality gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go tool mage quality:report "$GITHUB_REPOSITORY"
      - name: Save recovered benchmark comparisons
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-gate-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/benchmarks/report/
          retention-days: 90
          if-no-files-found: ignore
