name: Native CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Only run when something this E2E actually exercises changes, so unrelated
    # PRs aren't spammed with scanner SARIF/code-scanning annotations.
    paths:
      # The E2E fixture + its validation test-case.
      - "tests/fixtures/scenarios/native-ci-e2e/**"
      - "tests/test-cases/native-ci-e2e.yaml"
      # The workflow itself.
      - ".github/workflows/native-ci.yml"
      # The feature this E2E exercises, so scanner/CI source changes still run it.
      - "pkg/ci/**"
      - "pkg/hooks/**"
      - "actions/cache/**"
      # The CI git-clone bootstrap path exercised by the ci-bootstrap-clone job.
      - "cmd/git/**"
      # CI log grouping boundaries exercised by the workflow and Terraform jobs.
      - "cmd/root.go"
      - "internal/exec/terraform_execute_helpers_exec.go"
      - "internal/exec/workflow_utils.go"
      - "pkg/runner/step/**"
      - "pkg/workflow/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write
  statuses: write

env:
  ATMOS_BOOTSTRAP_VERSION: "1.223.0"
  ATMOS_NATIVE_CI_WORKDIR: tests/fixtures/scenarios/native-ci-e2e
  ATMOS_VERSION_CHECK_ENABLED: "false"
  NATIVE_CI_TRIVY_VERSION: "0.70.0"
  NATIVE_CI_KICS_VERSION: "2.1.20"
  # Use pipe fallback so transient proxy.golang.org 5xx errors during
  # `go mod download` fall back to direct module fetches.
  GOPROXY: "https://proxy.golang.org|direct"

jobs:
  workflow-groups:
    name: "[native ci] workflow groups (${{ matrix.group_mode }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group_mode:
          - auto
          - invocation
          - off
    env:
      ATMOS_CI_GROUPS_MODE: ${{ matrix.group_mode }}

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up and build Atmos
        uses: ./.github/actions/setup-atmos-build
        with:
          atmos-bootstrap-version: ${{ env.ATMOS_BOOTSTRAP_VERSION }}

      - name: Run workflow log group fixture
        working-directory: ${{ env.ATMOS_NATIVE_CI_WORKDIR }}
        run: |
          echo "ATMOS_CI_GROUPS_MODE=${ATMOS_CI_GROUPS_MODE}"
          case "${ATMOS_CI_GROUPS_MODE}" in
            auto)
              echo "Expected: GitHub log groups named 'first workflow group' and 'second workflow group'."
              echo "Expected: each workflow shell step prints ATMOS_CI_LOG_GROUP_ACTIVE=1."
              ;;
            invocation)
              echo "Expected: one GitHub log group around the full 'atmos workflow' invocation."
              echo "Expected: workflow shell steps print ATMOS_CI_LOG_GROUP_ACTIVE=1 because the invocation group is active."
              ;;
            off)
              echo "Expected: no Atmos-created GitHub log groups."
              echo "Expected: workflow shell steps print ATMOS_CI_LOG_GROUP_ACTIVE=<unset>."
              ;;
          esac
          atmos workflow ci-log-groups -f ci-log-groups

  ci-bootstrap-clone:
    name: "[native ci] git clone CI bootstrap (empty workspace)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up and build Atmos
        uses: ./.github/actions/setup-atmos-build
        with:
          atmos-bootstrap-version: ${{ env.ATMOS_BOOTSTRAP_VERSION }}

      # A throwaway local bare repository stands in for the "current CI
      # repository" so this job never depends on network access or on
      # cloudposse/atmos's own (large) history -- only the clone-bootstrap
      # mechanism is under test here, not GitHub connectivity.
      - name: Create a throwaway fixture repository to bootstrap-clone
        id: fixture
        run: |
          set -euo pipefail
          server_root="$(mktemp -d)"
          fixture_seed="$(mktemp -d)"
          bare_repo="${server_root}/dummy-owner/fixture.git"
          mkdir -p "$(dirname "${bare_repo}")"
          git init --quiet --bare "${bare_repo}"

          git init --quiet "${fixture_seed}"
          git -C "${fixture_seed}" config user.email "ci@example.com"
          git -C "${fixture_seed}" config user.name "Native CI Fixture"
          git -C "${fixture_seed}" checkout --quiet -b main
          echo "native-ci-bootstrap-fixture" > "${fixture_seed}/marker.txt"
          git -C "${fixture_seed}" add marker.txt
          git -C "${fixture_seed}" commit --quiet -m "seed fixture"
          git -C "${fixture_seed}" remote add origin "${bare_repo}"
          git -C "${fixture_seed}" push --quiet origin main

          echo "server_root=${server_root}" >> "$GITHUB_OUTPUT"

      # Reproduces the real scenario cmd/git/bootstrap.go exists for: a CI
      # runner with no repository checked out and therefore no atmos.yaml,
      # where `atmos git clone` must still run (RootCmd's config-init-error
      # path must tolerate the missing config) and clone the CI-detected
      # repository into the working directory, replacing actions/checkout.
      # See docs/prd/git-ops.md#native-ci-behavior.
      - name: Bootstrap-clone into an empty CI workspace (no atmos.yaml)
        env:
          GITHUB_SERVER_URL: file://${{ steps.fixture.outputs.server_root }}
          GITHUB_REPOSITORY: dummy-owner/fixture
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
          GITHUB_REF_NAME: main
        run: |
          set -euo pipefail
          empty_ws="$(mktemp -d)"
          cd "${empty_ws}"
          if [ -f atmos.yaml ]; then
            echo "::error::expected an empty workspace with no atmos.yaml" >&2
            exit 1
          fi
          ATMOS_CI=true atmos git clone --depth=1
          test -f marker.txt
          grep -qx "native-ci-bootstrap-fixture" marker.txt
          echo "Bootstrap clone succeeded into an atmos.yaml-less workspace: ${empty_ws}"

      # Negative path (CLAUDE.md: recovery/fallback logic needs a test that
      # it does NOT trigger when its condition is absent): explicitly opting
      # out of CI bootstrap must not silently fall through to a clone -- it
      # must still fail without a repository/config to act on.
      - name: Explicit opt-out still fails without a repository or config
        run: |
          set -euo pipefail
          empty_ws="$(mktemp -d)"
          cd "${empty_ws}"
          if ATMOS_CI=false atmos git clone; then
            echo "::error::expected 'atmos git clone' to fail when CI bootstrap is explicitly disabled and no config/repository is available" >&2
            exit 1
          fi
          echo "Correctly refused to clone without CI bootstrap enabled and no repository specified."

  terraform-plan:
    name: "[native ci] terraform plan"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ATMOS_CI_GROUPS_MODE: auto

    services:
      floci:
        image: floci/floci@sha256:c88ec20bf221630dd195d38a14eeb0ac52ddfa72c37ebb3c8aa17f63ae27c5f2 # 1.5.23
        ports:
          - 4566:4566

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up and build Atmos
        uses: ./.github/actions/setup-atmos-build
        with:
          atmos-bootstrap-version: ${{ env.ATMOS_BOOTSTRAP_VERSION }}

      - name: Restore Atmos native CI cache
        uses: ./actions/cache
        env:
          ATMOS_CHDIR: ${{ env.ATMOS_NATIVE_CI_WORKDIR }}

      - name: Validate native CI fixture
        working-directory: ${{ env.ATMOS_NATIVE_CI_WORKDIR }}
        run: atmos validate stacks

      - name: Mirror Terraform providers
        working-directory: ${{ env.ATMOS_NATIVE_CI_WORKDIR }}
        env:
          # TFLint release-attestation verification invokes `gh`, which reads
          # GH_TOKEN (not GITHUB_TOKEN) while installing tool dependencies.
          GH_TOKEN: ${{ github.token }}
        run: atmos terraform cache mirror bucket -s test --platform=linux_amd64 --format=json

      - name: Terraform plan
        id: terraform-plan
        working-directory: ${{ env.ATMOS_NATIVE_CI_WORKDIR }}
        env:
          ATMOS_CI_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: atmos terraform plan bucket -s test

  terraform-apply:
    name: "[native ci] terraform apply"
    needs: terraform-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ATMOS_CI_GROUPS_MODE: auto

    services:
      floci:
        image: floci/floci@sha256:c88ec20bf221630dd195d38a14eeb0ac52ddfa72c37ebb3c8aa17f63ae27c5f2 # 1.5.23
        ports:
          - 4566:4566

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up and build Atmos
        uses: ./.github/actions/setup-atmos-build
        with:
          atmos-bootstrap-version: ${{ env.ATMOS_BOOTSTRAP_VERSION }}

      - name: Restore Atmos native CI cache
        uses: ./actions/cache
        env:
          ATMOS_CHDIR: ${{ env.ATMOS_NATIVE_CI_WORKDIR }}

      - name: Validate native CI fixture
        working-directory: ${{ env.ATMOS_NATIVE_CI_WORKDIR }}
        run: atmos validate stacks

      - name: Mirror Terraform providers
        working-directory: ${{ env.ATMOS_NATIVE_CI_WORKDIR }}
        env:
          # TFLint release-attestation verification invokes `gh`, which reads
          # GH_TOKEN (not GITHUB_TOKEN) while installing tool dependencies.
          GH_TOKEN: ${{ github.token }}
        run: atmos terraform cache mirror bucket -s test --platform=linux_amd64 --format=json

      - name: Terraform apply
        id: terraform-apply
        working-directory: ${{ env.ATMOS_NATIVE_CI_WORKDIR }}
        env:
          ATMOS_CI_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: atmos terraform apply bucket -s test -auto-approve
