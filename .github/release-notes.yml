# Release-note presentation shared by Mage release plans and previews.
# Versions come exclusively from milestones; labels only select note categories.
filter-by-commitish: true

categories:
# This repo labels PRs major / minor / patch / no-release (see the
# pull-request skill: minor = feature, patch = fix). The org categories knew
# enhancement, patch, fix and auto-update only, and filed `patch` under
# Enhancements: every fix showed up as an enhancement, no Bug Fixes chapter
# ever appeared, and every `minor` feature was uncategorized - which
# release-drafter lists first, with no heading at all. Fixed org-wide in
# cloudposse/.github#279; this is the same mapping.
- title: '💥 Breaking Changes'
  labels:
  - 'major'
- title: '✨ Features'
  labels:
  - 'minor'
  - 'feature'
- title: '🚀 Enhancements'
  labels:
  - 'enhancement'
- title: '🐛 Bug Fixes'
  labels:
  - 'patch'
  - 'fix'
  - 'bugfix'
  - 'bug'
  - 'hotfix'
- title: '🤖 Automatic Updates'
  labels:
  - 'auto-update'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
template: |
  $CHANGES
