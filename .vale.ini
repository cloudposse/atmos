# Vale configuration for Atmos technical documentation.
#
# Enforces the Atmos writing style (docs/writing-style-guide.md), a set of
# rules inspired by ASD-STE100 (Simplified Technical English) principles.
# This is our own paraphrased rule set, not a reproduction of the copyrighted
# ASD-STE100 specification or its controlled dictionary. See
# docs/prd/technical-writing-standard-ste100.md for the full rationale.
#
# Run with: atmos lint docs [--changed]

StylesPath = .vale/styles
Vocab = Atmos

# Phase 1 (see the PRD's Migration Path): informational only. Vale exits
# non-zero only for `error`-level alerts, so `suggestion` keeps every rule
# visible without blocking local runs, the pre-commit hook, or CI.
MinAlertLevel = suggestion

[formats]
mdx = md

# `Vale` (the built-in style) must sit alongside `Atmos` in BasedOnStyles:
# `Vocab = Atmos` above only points Vale at the vocabulary folder; the
# built-in `Vale.Terms` / `Vale.Avoid` checks are what actually read
# accept.txt / reject.txt. Without `Vale` here, the vocabulary files are
# loaded but never enforced.
#
# Adding `Vale` also turns on three unrelated built-in checks as a side
# effect: `Vale.Spelling`, `Vale.Repetition`, and `Vale.Terms`. The first
# two default to `error` level, which would make CI/pre-commit fail (Vale's
# exit code reflects alert level, not MinAlertLevel) across a ~1,000-file
# corpus that has never been vetted against a spellchecker. Disable both
# explicitly to keep Phase 1 non-blocking, and set `Vale.Avoid` to
# `suggestion` for the same reason.
#
# `Vale.Terms` enforces the *casing* of every accept.txt entry, which is
# not what that file is for here. Measured against the current corpus it
# produced 1,588 findings and every one was a false positive: 720 on
# `yaml` and 223 on `json` inside code-fence language tags, config keys
# (`format: yaml`) and file extensions, 365 on `cli` inside doc paths, and
# a tail that flags environment variable names (`KUBECONFIG`, `ATMOS_*`)
# as miscased spellings of their prose forms. accept.txt stays as the
# domain-vocabulary record, and would matter again if `Vale.Spelling` were
# ever turned on, but `Vale.Terms` itself is off.
[docs/prd/**/*.md]
BasedOnStyles = Atmos, Vale
Vale.Terms = NO
Vale.Avoid = suggestion
Vale.Spelling = NO
Vale.Repetition = NO

[website/docs/**/*.md]
BasedOnStyles = Atmos, Vale
Vale.Terms = NO
Vale.Avoid = suggestion
Vale.Spelling = NO
Vale.Repetition = NO

[website/docs/**/*.mdx]
BasedOnStyles = Atmos, Vale
Vale.Terms = NO
Vale.Avoid = suggestion
Vale.Spelling = NO
Vale.Repetition = NO

# Blog posts are narrative content and follow the `changelog` skill, not the
# Atmos writing style. `BasedOnStyles` deliberately omits `Atmos`, so none of
# SentenceLength, PassiveVoice, Contractions, FutureTense, WordyPhrases, or
# Terminology apply here: long sentences, contractions, and the occasional
# passive are all part of the house voice on the blog and enforcing against
# them would fight it.
#
# `Vale.Avoid` is the one check that carries over, because the reject list is
# marketing filler ("leverage", "seamlessly", "robust", "simply") and that is
# a house-voice rule everywhere. It arguably matters more on the blog than in
# a PRD, since the blog is the surface where marketing language creeps in.
[website/blog/**/*.md]
BasedOnStyles = Vale
Vale.Avoid = suggestion
Vale.Terms = NO
Vale.Spelling = NO
Vale.Repetition = NO

[website/blog/**/*.mdx]
BasedOnStyles = Vale
Vale.Avoid = suggestion
Vale.Terms = NO
Vale.Spelling = NO
Vale.Repetition = NO
