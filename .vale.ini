# Vale configuration for Atmos technical documentation.
#
# Enforces the Atmos writing style (docs/writing-style-guide.md), a set of
# rules inspired by ASD-STE100 (Simplified Technical English) principles.
# This is our own paraphrased rule set, not a reproduction of the copyrighted
# ASD-STE100 specification or its controlled dictionary. See
# docs/prd/technical-writing-standard-ste100.md for the full rationale.
#
# Run with: atmos lint docs [--changed]

StylesPath = .vale/styles
Vocab = Atmos

# Phase 1 (see the PRD's Migration Path): informational only. Vale exits
# non-zero only for `error`-level alerts, so `suggestion` keeps every rule
# visible without blocking local runs, the pre-commit hook, or CI.
MinAlertLevel = suggestion

[formats]
mdx = md

# `Vale` (the built-in style) must sit alongside `Atmos` in BasedOnStyles:
# `Vocab = Atmos` above only points Vale at the vocabulary folder; the
# built-in `Vale.Terms` / `Vale.Avoid` checks are what actually read
# accept.txt / reject.txt. Without `Vale` here, the vocabulary files are
# loaded but never enforced.
#
# Adding `Vale` also turns on two unrelated built-in checks as a side
# effect: `Vale.Spelling` and `Vale.Repetition`. Both default to `error`
# level, which would make CI/pre-commit fail (Vale's exit code reflects
# alert level, not MinAlertLevel) across a ~1,000-file corpus that has
# never been vetted against a spellchecker. Disable both explicitly to
# keep Phase 1 non-blocking, and set `Vale.Terms` / `Vale.Avoid` to
# `suggestion` for the same reason.
[docs/prd/**/*.md]
BasedOnStyles = Atmos, Vale
Vale.Terms = suggestion
Vale.Avoid = suggestion
Vale.Spelling = NO
Vale.Repetition = NO

[website/docs/**/*.md]
BasedOnStyles = Atmos, Vale
Vale.Terms = suggestion
Vale.Avoid = suggestion
Vale.Spelling = NO
Vale.Repetition = NO

[website/docs/**/*.mdx]
BasedOnStyles = Atmos, Vale
Vale.Terms = suggestion
Vale.Avoid = suggestion
Vale.Spelling = NO
Vale.Repetition = NO
