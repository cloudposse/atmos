apiVersion: atmos/v1
kind: Policy
metadata:
  name: component-deny-agent-production-deploy
  description: Deny production apply and deploy commands launched by Claude Code or Codex.
spec:
  policies:
    guard:
      on: component.command
      action: deny
      reason: Production apply and deploy are blocked from coding-agent sessions. Use a reviewed deployment workflow.
      rule: |
        input.agents.exists(agent, agent in ['claude-code', 'codex']) &&
        input.command in ['apply', 'deploy'] &&
        input.stack.matches('(?i)(^|[-_/])(prod|production)([-_/]|$)')
