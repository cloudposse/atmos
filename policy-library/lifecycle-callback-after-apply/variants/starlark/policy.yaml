apiVersion: atmos/v1
kind: Policy
metadata:
  name: lifecycle-callback-after-apply
  description: "Require an HTTP callback after a successful Helm apply."
spec:
  policies:
    callback-after-apply:
      on: operation
      engine: starlark
      action: hooks
      rule: |
        return ctx.input["event"] == "after.helm.apply" and ctx.input["status"] == "success"

      hooks:
        - ref: applied
          event: after.helm.apply
          required: true
          require_success: true
  hooks:
    applied:
      kind: step
      type: http
      with:
        url: https://example.invalid/deployment-completed
        method: POST
  tools: {}
