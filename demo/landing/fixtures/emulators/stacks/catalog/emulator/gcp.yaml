# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json

# Local GCP cloud (Floci). `atmos emulator up landing-gcp -s <stack>` starts it.
components:
  emulator:
    landing-gcp:
      ephemeral: true
      driver: floci/gcp
      region: us-central1
      project: atmos-demo
