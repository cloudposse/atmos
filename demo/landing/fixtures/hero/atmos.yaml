base_path: "./"

components:
  terraform:
    base_path: "components/terraform"
    apply_auto_approve: false
    deploy_run_init: true
    init_run_reconfigure: true
    auto_generate_backend_file: false
    ui:
      enabled: true

  helm:
    base_path: components/helm
  kubernetes:
    base_path: components/kubernetes
  ansible:
    base_path: components/ansible

stacks:
  base_path: "stacks"
  included_paths:
    - "deploy/**/*"
  excluded_paths:
    - "**/_defaults.yaml"
  name_template: "{{ .vars.stage }}"

logs:
  file: "/dev/stderr"
  level: Info

# The hero provisions only the local AWS emulator; no cloud account is needed.
auth:
  identities:
    local-aws:
      kind: aws/emulator
      emulator: landing-hero-aws
      default: true
