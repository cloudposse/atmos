import:
  - catalog/app
vars:
  stage: dev
components:
  terraform:
    app:
      vars:
        retention_seconds: 3600
  emulator:
    landing-hero-aws:
      ephemeral: true
      driver: floci/aws
      region: us-east-1
      container:
        image: floci/floci@sha256:c88ec20bf221630dd195d38a14eeb0ac52ddfa72c37ebb3c8aa17f63ae27c5f2
        ports:
          - host: 25466
            container: 4566
