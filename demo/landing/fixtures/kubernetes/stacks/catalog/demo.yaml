# The namespace is owned by Kubernetes; Helm installs into it.
components:
  kubernetes:
    namespace:
      metadata:
        component: namespace
      paths: [manifests]
  helm:
    app:
      metadata:
        component: app
      chart: .
      namespace: atmos-demo
      create_namespace: false
      release:
        timeout: 3m
        wait:
          strategy: watcher
      values:
        replicaCount: 1
        image: nginx:1.27.5-alpine
