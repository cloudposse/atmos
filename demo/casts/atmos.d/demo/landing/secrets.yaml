commands:
- name: casts generate demo landing secrets
  description: Record Secrets without glue code using the dedicated landing fixture.
  env: !include 'cast-defaults.yaml .env.command'
  steps:
  - type: shell
    command: atmos casts setup landing
  - type: workdir
    name: prepare-fixture
    source: ../landing/fixtures/secrets
    path: ../../.context/cast-fixtures/landing/secrets
    reset: true
  - type: cast
    name: secrets
    working_directory: ../../.context/cast-fixtures/landing/secrets
    title: Secrets without glue code
    mode: steps
    defaults:
      cast: !include 'landing-defaults.yaml .cast'
      simulate: !include 'landing-defaults.yaml .simulate'
    env: !include 'landing-defaults.yaml .env'
    show:
      labels: false
    output:
      mode: raw
      cast: ../../website/static/casts/demo/landing/secrets.cast
    steps:
    - type: simulate
      text: atmos secret list -s dev -c api
    - type: shell
      command: atmos secret list -s dev -c api
      duration: 650ms
      interval: 1s
    - type: session
      shell: /bin/sh
      timeout: 180s
      steps:
      - type: wait
        text: "> "
        timeout: 10s
      - type: write
        text: atmos secret init -s dev -c api
      - type: key
        key: enter
      - type: wait
        text: Enter secret value
        timeout: 30s
      - type: write
        text: dd-demo-key
      - type: key
        key: enter
      - type: wait
        text: Enter secret value
        timeout: 30s
      - type: write
        text: demo-db-password
      - type: key
        key: enter
      - type: wait
        text: Initialized
        timeout: 30s
      - type: pause
        duration: 700ms
    - type: simulate
      text: atmos secret list -s dev -c api
    - type: shell
      command: atmos secret list -s dev -c api
      duration: 650ms
      interval: 1s
    - type: session
      shell: /bin/sh
      timeout: 180s
      steps:
      - type: wait
        text: "> "
        timeout: 10s
      - type: write
        text: atmos secret set DB_PASSWORD -s dev -c api --force
      - type: key
        key: enter
      - type: wait
        text: Enter secret value
        timeout: 30s
      - type: write
        text: rotated-demo-password
      - type: key
        key: enter
      - type: wait
        text: Set secret
        timeout: 30s
      - type: pause
        duration: 700ms
    - type: simulate
      text: atmos secret get DB_PASSWORD -s dev -c api
    - type: shell
      command: atmos secret get DB_PASSWORD -s dev -c api
      duration: 650ms
      interval: 1s
    - type: simulate
      text: atmos secret exec -s dev -c api -- sh scripts/use-secrets.sh
    - type: shell
      command: atmos secret exec -s dev -c api -- sh scripts/use-secrets.sh
      duration: 650ms
      interval: 1s
  - type: shell
    command: python3 landing_checks.py sanitize secrets
  - type: shell
    command: atmos casts validate demo landing secrets
- name: casts validate demo landing secrets
  description: Validate the secrets homepage recording.
  steps:
  - type: shell
    command: python3 landing_checks.py validate secrets
