commands:
- name: casts generate demo landing hero
  description: Record the Atmos workflow across stacks and workload types.
  env: !include 'cast-defaults.yaml .env.command'
  steps:
  - type: shell
    command: atmos casts setup landing
  - type: workdir
    name: prepare-fixture
    source: ../landing/fixtures/hero
    path: ../../.context/cast-fixtures/landing/hero
    reset: true
  - type: shell
    command: |-
      git init -q
      git config user.email demo@atmos.tools
      git config user.name demo
      git config commit.gpgsign false
      git add -A
      git commit -qm baseline
      git branch baseline
      atmos terraform workspace new app -s dev
      atmos terraform apply app -s dev
    working_directory: ../../.context/cast-fixtures/landing/hero
    env: !include 'landing-defaults.yaml .env'
    output: none
  - type: cast
    name: hero
    working_directory: ../../.context/cast-fixtures/landing/hero
    title: One interface for your infrastructure
    mode: steps
    defaults:
      cast: !include 'landing-defaults.yaml .cast'
      simulate: !include 'landing-defaults.yaml .simulate'
    env: !include 'landing-defaults.yaml .env'
    show:
      labels: false
    output:
      mode: raw
      cast: ../../website/static/casts/demo/landing/hero.cast
    steps:
    # Return the prompt immediately, hold for reading, then press Enter once.
    - type: simulate
      text: atmos list stacks
    - type: shell
      command: atmos list stacks
      duration: 650ms
      interval: 0s
    - type: simulate
      mode: prompt
    - type: sleep
      timeout: 3s
      interval: 0s
      output: none
    - type: shell
      command: printf '\n'
      interval: 0s
    - type: simulate
      text: atmos list components -s dev
    - type: shell
      command: atmos list components -s dev
      duration: 650ms
      interval: 0s
    - type: simulate
      mode: prompt
    - type: sleep
      timeout: 4s
      interval: 0s
      output: none
    - type: shell
      command: printf '\n'
      interval: 0s
    - type: simulate
      text: atmos stack get vars.replicas -s dev -c app
    - type: shell
      command: atmos stack get vars.replicas -s dev -c app
      duration: 500ms
      interval: 0s
    - type: simulate
      mode: prompt
    - type: sleep
      timeout: 3s
      interval: 0s
      output: none
    - type: shell
      command: printf '\n'
      interval: 0s
    - type: simulate
      text: atmos stack set vars.replicas 3 -s dev -c app
    - type: shell
      command: atmos stack set vars.replicas 3 -s dev -c app
      duration: 650ms
      interval: 0s
    - type: simulate
      mode: prompt
    - type: sleep
      timeout: 3s
      interval: 0s
      output: none
    - type: shell
      command: printf '\n'
      interval: 0s
    - type: simulate
      text: atmos stack get vars.replicas -s dev -c app
    - type: shell
      command: atmos stack get vars.replicas -s dev -c app
      duration: 500ms
      interval: 0s
    - type: simulate
      mode: prompt
    - type: sleep
      timeout: 3s
      interval: 0s
      output: none
    - type: shell
      command: printf '\n'
      interval: 0s
    - type: simulate
      text: atmos list affected --ref baseline
    - type: shell
      command: atmos list affected --ref baseline
      duration: 650ms
      interval: 0s
    - type: simulate
      mode: prompt
    - type: sleep
      timeout: 4s
      interval: 0s
      output: none
    - type: shell
      command: printf '\n'
      interval: 0s
    - type: session
      shell: scripts/cast-shell.sh
      timeout: 45s
      steps:
      - type: wait
        text: "> "
        timeout: 10s
      - type: write
        text: atmos terraform plan app -s dev
      - type: key
        key: enter
      - type: wait
        regex: '(?s)OUTPUTS CHANGED.*> '
        timeout: 30s
      - type: pause
        duration: 3s
    # Leave room for the recorder's final prompt after the real shell session.
    - type: shell
      command: printf '\r\033[2K'
  - type: shell
    command: python3 landing_checks.py sanitize hero
  - type: shell
    command: atmos casts validate demo landing hero
- name: casts validate demo landing hero
  description: Validate the hero homepage recording.
  steps:
  - type: shell
    command: python3 landing_checks.py validate hero
