commands:
- name: casts generate demo landing kubernetes
  description: Record Kubernetes, deployed together using the dedicated landing fixture.
  env: !include 'cast-defaults.yaml .env.command'
  steps:
  - type: shell
    command: atmos casts setup landing
  - type: workdir
    name: prepare-fixture
    source: ../landing/fixtures/kubernetes
    path: ../../.context/cast-fixtures/landing/kubernetes
    reset: true
  - type: shell
    command: atmos emulator up landing-kubernetes -s local
    working_directory: ../../.context/cast-fixtures/landing/kubernetes
    env: !include 'landing-defaults.yaml .env'
    output: none
  - type: cast
    name: kubernetes
    working_directory: ../../.context/cast-fixtures/landing/kubernetes
    title: Kubernetes, deployed together
    mode: steps
    defaults:
      cast: !include 'landing-defaults.yaml .cast'
      simulate: !include 'landing-defaults.yaml .simulate'
    env: !include 'landing-defaults.yaml .env'
    show:
      labels: false
    output:
      mode: raw
      cast: ../../website/static/casts/demo/landing/kubernetes.cast
    steps:
    - type: simulate
      text: atmos list instances -s local
    - type: shell
      command: atmos list instances -s local
      duration: 650ms
      interval: 0s
    - type: simulate
      mode: prompt
    - type: sleep
      timeout: 3s
      interval: 0s
      output: none
    - type: shell
      command: printf '\n'
      interval: 0s
    - type: simulate
      text: atmos kubernetes deploy --all -s local --identity local-k8s
    - type: shell
      command: atmos kubernetes deploy --all -s local --identity local-k8s
      duration: 650ms
      interval: 0s
    - type: simulate
      mode: prompt
    - type: sleep
      timeout: 4s
      interval: 0s
      output: none
    - type: shell
      command: printf '\r\033[2K'
      interval: 0s
  - type: shell
    command: atmos emulator exec landing-kubernetes -s local -- kubectl -n atmos-demo rollout status deployment/app --timeout=120s
    working_directory: ../../.context/cast-fixtures/landing/kubernetes
    env: !include 'landing-defaults.yaml .env'
    output: none
  - type: shell
    command: atmos emulator down landing-kubernetes -s local
    working_directory: ../../.context/cast-fixtures/landing/kubernetes
    env: !include 'landing-defaults.yaml .env'
    output: none
    when: always
  - type: shell
    command: python3 landing_checks.py sanitize kubernetes
  - type: shell
    command: atmos casts validate demo landing kubernetes
- name: casts validate demo landing kubernetes
  description: Validate the kubernetes homepage recording.
  steps:
  - type: shell
    command: python3 landing_checks.py validate kubernetes
