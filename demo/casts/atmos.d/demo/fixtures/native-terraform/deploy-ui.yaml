commands:
  - name: casts generate demo fixtures native-terraform deploy-ui
    description: Regenerate the Terraform deploy --ui (streaming UI) cast
    env: !include cast-defaults.yaml .env.command
    steps:
      - type: shell
        name: setup
        command: atmos casts setup
      - type: cast
        name: deploy-ui
        working_directory: "../../.context/cast-fixtures/native-terraform"
        title: "atmos terraform deploy --ui"
        mode: session
        shell: /bin/sh
        write_rate: 25ms
        key_interval: 250ms
        timeout: 45s
        defaults:
          cast: !include cast-defaults.yaml .cast
        env: !include cast-defaults.yaml .env.recording
        show:
          labels: false
        output:
          mode: raw
          cast: "../../website/static/casts/demo/fixtures/native-terraform/deploy-ui.cast"
        steps:
          - type: pause
            duration: 500ms
          - type: write
            text: "atmos terraform deploy vpc -s dev -auto-approve --ui"
          - type: key
            key: enter
          - type: wait
            text: "completed"
            timeout: 20s
          - type: pause
            duration: 500ms
      - type: shell
        name: validate
        command: atmos casts validate demo fixtures native-terraform deploy-ui
  - name: casts validate demo fixtures native-terraform deploy-ui
    description: Validate the Terraform deploy --ui cast
    steps:
      - type: script
        name: validate
        interpreter: python3
        script: |
          import os, sys
          sys.path.insert(0, os.getcwd())
          from cast_checks import load_text, strip_ansi, assert_no_experimental, assert_body_color, assert_no_error_output, assert_no_local_paths
          text = load_text("../../website/static/casts/demo/fixtures/native-terraform/deploy-ui.cast")
          plain = strip_ansi(text)
          assert_no_experimental(text)
          assert_body_color(text)
          for needle in ["deploy vpc -s dev", "Apply", "dev/vpc", "completed"]:
              if needle not in plain:
                  raise SystemExit(f"terraform deploy --ui cast missing {needle!r}")
          for bad in ["# Error", "Incorrect Usage", "unknown flag", "panic", "not found"]:
              if bad in plain:
                  raise SystemExit(f"terraform deploy --ui cast contains {bad!r}")
          assert_no_error_output(text)
          assert_no_local_paths(text)
