commands:
  - name: casts generate examples cdk-cloudformation lifecycle
    description: Regenerate the AWS CDK with CloudFormation lifecycle cast
    env: !include cast-defaults.yaml .env.command
    steps:
      - type: shell
        name: setup
        command: atmos casts setup
      - type: shell
        name: reset-stale-state
        working_directory: &cdk_cloudformation_fixture "../../.context/cast-fixtures/cdk-cloudformation"
        env: !include cast-defaults.yaml .env.recording
        output: none
        command: |
          npm --prefix components/cloudformation/greeting ci --no-audit --no-fund
          rm -rf components/cloudformation/greeting/cdk.out
          atmos --logs-level=Off aws cloudformation delete greeting -s local --auto-approve || true
          atmos --logs-level=Off emulator down aws -s local || true
      - type: cast
        name: lifecycle
        working_directory: *cdk_cloudformation_fixture
        title: AWS CDK with CloudFormation lifecycle
        mode: steps
        defaults:
          cast: !include cast-defaults.yaml .cast
          simulate: !include cast-defaults.yaml .simulate
        show:
          labels: false
        output:
          mode: raw
          cast: "../../website/static/casts/examples/cdk-cloudformation/lifecycle.cast"
        env: !include cast-defaults.yaml .env.recording
        steps:
          - type: simulate
            text: "# start a local `AWS` emulator, declared in the local stack"
          - type: simulate
            text: &emulator_up_cmd atmos emulator up aws -s local --ephemeral
          - type: shell
            name: emulator-up
            duration: 450ms
            interval: 750ms
            command: *emulator_up_cmd
          - type: simulate
            text: "# a before-hook runs `cdk synth`, then Atmos deploys the synthesized template"
          - type: simulate
            text: &cdk_deploy_cmd atmos aws cloudformation deploy greeting -s local
          - type: shell
            name: cdk-deploy
            duration: 550ms
            interval: 900ms
            # The AWS CDK CLI prints "AI agent detected" when an agent marker is in the environment; keep it out of the recording.
            command: env -u CLAUDECODE -u AI_AGENT atmos aws cloudformation deploy greeting -s local
          - type: simulate
            text: &cdk_output_cmd atmos aws cloudformation output greeting -s local
          - type: shell
            name: cdk-output
            duration: 450ms
            interval: 750ms
            command: *cdk_output_cmd
          - type: simulate
            text: "# tear it down when you're done"
          - type: simulate
            text: &cdk_delete_cmd atmos aws cloudformation delete greeting -s local --auto-approve
          - type: shell
            name: cdk-delete
            duration: 450ms
            interval: 750ms
            command: *cdk_delete_cmd
          - type: simulate
            text: &emulator_down_cmd atmos emulator down aws -s local
          - type: shell
            name: emulator-down
            when: always
            duration: 450ms
            interval: 750ms
            command: *emulator_down_cmd
      - type: script
        name: sanitize-runtime-values
        interpreter: python3
        script: |
          import os, sys
          sys.path.insert(0, os.getcwd())
          from cast_checks import load_text, assert_no_error_output, assert_no_local_paths
          decoded = load_text("../../website/static/casts/examples/cdk-cloudformation/lifecycle.cast")
          assert_no_error_output(decoded)
          assert_no_local_paths(decoded)
      - type: shell
        name: validate
        command: atmos casts validate examples cdk-cloudformation lifecycle
  - name: casts validate examples cdk-cloudformation lifecycle
    description: Validate the AWS CDK with CloudFormation lifecycle cast
    steps:
      - type: script
        name: validate
        interpreter: python3
        script: |
          import os, sys
          sys.path.insert(0, os.getcwd())
          from cast_checks import load_text, strip_ansi, assert_no_experimental, assert_body_color, assert_colored, assert_no_error_output, assert_no_local_paths
          text = load_text("../../website/static/casts/examples/cdk-cloudformation/lifecycle.cast")
          plain = strip_ansi(text)
          assert_no_experimental(text)
          assert_body_color(text)
          assert_colored(text, "emulator aws is up")
          for needle in [
              "# start a local `AWS` emulator",
              "cdk synth Demo",
              "emulator aws is up",
              "Created",
              "ParameterName",
              "Deleted stack",
              "emulator aws is down",
          ]:
              if needle not in plain:
                  raise SystemExit(f"cdk-cloudformation lifecycle cast missing {needle!r}")
          for bad in ["# Error", "Incorrect Usage", "unknown flag", "panic", "Error:", "[cdk-deploy]", "[cdk-delete]"]:
              if bad in plain:
                  raise SystemExit(f"cdk-cloudformation lifecycle cast contains {bad!r}")
          assert_no_error_output(text)
          assert_no_local_paths(text)
