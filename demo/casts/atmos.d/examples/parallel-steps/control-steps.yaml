commands:
  - name: casts generate examples parallel-steps control-steps
    description: Regenerate the Parallel Steps example cast
    env: !include cast-defaults.yaml .env.command
    steps:
      - type: shell
        name: setup
        command: atmos casts setup
      - type: cast
        name: control-steps
        working_directory: "../../.context/cast-fixtures/parallel-steps"
        title: "Parallel Steps: grouped checks and matrix expansion"
        mode: steps
        defaults:
          cast: !include cast-defaults.yaml .cast
          simulate: !include cast-defaults.yaml .simulate
        env: !include cast-defaults.yaml .env.recording
        show:
          labels: false
        output:
          mode: raw
          cast: "../../website/static/casts/examples/parallel-steps/control-steps.cast"
        steps:
          - type: simulate
            text: "# run independent checks; grouped results appear after completion"
          - type: simulate
            text: atmos workflow checks -f parallel
          - type: shell
            name: checks
            duration: 450ms
            interval: 750ms
            # Keep grouped status headings and child logs on one ordered stream.
            command: atmos workflow checks -f parallel 2>&1
          - type: simulate
            text: "# expand a matrix into parallel work"
          - type: simulate
            text: atmos workflow matrix -f parallel
          - type: shell
            name: matrix
            duration: 450ms
            interval: 750ms
            command: atmos workflow matrix -f parallel 2>&1
      - type: shell
        name: validate
        command: atmos casts validate examples parallel-steps control-steps
  - name: casts validate examples parallel-steps control-steps
    description: Validate the Parallel Steps example cast
    steps:
      - type: script
        name: validate
        interpreter: python3
        script: |
          import os, re, sys
          sys.path.insert(0, os.getcwd())
          from cast_checks import load_text, strip_ansi, assert_no_experimental, assert_body_color, assert_no_error_output, assert_no_local_paths
          text = load_text("../../website/static/casts/examples/parallel-steps/control-steps.cast")
          plain = strip_ansi(text)
          assert_no_experimental(text)
          assert_body_color(text)
          for needle in [
              "atmos workflow checks -f parallel",
              "lint passed",
              "unit tests passed",
              "packaging after lint and unit",
              "3 succeeded, 0 failed",
              "atmos workflow matrix -f parallel",
              "testing linux with Go 1.22",
              "testing darwin with Go 1.23",
              "4 succeeded, 0 failed",
          ]:
              if needle not in plain:
                  raise SystemExit(f"parallel-steps cast missing {needle!r}")
          for block in [
              "[lint] succeeded\nlint started\nlint passed\n",
              "[unit] succeeded\nunit tests started\nunit tests passed\n",
              "[package] succeeded\npackaging after lint and unit\n",
          ]:
              if block not in plain:
                  raise SystemExit(f"parallel-steps cast separated a grouped heading from its output: {block!r}")
          if plain.index("packaging after lint and unit") < max(plain.index("lint passed"), plain.index("unit tests passed")):
              raise SystemExit("parallel-steps cast shows packaging before its dependencies")
          matrix_blocks = re.findall(r"\[test-matrix_[^\]]+\] succeeded\ntesting (linux|darwin) with Go (1\.22|1\.23)\n", plain)
          if len(matrix_blocks) != 4 or set(matrix_blocks) != {(os_name, go) for os_name in ["linux", "darwin"] for go in ["1.22", "1.23"]}:
              raise SystemExit("parallel-steps cast separated matrix headings from their output")
          for bad in ["# Error", "Incorrect Usage", "unknown flag", "panic", "✗"]:
              if bad in plain:
                  raise SystemExit(f"parallel-steps cast contains {bad!r}")
          assert_no_error_output(text)
          assert_no_local_paths(text)
