commands:
  - name: casts generate examples cdk-terraform lifecycle
    description: Regenerate the CDK Terrain with Terraform lifecycle cast
    env: !include cast-defaults.yaml .env.command
    steps:
      - type: shell
        name: setup
        command: atmos casts setup
      - type: shell
        name: reset-stale-state
        working_directory: &cdk_terraform_fixture "../../.context/cast-fixtures/cdk-terraform"
        env: !include cast-defaults.yaml .env.recording
        output: none
        command: |
          npm --prefix components/terraform/greeting ci --no-audit --no-fund
          rm -rf components/terraform/greeting/cdktn.out components/terraform/greeting/cdk.tf.json
          find components -name "*.tfstate" -o -name "*.tfstate.backup" -o -name "*.planfile" -o -name "*.tfvars.json" -o -name "providers_override.tf.json" | xargs rm -f
          atmos --logs-level=Off emulator down aws -s local || true
      - type: cast
        name: lifecycle
        working_directory: *cdk_terraform_fixture
        title: CDK Terrain with Terraform lifecycle
        mode: steps
        defaults:
          cast: !include cast-defaults.yaml .cast
          simulate: !include cast-defaults.yaml .simulate
        show:
          labels: false
        output:
          mode: raw
          cast: "../../website/static/casts/examples/cdk-terraform/lifecycle.cast"
        env: !include cast-defaults.yaml .env.recording
        steps:
          - type: simulate
            text: "# start a local `AWS` emulator, declared in the local stack"
          - type: simulate
            text: &emulator_up_cmd atmos emulator up aws -s local --ephemeral
          - type: shell
            name: emulator-up
            duration: 450ms
            interval: 750ms
            command: *emulator_up_cmd
          - type: simulate
            text: "# a before-hook runs `cdktn synth`, then Terraform applies the generated configuration"
          - type: simulate
            text: &cdk_apply_cmd atmos terraform apply greeting -s local -auto-approve
          - type: shell
            name: cdk-apply
            duration: 550ms
            interval: 900ms
            command: *cdk_apply_cmd
          - type: simulate
            text: &cdk_output_cmd atmos terraform output greeting -s local
          - type: shell
            name: cdk-output
            duration: 450ms
            interval: 750ms
            command: *cdk_output_cmd
          - type: simulate
            text: "# tear it down when you're done"
          - type: simulate
            text: &cdk_destroy_cmd atmos terraform destroy greeting -s local -auto-approve
          - type: shell
            name: cdk-destroy
            duration: 450ms
            interval: 750ms
            command: *cdk_destroy_cmd
          - type: simulate
            text: &emulator_down_cmd atmos emulator down aws -s local
          - type: shell
            name: emulator-down
            when: always
            duration: 450ms
            interval: 750ms
            command: *emulator_down_cmd
      - type: script
        name: sanitize-runtime-values
        interpreter: python3
        script: |
          import os, sys
          sys.path.insert(0, os.getcwd())
          from cast_checks import load_text, assert_no_error_output, assert_no_local_paths
          decoded = load_text("../../website/static/casts/examples/cdk-terraform/lifecycle.cast")
          assert_no_error_output(decoded)
          assert_no_local_paths(decoded)
      - type: shell
        name: validate
        command: atmos casts validate examples cdk-terraform lifecycle
  - name: casts validate examples cdk-terraform lifecycle
    description: Validate the CDK Terrain with Terraform lifecycle cast
    steps:
      - type: script
        name: validate
        interpreter: python3
        script: |
          import os, sys
          sys.path.insert(0, os.getcwd())
          from cast_checks import load_text, strip_ansi, assert_no_experimental, assert_body_color, assert_colored, assert_no_error_output, assert_no_local_paths
          text = load_text("../../website/static/casts/examples/cdk-terraform/lifecycle.cast")
          plain = strip_ansi(text)
          assert_no_experimental(text)
          assert_body_color(text)
          assert_colored(text, "emulator aws is up")
          for needle in [
              "# start a local `AWS` emulator",
              "cdktn synth Demo",
              "emulator aws is up",
              "Apply complete!",
              "parameter_name",
              "Destroy complete!",
              "emulator aws is down",
          ]:
              if needle not in plain:
                  raise SystemExit(f"cdk-terraform lifecycle cast missing {needle!r}")
          for bad in ["# Error", "Incorrect Usage", "unknown flag", "panic", "Error:", "[cdk-apply]"]:
              if bad in plain:
                  raise SystemExit(f"cdk-terraform lifecycle cast contains {bad!r}")
          assert_no_error_output(text)
          assert_no_local_paths(text)
