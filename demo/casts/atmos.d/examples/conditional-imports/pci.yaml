commands:
  - name: casts generate examples conditional-imports pci
    description: Regenerate the Configure and select components with metadata example cast
    env: !include cast-defaults.yaml .env.command
    steps:
      - type: shell
        name: setup
        command: atmos casts setup
      - type: cast
        name: pci
        working_directory: "../../.context/cast-fixtures/conditional-imports"
        title: "Configure and select components with metadata"
        mode: steps
        defaults:
          cast: !include cast-defaults.yaml .cast
          simulate: !include cast-defaults.yaml .simulate
        env: !include cast-defaults.yaml .env.recording
        show:
          labels: false
        output:
          mode: raw
          cast: "../../website/static/casts/examples/conditional-imports/pci.cast"
        steps:
          - type: simulate
            text: "# a native label selects the mixin"
          - type: simulate
            text: &stack_cmd cat stacks/payments.yaml
          - type: shell
            name: stack-label
            duration: 550ms
            interval: 900ms
            command: *stack_cmd
          - type: simulate
            text: "# find the component instances with the same native label"
          - type: simulate
            text: &labels_cmd atmos list instances --labels pci:true
          - type: shell
            name: labels
            duration: 550ms
            interval: 900ms
            command: *labels_cmd
          - type: simulate
            text: "# the native tag identifies the same instance"
          - type: simulate
            text: &tags_cmd atmos list instances --tags pci
          - type: shell
            name: tags
            duration: 550ms
            interval: 900ms
            command: *tags_cmd
          - type: simulate
            text: "# pci: true includes the PCI mixin"
          - type: simulate
            text: &payments_cmd atmos describe component app -s payments --query .vars
          - type: shell
            name: payments
            duration: 550ms
            interval: 900ms
            command: *payments_cmd
      - type: shell
        name: validate
        command: atmos casts validate examples conditional-imports pci
  - name: casts validate examples conditional-imports pci
    description: Validate the Configure and select components with metadata example cast
    steps:
      - type: script
        name: validate
        interpreter: starlark
        script: |
          load("cast_checks.star", "load_text", "strip_ansi", "assert_colored", "assert_no_experimental", "assert_no_error_output", "assert_no_local_paths")

          text = load_text("../../website/static/casts/examples/conditional-imports/pci.cast")
          plain = strip_ansi(text)
          assert_no_experimental(text)
          assert_no_error_output(text)
          assert_no_local_paths(text)
          assert_colored(text, "audit_logging_enabled")

          for needle in [
              'pci: true',
              'when: !cel labels.pci == true',
              'atmos list instances --labels pci:true',
              'atmos list instances --tags pci',
              'atmos describe component app -s payments --query .vars',
              'audit_logging_enabled: true',
          ]:
              if needle not in plain:
                  fail("conditional-imports cast missing " + repr(needle))

          ui.success("conditional-imports pci cast validated")
