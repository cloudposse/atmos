commands:
  - name: casts generate examples hooks-tfmigrate tfmigrate-example
    description: Regenerate the tfmigrate hooks example cast
    env: !include cast-defaults.yaml .env.command
    steps:
      - type: shell
        name: setup
        command: atmos casts setup
      - type: shell
        name: reset-state
        working_directory: &tfmigrate_fixture "../../.context/cast-fixtures/hooks-tfmigrate"
        output: none
        command: |
          rm -rf state components/terraform/service/.terraform components/terraform/service-legacy/.terraform components/terraform/service/terraform.tfstate.d
          rm -f components/terraform/service/.terraform.lock.hcl components/terraform/service-legacy/.terraform.lock.hcl components/terraform/service/backend.tf.json components/terraform/service-legacy/backend.tf.json components/terraform/service/test-service.terraform.tfvars.json components/terraform/service-legacy/test-service-legacy.terraform.tfvars.json
      - type: shell
        name: seed-legacy-state
        working_directory: *tfmigrate_fixture
        output: none
        command: atmos terraform apply service-legacy -s test -auto-approve >/dev/null 2>&1
      - type: shell
        name: warm-service-init
        working_directory: *tfmigrate_fixture
        output: none
        command: atmos terraform init service -s test >/dev/null 2>&1
      - type: cast
        name: tfmigrate-example
        working_directory: *tfmigrate_fixture
        title: "Terraform state migrations with tfmigrate"
        mode: steps
        defaults:
          cast: !include cast-defaults.yaml .cast
          simulate: !include cast-defaults.yaml .simulate
        env: !include cast-defaults.yaml .env.recording
        show:
          labels: false
        output:
          mode: raw
          cast: "../../website/static/casts/examples/hooks-tfmigrate/tfmigrate-example.cast"
        steps:
          - type: simulate
            text: "# inspect the migration context Atmos passes to tfmigrate"
          - type: simulate
            text: &migrate_list_cmd atmos terraform migrate list service -s test --columns component --columns stack --columns workspace --columns history_key
          - type: shell
            name: migrate-list
            duration: 450ms
            interval: 750ms
            command: *migrate_list_cmd
          - type: simulate
            text: "# the tfmigrate hook previews the state migration before terraform plan"
          - type: simulate
            text: &plan_cmd atmos terraform plan service -s test
          - type: shell
            name: plan-with-migration-preview
            duration: 450ms
            interval: 750ms
            command: *plan_cmd
          - type: simulate
            text: "# apply moves the state first, then terraform converges without replacing anything"
          - type: simulate
            text: &apply_cmd atmos terraform apply service -s test
          - type: shell
            name: apply-with-migration
            duration: 450ms
            interval: 750ms
            command: *apply_cmd
      - type: shell
        name: validate
        command: atmos casts validate examples hooks-tfmigrate tfmigrate-example
  - name: casts validate examples hooks-tfmigrate tfmigrate-example
    description: Validate the tfmigrate hooks example cast
    steps:
      - type: script
        name: validate
        interpreter: python3
        script: |
          import os, sys
          sys.path.insert(0, os.getcwd())
          from cast_checks import load_text, strip_ansi, assert_no_experimental, assert_no_error_output, assert_no_local_paths
          text = load_text("../../website/static/casts/examples/hooks-tfmigrate/tfmigrate-example.cast")
          plain = strip_ansi(text)
          assert_no_experimental(text)
          for needle in [
              "atmos terraform migrate list service -s test",
              "atmos terraform plan service -s test",
              "atmos terraform apply service -s test",
              "tfmigrate/test/service/default/history.json",
              "state migrator plan success",
              "state migrator apply success",
              "history saved",
              "No changes.",
          ]:
              if needle not in plain:
                  raise SystemExit(f"hooks-tfmigrate cast missing {needle!r}")
          assert_no_error_output(text)
          assert_no_local_paths(text)
