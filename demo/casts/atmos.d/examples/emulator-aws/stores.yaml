commands:
  - name: casts generate examples emulator-aws stores
    description: Regenerate the AWS emulator store CRUD cast
    env: !include cast-defaults.yaml .env.command
    steps:
      - type: shell
        name: setup
        command: atmos casts setup
      - type: shell
        name: reset-stale-state
        working_directory: &emulator_aws_fixture "../../.context/cast-fixtures/emulator-aws"
        env: !include cast-defaults.yaml .env.recording
        output: none
        command: |
          atmos --logs-level=Off emulator down aws -s local || true
      - type: cast
        name: stores
        working_directory: *emulator_aws_fixture
        title: "atmos store: raw CRUD against a local AWS emulator"
        mode: steps
        defaults:
          cast: !include cast-defaults.yaml .cast
          simulate: !include cast-defaults.yaml .simulate
        show:
          labels: false
        output:
          mode: raw
          cast: "../../website/static/casts/examples/emulator-aws/stores.cast"
        env: !include cast-defaults.yaml .env.recording
        steps:
          - type: simulate
            text: "# start a local `AWS` emulator, declared in the local stack"
          - type: simulate
            text: &emulator_up_cmd atmos emulator up aws -s local --ephemeral
          - type: shell
            name: emulator-up
            duration: 450ms
            interval: 750ms
            command: *emulator_up_cmd
          - type: simulate
            text: "# atmos store talks to the same emulator, no real `AWS` account needed"
          - type: simulate
            text: &store_set_cmd atmos store set local/ssm image_tag sha256:abc123 --stack=dev
          - type: shell
            name: store-set
            duration: 450ms
            interval: 750ms
            command: *store_set_cmd
          - type: simulate
            text: &store_get_cmd atmos store get local/ssm image_tag --stack=dev
          - type: shell
            name: store-get
            duration: 450ms
            interval: 750ms
            command: *store_get_cmd
          - type: simulate
            text: "# list every key/value pair for that scope"
          - type: simulate
            text: &store_list_cmd atmos store list local/ssm --stack=dev
          - type: shell
            name: store-list
            duration: 450ms
            interval: 750ms
            command: *store_list_cmd
          - type: simulate
            text: "# tear it down when you're done"
          - type: simulate
            text: &emulator_down_cmd atmos emulator down aws -s local
          - type: shell
            name: emulator-down
            when: always
            duration: 450ms
            interval: 750ms
            command: *emulator_down_cmd
      - type: script
        name: sanitize-runtime-values
        interpreter: python3
        script: |
          from pathlib import Path
          import re

          path = Path("../../website/static/casts/examples/emulator-aws/stores.cast")
          text = path.read_text()
          text = re.sub(
              r"(?:mirror\\.gcr\\.io/)?floci/floci@sha256:c88ec20bf221630dd195d38a14eeb0ac52ddfa72c37ebb3c8aa17f63ae27c5f2",
              "floci/floci:1.5.23",
              text,
          )
          text = re.sub(r"(?<=atmos-local-emulator-aws\\t)c88ec20bf221(?=\\trunning)", "floci/floci:1.5.23", text)
          path.write_text(text)
          import os, sys
          sys.path.insert(0, os.getcwd())
          from cast_checks import load_text, assert_no_error_output, assert_no_local_paths
          decoded = load_text("../../website/static/casts/examples/emulator-aws/stores.cast")
          assert_no_error_output(decoded)
          assert_no_local_paths(decoded)
      - type: shell
        name: validate
        command: atmos casts validate examples emulator-aws stores
  - name: casts validate examples emulator-aws stores
    description: Validate the AWS emulator store CRUD cast
    steps:
      - type: script
        name: validate
        interpreter: python3
        script: |
          import os, sys
          sys.path.insert(0, os.getcwd())
          from cast_checks import load_text, strip_ansi, assert_no_experimental, assert_body_color, assert_no_error_output, assert_no_local_paths
          text = load_text("../../website/static/casts/examples/emulator-aws/stores.cast")
          plain = strip_ansi(text)
          assert_no_experimental(text)
          assert_body_color(text)
          for needle in [
              "# start a local `AWS` emulator",
              "emulator aws is up",
              "atmos store set local/ssm image_tag",
              "Set image_tag in store local/ssm",
              "atmos store get local/ssm image_tag",
              "sha256:abc123",
              "atmos store list local/ssm",
              "image_tag",
              "emulator aws is down",
          ]:
              if needle not in plain:
                  raise SystemExit(f"emulator aws stores cast missing {needle!r}")
          for bad in ["# Error", "Incorrect Usage", "unknown flag", "panic", "not found", "Error:", "[store-set]", "[store-get]", "[store-list]", "completed"]:
              if bad in plain:
                  raise SystemExit(f"emulator aws stores cast contains {bad!r}")
          assert_no_error_output(text)
          assert_no_local_paths(text)
