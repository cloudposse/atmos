commands:
  - name: casts generate examples tagging-default-tags inherit-tags
    description: Regenerate the Inherit AWS default tags example cast
    env: !include cast-defaults.yaml .env.command
    steps:
      - type: shell
        name: setup
        command: atmos casts setup
      - type: cast
        name: inherit-tags
        working_directory: "../../.context/cast-fixtures/tagging-default-tags"
        title: "Inherit AWS default tags"
        mode: steps
        defaults:
          cast: !include cast-defaults.yaml .cast
          simulate: !include cast-defaults.yaml .simulate
        env: !include cast-defaults.yaml .env.recording
        show:
          labels: false
        output:
          mode: raw
          cast: "../../website/static/casts/examples/tagging-default-tags/inherit-tags.cast"
        steps:
          - type: simulate
            text: "# shared tags plus the dev environment tag"
          - type: simulate
            text: &dev_tags_cmd atmos describe component app -s dev --query .providers.aws.default_tags.tags
          - type: shell
            name: dev-tags
            duration: 550ms
            interval: 900ms
            command: *dev_tags_cmd
          - type: simulate
            text: "# prod inherits the same shared tags"
          - type: simulate
            text: &prod_tags_cmd atmos describe component app -s prod --query .providers.aws.default_tags.tags
          - type: shell
            name: prod-tags
            duration: 550ms
            interval: 900ms
            command: *prod_tags_cmd
      - type: shell
        name: validate
        command: atmos casts validate examples tagging-default-tags inherit-tags
  - name: casts validate examples tagging-default-tags inherit-tags
    description: Validate the Inherit AWS default tags example cast
    steps:
      - type: script
        name: validate
        interpreter: starlark
        script: |
          load("cast_checks.star", "load_text", "strip_ansi", "assert_colored", "assert_no_experimental", "assert_no_error_output", "assert_no_local_paths")

          text = load_text("../../website/static/casts/examples/tagging-default-tags/inherit-tags.cast")
          plain = strip_ansi(text)
          assert_no_experimental(text)
          assert_no_error_output(text)
          assert_no_local_paths(text)
          assert_colored(text, "owner")

          for needle in [
              'atmos describe component app -s dev --query .providers.aws.default_tags.tags',
              'atmos describe component app -s prod --query .providers.aws.default_tags.tags',
              'environment: dev',
              'environment: prod',
              'managed-by: atmos',
              'owner: platform',
          ]:
              if needle not in plain:
                  fail("tagging-default-tags cast missing " + repr(needle))

          ui.success("tagging-default-tags inherit-tags cast validated")
