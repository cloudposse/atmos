commands:
  - name: casts generate examples artifacts publish-and-restore
    description: Regenerate the artifacts example cast
    env: !include cast-defaults.yaml .env.command
    steps:
      - type: shell
        name: setup
        command: atmos casts setup
      - type: script
        name: record
        interpreter: starlark
        script: |
          load("casts.star", "demo_config")

          rec = cast.recorder(title="Publish and restore a local artifact", **demo_config("examples/artifacts/publish-and-restore", fixture="artifacts"))
          rec.run("mkdir -p bundle")
          rec.run("printf '%s\\n' '# App bundle' '' '**Verify the restore** with `diff -r bundle restored`.' > bundle/README.md")
          rec.run("atmos artifacts publish ./bundle --repository=local --name=builds/app --version=1.0.0 --readme=README.md", expect=["Published builds/app:1.0.0", ".artifacts/builds/app/1.0.0", "Content digest"])
          rec.run("atmos artifacts list --repository=local", expect=["builds/app", "1.0.0"])
          rec.run("atmos artifacts pull builds/app:1.0.0 --repository=local --output=./restored", expect=["Pulled builds/app:1.0.0", "Content digest", "App bundle", "Verify the restore", "diff -r bundle restored"])
          rec.run("diff -r bundle restored")
          rec.generate()
