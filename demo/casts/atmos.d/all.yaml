commands:
  - name: casts generate all
    description: Regenerate every committed website cast demo
    env: !include cast-defaults.yaml .env.command
    steps:
      - type: script
        name: starlark
        interpreter: starlark
        script: |
          atmos.run(["casts", "generate", "demo", "fixtures", "starlark", "release-plan"])
      - type: shell
        name: native-terraform
        command: atmos casts generate demo fixtures native-terraform
      - type: shell
        name: streaming-ui
        command: atmos casts generate demo fixtures streaming-ui
      - type: shell
        name: demo-vendoring
        command: atmos casts generate demo fixtures demo-vendoring
      - type: shell
        name: basic
        command: atmos casts generate demo fixtures basic
      - type: shell
        name: landing
        command: atmos casts generate demo landing
      - type: shell
        name: examples
        command: atmos casts generate examples
      - type: shell
        name: cli-commands-cast
        command: atmos casts generate cli commands cast
      - type: shell
        name: cli-interactive-menu
        command: atmos casts generate cli interactive-menu
      - type: shell
        name: screengrabs-demo-stacks
        command: atmos casts generate screengrabs demo-stacks
      - type: shell
        name: screengrabs-cli
        command: atmos casts generate screengrabs cli
      - type: shell
        name: validate
        command: atmos casts validate all
  - name: casts validate all
    description: Validate every committed website cast demo
    env: !include cast-defaults.yaml .env.command
    steps:
      - type: script
        name: starlark
        interpreter: starlark
        script: |
          atmos.run(["casts", "validate", "demo", "fixtures", "starlark", "release-plan"])
      - type: shell
        name: native-terraform
        command: atmos casts validate demo fixtures native-terraform
      - type: shell
        name: streaming-ui
        command: atmos casts validate demo fixtures streaming-ui
      - type: shell
        name: demo-vendoring
        command: atmos casts validate demo fixtures demo-vendoring
      - type: shell
        name: basic
        command: atmos casts validate demo fixtures basic
      - type: shell
        name: landing
        command: atmos casts validate demo landing
      - type: shell
        name: examples
        command: atmos casts validate examples
      - type: shell
        name: cli-commands-cast
        command: atmos casts validate cli commands cast
      - type: shell
        name: cli-interactive-menu
        command: atmos casts validate cli interactive-menu
      - type: shell
        name: screengrabs-demo-stacks
        command: atmos casts validate screengrabs demo-stacks
      - type: shell
        name: screengrabs-cli
        command: atmos casts validate screengrabs cli
      - type: shell
        name: screengrabs-cli-about-help
        command: atmos casts validate screengrabs cli about-help
      - type: shell
        name: demo-fixtures-ai-ask
        command: atmos casts validate demo fixtures ai-ask
      - type: shell
        name: demo-fixtures-tests
        command: atmos casts validate demo fixtures tests
      # Committed casts are reviewed as text, so guard the guards: every cast
      # must use a real terminal type, and every validator must run from here.
      - type: script
        name: coverage
        interpreter: python3
        script: |
          import os, sys
          sys.path.insert(0, os.getcwd())
          from cast_checks import assert_all_validators_reachable, assert_no_dumb_term_recordings
          assert_no_dumb_term_recordings(
              source_glob="atmos.d/**/*.yaml",
              cast_glob="../../website/static/casts/**/*.cast",
          )
          assert_all_validators_reachable("casts validate all")
