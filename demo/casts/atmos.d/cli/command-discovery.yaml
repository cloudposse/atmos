commands:
  - name: casts generate cli command-discovery
    description: Record command documentation and interactive example discovery
    env: !include cast-defaults.yaml .env.command
    steps:
      - type: shell
        name: build
        output: none
        command: go build -o ../../.context/bin/atmos ../..
      - type: script
        name: prepare-example
        interpreter: python3
        script: !include scripts/prepare-command-discovery.py
        output: none
      - type: cast
        name: command-discovery
        working_directory: &fixture "../../.context/cast-fixtures/command-discovery/project"
        title: "Find documentation and initialize an example"
        shell: /bin/sh
        write_rate: 35ms
        key_interval: 200ms
        timeout: 60s
        defaults:
          cast: !include cast-defaults.yaml .cast
          simulate: !include cast-defaults.yaml .simulate
        env: !include cast-defaults.yaml .env.recording
        show:
          labels: false
        output:
          mode: raw
          cast: "../../website/static/casts/cli/command-discovery.cast"
        steps:
          - type: simulate
            text: atmos terraform --help=usage
          - type: shell
            name: documentation
            command: atmos terraform --help=usage
            interval: 2s
          - type: session
            steps:
              - type: wait
                text: '> '
                timeout: 10s
              - type: write
                text: atmos terraform --example
              - type: key
                key: enter
              - type: wait
                text: Choose an example
                timeout: 15s
              - type: pause
                duration: 2s
              - type: key
                key: down
              - type: pause
                duration: 700ms
              - type: key
                key: up
              - type: pause
                duration: 700ms
              - type: key
                key: enter
              - type: wait
                text: Initialize this example?
                timeout: 10s
              - type: pause
                duration: 3s
              - type: key
                key: left
              - type: pause
                duration: 1s
              - type: playback
                duration: 4s
                steps:
                  - type: key
                    key: enter
                  - type: wait
                    regex: '(?s)Initialized quick-start-simple.*components/terraform/station/.*> '
                    timeout: 30s
              - type: pause
                duration: 2s
          - type: simulate
            text: cd quick-start-simple
          - type: simulate
            text: atmos list stacks
          - type: shell
            name: installed-stacks
            working_directory: "../../.context/cast-fixtures/command-discovery/project/quick-start-simple"
            command: atmos list stacks
            interval: 3s
          - type: simulate
            text: cd ..
          - type: session
            steps:
              - type: wait
                text: '> '
                timeout: 10s
              - type: write
                text: atmos terraform --example
              - type: key
                key: enter
              - type: wait
                text: Choose an example
                timeout: 15s
              - type: pause
                duration: 1s
              - type: key
                key: enter
              - type: wait
                text: Overwrite matching files in the existing directory?
                timeout: 10s
              - type: pause
                duration: 3s
              - type: key
                key: enter
              - type: wait
                text: Example initialization declined.
                timeout: 10s
              - type: pause
                duration: 2s
      - type: script
        name: sanitize
        interpreter: python3
        script: !include scripts/sanitize-command-discovery.py
      - type: script
        name: validate
        interpreter: starlark
        script: !include scripts/validate-command-discovery.star
  - name: casts validate cli command-discovery
    description: Validate the command discovery recording
    steps:
      - type: script
        name: validate
        interpreter: starlark
        script: !include scripts/validate-command-discovery.star
