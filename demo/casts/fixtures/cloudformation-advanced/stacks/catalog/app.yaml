components:
  aws/cloudformation:
    app:
      path: template.yaml
      stack_name: atmos-cast-app-local
      capabilities:
        - CAPABILITY_IAM
      parameters:
        ArtifactBucket: "{{ .vars.artifact_bucket }}"
        ArtifactKey: 'lambda/{{ getenv "ATMOS_DEMO_RELEASE" "v1" }}/handler.zip'
      settings:
        aws_cloudformation:
          region: us-east-1
      provision:
        targets:
          artifacts:
            kind: aws/s3
            bucket: "{{ .vars.artifact_bucket }}"
            region: us-east-1
      hooks:
        build-and-publish:
          events: [before.aws/cloudformation.apply]
          kind: steps
          on_failure: fail
          with:
            - name: build
              type: shell
              command: python3 build.py
              output: raw
              show:
                labels: false
              env:
                ATMOS_DEMO_RELEASE: '{{ getenv "ATMOS_DEMO_RELEASE" "v1" }}'
            - name: package
              type: archive
              source: .build/package/
              destination: .build/handler.zip
              mtime: epoch
            - name: publish
              type: publish
              source: .build/handler.zip
              destination: 'lambda/{{ getenv "ATMOS_DEMO_RELEASE" "v1" }}/handler.zip'
              target: artifacts
        validate:
          events: [after.aws/cloudformation.apply]
          kind: steps
          on_failure: fail
          with:
            - name: endpoint
              type: shell
              output: none
              command: >-
                atmos --chdir=../../.. auth exec --identity local-aws --
                python3 components/cloudformation/app/function_url.py
            - name: response
              type: http
              url: '{{ "{{ .steps.endpoint.value }}" }}'
              expect:
                status: [200]
                response:
                  - '^\{"message": "hello from Atmos", "release": "{{ getenv "ATMOS_DEMO_RELEASE" "v1" }}"\}$'
              timeout: 60s
              retry:
                max_attempts: 10
                backoff_strategy: constant
                initial_delay: 2s
            - name: show-response
              type: log
              content: '{{ "{{ .steps.response.value }}" }}'
