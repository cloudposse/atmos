base_path: "./"

components:
  terraform:
    base_path: "components/terraform"
    apply_auto_approve: false
    deploy_run_init: true
    init_run_reconfigure: true
    auto_generate_backend_file: false

stacks:
  base_path: "stacks"
  included_paths:
    - "deploy/**/*"
  name_template: "{{.vars.stage}}"

# Empty auth configuration (no identities configured).
# This allows commands to run without authentication.
auth:

# Ask questions about this project in plain language. Claude Code runs the commands
# and Atmos asks before anything that needs approval.
ai:
  enabled: true
  default_provider: claude-code
  timeout_seconds: 180
