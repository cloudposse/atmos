base_path: ./
logs:
  level: Warning
commands:
  - name: test
    description: Run the local post-deployment checks
    commands:
      - name: demo
        description: Show the test tree and failure-only logs
        steps:
          - name: smoke-tests
            type: test
            title: Post-deployment tests
            steps:
              - name: health
                title: Health
                type: shell
                command: echo 'Health check passed'; sleep 0.5
              - name: endpoints
                title: Endpoints
                type: parallel
                max_concurrency: 2
                steps:
                  - name: homepage
                    title: Homepage
                    type: shell
                    command: echo 'Homepage returned HTTP 200'; sleep 0.7
                  - name: authentication
                    title: Authentication
                    type: shell
                    command: sleep 1; echo 'Expected HTTP 200; received HTTP 503.' >&2; exit 1
              - name: regions
                title: Regions
                type: matrix
                max_concurrency: 2
                matrix:
                  region: [us-east-1, eu-west-1]
                steps:
                  - name: response
                    title: Response
                    type: shell
                    command: echo 'Checking {{ .matrix.region }}'; sleep 0.8
