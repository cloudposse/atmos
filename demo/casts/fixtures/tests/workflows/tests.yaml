workflows:
  demo:
    description: Show the result tree and failure-only logs for post-deployment checks.
    show:
      header: false
      command: false
      labels: false
      count: false
      progress: false
    steps:
      - name: smoke-tests
        type: test
        title: Post-deployment tests
        steps:
          - name: health
            type: shell
            command: echo 'Health check passed'; sleep 0.5
          - name: endpoints
            type: parallel
            max_concurrency: 2
            steps:
              - name: homepage
                type: shell
                command: echo 'Homepage returned HTTP 200'; sleep 0.7
              - name: authentication
                type: shell
                command: sleep 1; echo 'Expected HTTP 200; received HTTP 503.' >&2; exit 1
          - name: regions
            type: matrix
            max_concurrency: 2
            matrix:
              region: [us-east-1, eu-west-1]
            steps:
              - name: response
                type: shell
                command: echo 'Checking {{ .matrix.region }}'; sleep 0.8
