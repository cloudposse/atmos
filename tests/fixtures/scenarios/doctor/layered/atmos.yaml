# Layered doctor fixture: atmos.yaml imports another configuration file, so repairs of
# atmos.yaml are blocked and name the import. Stack files can still be repaired.
base_path: "./"

import:
    - config/logging.yaml

components:
    terraform:
        base_path: "components/terraform"
        apply_auto_approve: false
        init_run_reconfigure: false
        auto_generate_backend_file: false

stacks:
    base_path: 'stacks'
    included_paths: ["deploy/**/*"]
    excluded_paths: ["**/_defaults.yaml"]
    name_pattern: "{stage}"

commands:
    - name: inspect
      description: 'Inspect a component in a stack using a deliberately long description string that exceeds eighty characters'
      arguments:
          - name: target
            type: component  # legacy semantic argument
      flags:
          - name: stack
            shorthand: s
            semantic_type: stack
      steps:
          - echo "inspect"
    - name: group
      commands:
          - name: child
            flags:
                - name: stack
                  semantic_type: "stack"
            steps: ["echo child"]
