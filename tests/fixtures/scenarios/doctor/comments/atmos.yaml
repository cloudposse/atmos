# Doctor fixture: comments on every migrated key, a templated command and stacks.name_template
# elsewhere in the file, and comment blocks at the end of the document.
base_path: "./"

components:
    terraform:
        base_path: "components/terraform"
        apply_auto_approve: false
        # Legacy reconfigure policy; doctor should migrate this.
        # The note spans two lines.
        init_run_reconfigure: false # keep reconfiguring off
        auto_generate_backend_file: false

stacks:
    base_path: 'stacks'
    included_paths: ["deploy/**/*"]
    name_template: "{{ .vars.stage }}"

commands:
    - name: inspect
      description: "Inspect {{ .Arguments.target }} in a stack"
      arguments:
          # Which component to inspect.
          - name: target
            type: component  # legacy semantic argument
      flags:
          - name: stack
            shorthand: s
            # Legacy semantic flag.
            semantic_type: stack
      steps:
          - echo "inspect {{ .Arguments.target }} in {{ .Flags.stack }}"

logs:
    level: Info
