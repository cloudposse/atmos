# Atmos CLI configuration for this test fixture.
# https://atmos.tools/cli/configuration

# Base path for components, stacks and workflows.
base_path: "."

# Template configuration.
templates:
  settings:
    enabled: true
    sprig:
      enabled: true
    gomplate:
      enabled: true

# Register the local `scaffold.yaml` in this directory as the "example"
# template, so `atmos scaffold generate example <target>` resolves it by
# name instead of requiring a local path argument.
scaffold:
  templates:
    example:
      description: "Test fixture exercising a glob spec.files[].path + when: skipping a whole directory recursively"
      source: "."

# Logging.
logs:
  level: info
