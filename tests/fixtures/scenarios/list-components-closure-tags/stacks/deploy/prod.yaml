# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json
#
# Fixture for `list components --tags=... --include-dependencies`: a forward
# dependency chain (vpc -> eks/cluster -> eks/istio/base -> eks/istio/istiod)
# tagged `istio`/`eks`/`network`, plus an unrelated `eks/karpenter` component
# (tagged `eks` but outside the istio chain) that a --tags=istio closure
# preview must NOT pull in.

vars:
  stage: prod

components:
  terraform:
    vpc:
      metadata:
        component: mock
        tags:
          - network
    eks/cluster:
      metadata:
        component: mock
        tags:
          - eks
      settings:
        depends_on:
          1:
            component: vpc
    eks/karpenter:
      metadata:
        component: mock
        tags:
          - eks
      settings:
        depends_on:
          1:
            component: eks/cluster
    eks/istio/base:
      metadata:
        component: mock
        tags:
          - istio
      settings:
        depends_on:
          1:
            component: eks/cluster
    eks/istio/istiod:
      metadata:
        component: mock
        tags:
          - istio
      settings:
        depends_on:
          1:
            component: eks/cluster
          2:
            component: eks/istio/base
