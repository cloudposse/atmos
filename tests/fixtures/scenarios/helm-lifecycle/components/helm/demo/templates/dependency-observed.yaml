{{- if and .Values.hooks.requiredDeployment .Values.hooks.validateDependency }}
{{- $required := lookup "apps/v1" "Deployment" .Release.Namespace .Values.hooks.requiredDeployment }}
{{- if not $required }}
{{- fail (printf "required dependency Deployment %q is not ready" .Values.hooks.requiredDeployment) }}
{{- end }}
{{- $desired := int (dig "spec" "replicas" 1 $required) }}
{{- $available := int (dig "status" "availableReplicas" 0 $required) }}
{{- $generation := int64 (dig "metadata" "generation" 0 $required) }}
{{- $observedGeneration := int64 (dig "status" "observedGeneration" 0 $required) }}
{{- if or (lt $available $desired) (lt $observedGeneration $generation) }}
{{- fail (printf "required dependency Deployment %q is not ready: available=%d desired=%d observedGeneration=%d generation=%d" .Values.hooks.requiredDeployment $available $desired $observedGeneration $generation) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dependency-observed
  namespace: {{ .Release.Namespace }}
data:
  requiredDeployment: {{ .Values.hooks.requiredDeployment | quote }}
  ready: "true"
  availableReplicas: {{ $available | quote }}
{{- end }}
