vars:
  stage: dev

secrets:
  vars:
    oss-token:
      description: Synthetic single-line secret used by the Helm integration scenario.
      store: helm-lifecycle-secrets
      scope: stack
      required: true
    oss-private-key:
      description: Synthetic multiline secret used by the Helm integration scenario.
      store: helm-lifecycle-secrets
      scope: stack
      required: true

# Native Helm lifecycle defaults for every Helm component in this stack.
helm:
  release:
    wait:
      strategy: watcher
    # Nested k3s runners can leave Helm's watcher blocked after release
    # resources are gone. Live deletes use deterministic legacy waiting; the
    # workflow still exercises watcher selection through its delete dry-run.
    delete:
      wait:
        strategy: legacy
    # Leave enough headroom for nested k3s workloads on resource-constrained
    # macOS/Colima runners. Components that exercise timeout behavior override
    # this value explicitly below.
    timeout: 4m
    history:
      max: 10
    install:
      crds: skip

components:
  emulator:
    kubernetes:
      driver: k3s
      ephemeral: true

  helm:
    oss-ingress-base:
      metadata:
        type: abstract
        component: ingress-nginx
      repositories:
        - name: ingress-nginx
          url: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx/ingress-nginx
      version: 4.15.1
      name: oss-ingress
      namespace: helm-oss
      release:
        wait:
          jobs: true
        install:
          on_failure: uninstall
        upgrade:
          on_failure: rollback
          cleanup_on_failure: true
      values:
        fullnameOverride: oss-ingress
        controller:
          replicaCount: 1
          ingressClass: atmos-oss
          ingressClassResource:
            name: atmos-oss
            controllerValue: atmos.test/ingress-nginx
          service:
            type: ClusterIP
          image:
            digest: ""
            digestChroot: ""
          admissionWebhooks:
            patch:
              image:
                digest: ""
          extraEnvs:
            - name: ATMOS_SINGLE_LINE_SECRET
              value: !secret oss-token
            - name: ATMOS_MULTILINE_SECRET
              value: !secret oss-private-key | raw

    oss-ingress:
      metadata:
        component: ingress-nginx
        inherits:
          - oss-ingress-base

    oss-ingress-upgrade:
      metadata:
        component: ingress-nginx
        inherits:
          - oss-ingress
      values:
        controller:
          replicaCount: 2
          extraEnvs:
            - name: ATMOS_SINGLE_LINE_SECRET
              value: !secret oss-token
            - name: ATMOS_MULTILINE_SECRET
              value: !secret oss-private-key | raw
            - name: ATMOS_UPGRADE_MARKER
              value: upgraded

    demo:
      metadata:
        component: demo
      # The chart reference. "." is the component directory itself
      # (components/helm/demo), which contains Chart.yaml.
      chart: "."
      namespace: demo
      release:
        wait:
          strategy: legacy
        install:
          on_failure: uninstall
        upgrade:
          on_failure: rollback
          cleanup_on_failure: true
      # Atmos `values:` are the Helm chart values, merged via Atmos inheritance.
      values:
        replicaCount: 2
        image:
          tag: "1.27"
        service:
          port: 8080
        tpl:
          source: from-stack
          expression: !literal "{{ .Values.tpl.source }}"

    demo-repo:
      metadata:
        component: demo
      repositories:
        - name: local
          url: !env HELM_DEMO_REPO_URL
      chart: local/demo
      version: 0.1.0
      namespace: demo-repo
      values:
        replicaCount: 2
        image:
          tag: "1.27"
        service:
          port: 8080

    demo-jobs:
      metadata:
        component: demo
      chart: "."
      name: demo-jobs
      namespace: demo-jobs
      release:
        wait:
          jobs: true
      values:
        hooks:
          enabled: false
        job:
          enabled: true
          sleepSeconds: 3

    demo-no-hooks:
      metadata:
        component: demo
      chart: "."
      name: demo-no-hooks
      namespace: demo-no-hooks
      release:
        chart_hooks: false

    demo-hook-only:
      metadata:
        component: demo
      chart: "."
      name: demo-hook-only
      namespace: demo-hook-only
      release:
        wait:
          strategy: hookOnly
      values:
        deployment:
          readinessGate: true

    demo-timeout:
      metadata:
        component: demo
      chart: "."
      name: demo-timeout
      namespace: demo-timeout
      release:
        # Keep the lifecycle deadline below the readiness delay while leaving
        # enough time for recovery to finish on resource-constrained runners.
        timeout: 15s
        wait:
          strategy: watcher
        install:
          on_failure: uninstall
        upgrade:
          on_failure: rollback
      values:
        deployment:
          readinessDelaySeconds: 60
        hooks:
          enabled: false

    demo-install-fail:
      metadata:
        component: demo
      chart: "."
      name: demo-install-fail
      namespace: demo-install-fail
      release:
        wait:
          strategy: legacy
        install:
          on_failure: uninstall
      values:
        hooks:
          fail: true

    demo-upgrade-fail:
      metadata:
        component: demo
      dependencies:
        components:
          - name: demo
      chart: "."
      # Intentionally targets the already-installed demo release.
      name: demo
      namespace: demo
      release:
        upgrade:
          wait:
            strategy: legacy
          on_failure: rollback
          cleanup_on_failure: true
      values:
        hooks:
          fail: true
        extraConfigMap:
          enabled: true

    dag-foundation:
      metadata:
        component: demo
        tags: [lifecycle-dag]
      chart: "."
      name: dag-foundation
      namespace: lifecycle-dag
      release:
        wait:
          strategy: legacy
      values:
        deployment:
          readinessDelaySeconds: 3

    dag-dependent:
      metadata:
        component: demo
        tags: [lifecycle-dag]
      dependencies:
        components:
          - name: dag-foundation
      chart: "."
      name: dag-dependent
      namespace: lifecycle-dag
      release:
        wait:
          strategy: legacy
      values:
        hooks:
          requiredDeployment: dag-foundation
          # The lifecycle DAG integration test explicitly opts into a live
          # cluster lookup; ordinary offline chart rendering leaves this off.
          validateDependency: true
