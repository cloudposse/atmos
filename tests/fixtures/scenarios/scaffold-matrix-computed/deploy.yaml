# atmos:template
# Auto-generated deployment manifest for the "{{ .matrix.environment }}"
# environment in the "{{ .matrix.region }}" region.
#
# One copy of this file is generated per environment/region pairing that the
# deploy_topology preset actually declares -- both axes are *computed* via
# the collectKeys template function, not sourced from a flat multiselect
# answer. See scaffold.yaml's `matrix` entry for deploy.yaml.
vars:
  environment: "{{ .matrix.environment }}"
  region: "{{ .matrix.region }}"
