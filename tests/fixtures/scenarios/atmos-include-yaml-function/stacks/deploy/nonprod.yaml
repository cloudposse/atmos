# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json

# The `config` folder is relative to the `base_path` setting in `atmos.yaml`
import: !include config/import.yaml

# Download the remote file using `go-getter` and assign the `components.terraform.component-1.settings` section
# from the file to the `settings` section` in the current stack.
#
# This is a github.com blob URL (not a literal raw.githubusercontent.com URL) so that
# github.ConvertToRawURL (pkg/github/client.go, invoked by pkg/utils/yaml_include_by_extension.go's
# processRemoteFile) routes it through pkg/github.Endpoints.RawURL. By default (GITHUB_SERVER_URL
# unset) that resolves to the exact same raw.githubusercontent.com URL as before -- byte-identical
# behavior. When GITHUB_SERVER_URL/GITHUB_API_URL point at a mock (see
# tests/test-cases/atmos-include-yaml-function.yaml), it resolves to the mock's GHES-shape
# /raw/<owner>/<repo>/<ref>/<path> route instead, so this fixture never depends on live GitHub.
settings: !include https://github.com/cloudposse/atmos/blob/main/tests/fixtures/scenarios/stack-templates-2/stacks/deploy/nonprod.yaml .components.terraform.component-1.settings

components:
  terraform:
    component-1:
      metadata:
        component: yaml-functions
      vars:
        # The `config` folder is relative to the `base_path` setting in `atmos.yaml`
        string_var: !include config/vars.json .string_var
        boolean_var: !include config/vars.yaml .boolean_var
        list_var: !include config/vars.tfvars .list_var
        map_var: !include config/vars.tfvars .map_var

    component-2:
      metadata:
        component: yaml-functions
      vars: !include config/vars.tfvars

    component-3:
      metadata:
        component: yaml-functions
      vars: !include config/vars.json

    component-4:
      metadata:
        component: yaml-functions
      vars: !include config/vars.yaml
