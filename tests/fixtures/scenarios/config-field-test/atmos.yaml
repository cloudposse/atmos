base_path: "./"

components:
  terraform:
    base_path: "components/terraform"
    apply_auto_approve: false
    deploy_run_init: true
    init_run_reconfigure: true
    auto_generate_backend_file: false

stacks:
  base_path: "stacks"
  included_paths:
    - "deploy/**/*"
  name_template: "{{.vars.stage}}"

# Intentionally left at Info here; atmos.d/extra.yaml overrides this to Debug
# so field-testing `atmos config get logs.level` can confirm whether it reads
# the merged (Debug) or the root-file-only (Info) value.
logs:
  file: "/dev/stderr"
  level: Info

# Empty auth configuration (no identities configured).
# This allows commands to run without authentication.
auth:
