vars:
  stage: test

# S3 backend on the Floci emulator. The service component has no
# .tfmigrate.hcl, so Atmos generates a default tfmigrate config that reuses
# this backend (bucket + endpoints.s3) for history storage.
terraform:
  backend_type: s3
  backend:
    s3:
      bucket: !env ATMOS_TEST_TFMIGRATE_BUCKET
      key: "svc/terraform.tfstate"
      region: "us-east-1"
      endpoints:
        s3: !env AWS_ENDPOINT_URL
      use_path_style: true
      skip_credentials_validation: true
      skip_requesting_account_id: true
      skip_metadata_api_check: true
      skip_region_validation: true
      skip_s3_checksum: true

components:
  # Manual-testing convenience: `atmos emulator up aws -s test` brings up a
  # long-lived Floci AWS container for hand-driving the CLI (as opposed to
  # the Go test in tests/terraform_floci_tfmigrate_test.go, which starts its
  # own via testcontainers). Not used by the automated test.
  emulator:
    aws:
      driver: floci/aws
      region: us-east-1

  terraform:
    service-legacy:
      dependencies:
        tools:
          opentofu: "^1.10.0"
      vars:
        environment: test

    service:
      dependencies:
        tools:
          opentofu: "^1.10.0"
          tfmigrate: "^0.4.5"
      vars:
        environment: test
      hooks:
        state-migration:
          events:
            - before.terraform.plan
            - before.terraform.apply
          kind: tfmigrate
          mode: dynamic
