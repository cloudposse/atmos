base_path: "./"

components:
  terraform:
    # Dogfood OpenTofu via the Atmos toolchain instead of hashicorp/setup-terraform.
    # The component declares `dependencies.tools.opentofu`, which Atmos resolves,
    # installs, and puts on PATH automatically before `atmos terraform plan/apply`.
    command: tofu
    base_path: "components/terraform"
    apply_auto_approve: false
    deploy_run_init: true
    init_run_reconfigure: true
    auto_generate_backend_file: false

    # Planfile storage via the GitHub Actions Artifacts backend.
    #
    # The priority list below selects the named "github" store for the upload hook
    # (fired by `--ci`), which uploads with prefix "planfile" to the current
    # repository (GITHUB_REPOSITORY, so no hard-coded owner/repo). `planfile
    # download --store=github` resolves the identical artifact name for the
    # round-trip.
    planfiles:
      priority:
        - "github"
      stores:
        github:
          type: github/artifacts
          options:
            prefix: planfile
            retention_days: 1

stacks:
  base_path: "stacks"
  included_paths:
    - "deploy/**/*"
  name_template: "{{.vars.stage}}"

settings:
  experimental: silence

logs:
  file: "/dev/stderr"
  level: Info

# Empty auth configuration (no identities configured).
auth:

ci:
  enabled: true
  # Keep the E2E focused on planfile storage. Check runs and PR comments need
  # statuses/pull-requests write scope this workflow does not grant, so disable
  # them to avoid noisy (harmless) 403 warnings.
  checks:
    enabled: false
  comments:
    enabled: false
