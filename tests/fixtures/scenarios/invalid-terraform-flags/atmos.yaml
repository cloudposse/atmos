# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json

# Minimal fixture for a component's `flags:` block containing an unrecognized key
# (a typo, e.g. `lock_timout` instead of `lock_timeout`). Used to regression-test that
# this fails loudly at terraform argv-build time instead of silently being ignored.
# See docs/fixes/ for the field-test finding this fixture guards against.
base_path: "./"

components:
  terraform:
    base_path: "components/terraform"

stacks:
  base_path: "stacks"
  included_paths:
    - "deploy/**/*"
  name_pattern: "{stage}"

logs:
  level: Info
