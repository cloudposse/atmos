# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json

vars:
  stage: dev

components:
  terraform:
    # Inherits the global default settings.provision.workdir.enabled: true
    # (no component-level provision block).
    vpc-global:
      metadata:
        component: vpc
      vars:
        vpc_name: "global-default-vpc"

    # Explicitly opts OUT, overriding the global default.
    vpc-opt-out:
      metadata:
        component: vpc
      provision:
        workdir:
          enabled: false
      vars:
        vpc_name: "opt-out-vpc"
