tests:
  - name: "!include function test"
    enabled: true
    tty: false
    clean: true
    description: "Ensure the !include function works with scalars, lists and objects."
    workdir: "fixtures/scenarios/atmos-include-yaml-function/"
    command: "atmos"
    args:
      - "describe"
      - "component"
      - "component-1"
      - "-s"
      - "nonprod"
    expect:
      valid:
        - "yaml"
      exit_code: 0
      stdout:
        - "string_var: abc"
        - "boolean_var: true"
      stderr:
        - "Telemetry Enabled"

  # Additional coverage alongside the live case above -- same assertions, but targeting a
  # sibling fixture's !include, whose URL is templated (Go `{{ env "ATMOS_TEST_GITHUB_MOCK_URL" }}`)
  # to the process-wide httpmock GitHub facade TestMain starts, instead of live GitHub. GITHUB_
  # SERVER_URL/GITHUB_API_URL below are expanded against the process environment by
  # expandTestCaseEnv (tests/cli_test.go), and must point at the same facade URL: pkg/github.
  # ConvertToRawURL always resolves an explicit "github.com" URL against public github.com (see
  # pkg/github/client.go) regardless of GITHUB_SERVER_URL, so this sibling fixture's !include
  # deliberately does NOT use a literal "github.com" URL like the case above does -- it targets
  # GITHUB_SERVER_URL's own configured host instead, which only the facade's dynamic URL can
  # provide. The case above still exercises the literal raw.githubusercontent.com URL form
  # against live GitHub, unchanged.
  #
  # This is a SEPARATE fixture directory, not stacks/deploy/nonprod-mock.yaml.tmpl alongside the
  # live case: atmos's name_template-based stack resolution parses every manifest matched by
  # included_paths whenever ANY stack in a fixture is resolved, not just the one requested via
  # -s (verified: `atmos describe component component-6 -s extended` in the live fixture also
  # touches nonprod.yaml's live !include). Co-locating the two would force the live fetch on
  # every resolution regardless of which stack was asked for, defeating the mock. See
  # atmos-include-yaml-function-mock/stacks/deploy/nonprod-mock.yaml.tmpl's own comment.
  - name: "!include function test (mock GitHub)"
    enabled: true
    tty: false
    clean: true
    description: "Ensure the !include function works against a mocked GitHub Enterprise Server-shape raw fetch."
    workdir: "fixtures/scenarios/atmos-include-yaml-function-mock/"
    command: "atmos"
    env:
      GITHUB_SERVER_URL: "${ATMOS_TEST_GITHUB_MOCK_URL}"
      GITHUB_API_URL: "${ATMOS_TEST_GITHUB_MOCK_URL}/api/v3"
    args:
      - "describe"
      - "component"
      - "component-1"
      - "-s"
      - "nonprod-mock"
    expect:
      valid:
        - "yaml"
      exit_code: 0
      stdout:
        - "string_var: abc"
        - "boolean_var: true"
      stderr:
        - "Telemetry Enabled"
