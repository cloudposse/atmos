tests:
  - name: "!include function test"
    enabled: true
    tty: false
    clean: true
    description: "Ensure the !include function works with scalars, lists and objects."
    workdir: "fixtures/scenarios/atmos-include-yaml-function/"
    command: "atmos"
    # Route the fixture's remote !include (a github.com blob URL) at the process-wide httpmock
    # GitHub facade TestMain starts (ATMOS_TEST_GITHUB_MOCK_URL), instead of live GitHub. Values
    # are expanded against the process environment by expandTestCaseEnv (tests/cli_test.go).
    env:
      GITHUB_SERVER_URL: "${ATMOS_TEST_GITHUB_MOCK_URL}"
      GITHUB_API_URL: "${ATMOS_TEST_GITHUB_MOCK_URL}/api/v3"
    args:
      - "describe"
      - "component"
      - "component-1"
      - "-s"
      - "nonprod"
    expect:
      valid:
        - "yaml"
      exit_code: 0
      stdout:
        - "string_var: abc"
        - "boolean_var: true"
      stderr:
        - "Telemetry Enabled"
