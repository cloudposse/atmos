tests:
  - name: "!include function test"
    enabled: true
    tty: false
    clean: true
    description: "Ensure the !include function works with scalars, lists and objects."
    workdir: "fixtures/scenarios/atmos-include-yaml-function/"
    command: "atmos"
    args:
      - "describe"
      - "component"
      - "component-1"
      - "-s"
      - "nonprod"
    expect:
      valid:
        - "yaml"
      exit_code: 0
      stdout:
        - "string_var: abc"
        - "boolean_var: true"
      stderr:
        - "Telemetry Enabled"

  # Exercise remote !include through the process-wide GitHub facade. Keep this in a
  # separate fixture: stack discovery evaluates every matched manifest, and the
  # local include tests must not require the mock-specific endpoint environment.
  # Explicit github.com URLs always resolve to public GitHub, so the mock fixture
  # templates its URL with the facade host and opts into the GHES endpoint settings.
  - name: "!include function test (mock GitHub)"
    enabled: true
    tty: false
    clean: true
    description: "Ensure the !include function works against a mocked GitHub Enterprise Server-shape raw fetch."
    workdir: "fixtures/scenarios/atmos-include-yaml-function-mock/"
    command: "atmos"
    env:
      GITHUB_SERVER_URL: "${ATMOS_TEST_GITHUB_MOCK_URL}"
      GITHUB_API_URL: "${ATMOS_TEST_GITHUB_MOCK_URL}/api/v3"
    args:
      - "describe"
      - "component"
      - "component-1"
      - "-s"
      - "nonprod-mock"
    expect:
      valid:
        - "yaml"
      exit_code: 0
      stdout:
        - "string_var: abc"
        - "boolean_var: true"
      stderr:
        - "Telemetry Enabled"
