tests:
  # Use the local GitHub server for CLI coverage; in-process include tests also cover
  # the literal raw.githubusercontent.com URL, and live_github canaries cover the network.
  - name: "!include function test"
    enabled: true
    tty: false
    clean: true
    description: "Ensure the !include function works with scalars, lists and objects."
    workdir: "fixtures/scenarios/atmos-include-yaml-function-mock/"
    command: "atmos"
    env:
      GITHUB_SERVER_URL: "${ATMOS_TEST_GITHUB_MOCK_URL}"
      GITHUB_API_URL: "${ATMOS_TEST_GITHUB_MOCK_URL}/api/v3"
    args:
      - "describe"
      - "component"
      - "component-1"
      - "-s"
      - "nonprod-mock"
    expect:
      valid:
        - "yaml"
      exit_code: 0
      stdout:
        - "string_var: abc"
        - "boolean_var: true"
      stderr:
        - "Telemetry Enabled"
