# yaml-language-server: $schema=schema.json
# Tests for the scaffolding example in examples/scaffolding/.
# These tests verify the example's `atmos scaffold generate` flow, and in
# particular the `spec.files[].matrix` dynamic file generation feature it
# demonstrates via three different axis-value sources: a list-shaped
# multiselect answer (environment.yaml), a computed multi-axis expression
# using collectKeys (deploy.yaml), and a free-text answer split via Sprig's
# splitList (region.yaml). See examples/scaffolding/README.md.
tests:
  # Setting every matrix-driving answer exercises all three axis sources at
  # once: environments (list-shaped) generates stacks/dev.yaml and
  # stacks/staging.yaml; extra_regions_csv (free-text) generates
  # regions/us-east-1.yaml and regions/eu-central-1.yaml; deploy_topology (an
  # always-on computed preset, not gated by any answer) generates one
  # deploy/<env>/<region>.yaml per environment/region pairing it declares,
  # pruned by `when:` to each environment's actual regions.
  # `clean: true` requires every file under this workdir (examples/scaffolding)
  # to be committed -- it removes *any* untracked file here via git status, not
  # just this test's own `generated/` output, so a new template file added
  # alongside a matrix entry (e.g. deploy.yaml, region.yaml) must be `git add`ed
  # before this test can pass locally.
  #
  # Known local-dev-only gap (does not affect CI, which always starts from a
  # fresh checkout): `clean: true` can't actually remove a previous run's
  # generated/*/.atmos/scaffold.yaml project record, because the repo's root
  # .gitignore has `**/.atmos`, so git status never reports it as untracked in
  # the first place. If a *second* local run then reuses the same target, the
  # generate command reads that leftover record back and fails a manifest
  # schema round-trip check -- a pre-existing bug in how a field's `when:`
  # (re-)serializes, unrelated to matrix. `--force` alone does not avoid this,
  # since it only governs overwriting files, not whether the previous record
  # is loaded. Run `rm -rf ../examples/scaffolding/generated` before re-running
  # this test locally more than once.
  - name: "scaffolding example generate with matrix answers set"
    enabled: true
    tty: false
    clean: true
    description: "Generate the example scaffold template with environments and extra_regions_csv set, verifying all three matrix axis sources"
    workdir: "../examples/scaffolding"
    command: "atmos"
    args:
      - "scaffold"
      - "generate"
      - "example"
      - "generated/with-answers"
      - "--defaults"
      - "--force"
      - "--set"
      - "project_name=my-app"
      - "--set"
      - "environments=dev,staging"
      - "--set"
      - "extra_regions_csv=us-east-1,eu-central-1"
    env:
      ATMOS_EXPERIMENTAL: "silence"
    expect:
      exit_code: 0
      stderr:
        - "Generated"
      file_exists:
        - "generated/with-answers/stacks/dev.yaml"
        - "generated/with-answers/stacks/staging.yaml"
        - "generated/with-answers/regions/us-east-1.yaml"
        - "generated/with-answers/regions/eu-central-1.yaml"
        - "generated/with-answers/deploy/dev/us-east-1.yaml"
        - "generated/with-answers/deploy/staging/us-east-1.yaml"
        - "generated/with-answers/deploy/production/us-east-1.yaml"
        - "generated/with-answers/deploy/production/us-west-2.yaml"
      file_not_exists:
        # dev and staging only declare us-east-1 in the deploy_topology
        # preset, so `when:` prunes their us-west-2 combination.
        - "generated/with-answers/deploy/dev/us-west-2.yaml"
        - "generated/with-answers/deploy/staging/us-west-2.yaml"
      file_contains:
        "generated/with-answers/stacks/dev.yaml":
          - 'environment: "dev"'
        "generated/with-answers/regions/eu-central-1.yaml":
          - 'region: "eu-central-1"'
        "generated/with-answers/deploy/production/us-west-2.yaml":
          - 'environment: "production"'
          - 'region: "us-west-2"'

  # Leaving environments and extra_regions_csv at their defaults (unselected
  # / blank) resolves both axes to zero values -- matrix mirrors `when:`'s
  # existing silent-skip semantics rather than erroring, and generates none
  # of environment.yaml's or region.yaml's files. deploy.yaml is unaffected,
  # since its axes come from an always-on preset, not these answers.
  - name: "scaffolding example generate with defaults generates no optional matrix files"
    enabled: true
    tty: false
    clean: true
    description: "Generate the example scaffold template with no environments/extra_regions_csv, verifying the matrix-driven files are skipped"
    workdir: "../examples/scaffolding"
    command: "atmos"
    args:
      - "scaffold"
      - "generate"
      - "example"
      - "generated/defaults-only"
      - "--defaults"
      - "--force"
      - "--set"
      - "project_name=my-app"
    env:
      ATMOS_EXPERIMENTAL: "silence"
    expect:
      exit_code: 0
      stderr:
        - "Generated"
      file_exists:
        - "generated/defaults-only/deploy/dev/us-east-1.yaml"
        - "generated/defaults-only/deploy/production/us-west-2.yaml"
      file_not_exists:
        - "generated/defaults-only/stacks/dev.yaml"
        - "generated/defaults-only/regions/us-east-1.yaml"
