# yaml-language-server: $schema=schema.json
tests:
  # Test: Validate stacks
  - name: secrets-masking validate stacks
    enabled: true
    snapshot: false
    description: "Validate stack configuration for secrets-masking example"
    workdir: "../examples/secrets-masking"
    command: "atmos"
    args:
      - "validate"
      - "stacks"
    expect:
      exit_code: 0
      stdout: []
      stderr: []

  # Test: Describe stacks (snapshot)
  - name: secrets-masking describe stacks
    enabled: true
    snapshot: true
    description: "Describe all stacks in secrets-masking example"
    workdir: "../examples/secrets-masking"
    command: "atmos"
    args:
      - "describe"
      - "stacks"
      - "--format"
      - "json"
    expect:
      exit_code: 0
      valid:
        - "json"
      stdout:
        - '"custom_token": "\[REDACTED\]"'
        - '"demo_api_key": "\[REDACTED\]"'
        - '"internal_id": "\[REDACTED\]"'
        - '"literal_secret": "\[REDACTED\]"'
        - '"plain_value": "this-is-not-a-secret"'
      diff: []

  # Test: Describe config shows mask settings
  - name: secrets-masking describe config
    enabled: true
    snapshot: true
    description: "Verify mask settings are loaded in configuration"
    workdir: "../examples/secrets-masking"
    command: "atmos"
    env:
      ATMOS_PAGER: "false"
    args:
      - "describe"
      - "config"
      - "-f"
      - "json"
    expect:
      exit_code: 0
      valid:
        - "json"
      stdout:
        # Verify mask is enabled
        - '"enabled": true'
        # Verify custom replacement string
        - 'REDACTED'
        # Verify custom patterns are loaded
        - 'demo-key-'
        - 'internal-'
        - 'tkn_'
        # Configured literals must be redacted even when describing the config.
        - '(?s)"literals":\s*\[\s*"\[REDACTED\]",\s*"\[REDACTED\]"'
      diff:
        - "GithubToken"
        - "experimental"
      sanitize:
        # Normalize realm hash which varies by environment (derived from config path)
        '"realm": "[a-f0-9]+"': '"realm": "<hash>"'

  - name: secrets-masking describe stacks with masking disabled
    enabled: true
    snapshot: false
    description: "An explicit --mask=false exposes the original configured values"
    workdir: "../examples/secrets-masking"
    command: "atmos"
    args: ["describe", "stacks", "--format", "json", "--mask=false"]
    expect:
      exit_code: 0
      valid: ["json"]
      stdout:
        - '"custom_token": "tkn_live_abcdefghijklmnopqrstuvwx"'
        - '"demo_api_key": "demo-key-ABCD1234EFGH5678"'
        - '"internal_id": "internal-0123456789abcdef0123456789abcdef"'
        - '"literal_secret": "super-secret-demo-value"'

  - name: secrets-masking describe config with masking disabled
    enabled: true
    snapshot: false
    description: "An explicit --mask=false exposes the configured literal list"
    workdir: "../examples/secrets-masking"
    command: "atmos"
    env:
      ATMOS_PAGER: "false"
    args: ["describe", "config", "-f", "json", "--mask=false"]
    expect:
      exit_code: 0
      valid: ["json"]
      stdout:
        - 'super-secret-demo-value'
        - 'my-api-key-12345'

  # Test: Terraform plan (mock component)
  - name: secrets-masking terraform plan
    enabled: true
    snapshot: false
    preconditions: ["tofu"]
    description: "Run terraform plan for secrets-demo component"
    workdir: "../examples/secrets-masking"
    command: "atmos"
    args:
      - "terraform"
      - "plan"
      - "secrets-demo"
      - "-s"
      - "demo-dev-test"
    expect:
      exit_code: 0
      stdout:
        - "Plan:"
