# yaml-language-server: $schema=schema.json
tests:
  - name: "atmos docs generate native terraform template"
    enabled: true
    snapshot: false
    description: "Render the recovered component README design using native Terraform objects"
    workdir: "fixtures/scenarios/docs-generate/native-terraform/"
    command: "atmos"
    args:
      - "docs"
      - "generate"
      - "readme"
    expect:
      exit_code: 0
      file_exists:
        - "README.md"
      file_contains:
        "README.md":
          - "# Native Terraform README"
          - "## Version Requirements"
          - "## Providers"
          - "## Modules"
          - "## Resources"
          - "## Data Sources"
          - "## Outputs"
          - "## Required Variables"
          - "## Optional Variables"
          - "## Context Variables"
          - "<summary>Click to expand</summary>"
          - "<dt>Default value</dt>"
          - "OBSOLETE-f44336"

  - name: "atmos docs generate context-only groups"
    enabled: true
    snapshot: false
    description: "Optional context inputs do not create empty non-context groups"
    workdir: "fixtures/scenarios/docs-generate/native-layout/"
    command: "atmos"
    args: ["docs", "generate", "context-only"]
    expect:
      exit_code: 0
      file_contains:
        "context.generated.md":
          - "## Context Variables"
          - "### `name`"
          - !not "## Required Variables"
          - !not "## Optional Variables"

  - name: "atmos docs generate data-only groups"
    enabled: true
    snapshot: false
    description: "Data sources do not create empty managed-resource or variable groups"
    workdir: "fixtures/scenarios/docs-generate/native-layout/"
    command: "atmos"
    args: ["docs", "generate", "data-only"]
    expect:
      exit_code: 0
      file_contains:
        "data.generated.md":
          - "## Data Sources"
          - "aws_caller_identity.current"
          - !not "## Resources"
          - !not "## Required Variables"
          - !not "## Context Variables"

  - name: "atmos docs generate respects formatting settings"
    enabled: true
    snapshot: false
    description: "Formatting hides legacy sections while preserving all native objects"
    workdir: "fixtures/scenarios/docs-generate/formatted-settings/"
    command: "atmos"
    args: ["docs", "generate", "formatting"]
    expect:
      exit_code: 0
      file_contains:
        "README.md":
          - "#### Requirements"
          - "Native inputs: 7"
          - "Native outputs: 2"
          - "Native providers: 1"
          - !not "#### Inputs"
          - !not "#### Outputs"
          - !not "#### Providers"

  - name: "atmos docs generate for terraform docs"
    enabled: true
    snapshot: false
    description: "Ensure terraform docs are generated"
    workdir: "fixtures/scenarios/docs-generate/terraform/"
    command: "atmos"
    args:
      - "docs"
      - "generate"
      - "readme"
    expect:
      diff: []
      exit_code: 0
      stdout:
        - "^$"
      file_exists:
        - "README.md"
      file_contains:
        "README.md":
          - "## Requirements"
          - "## Providers"

  - name: "atmos docs generate input variants"
    enabled: true
    snapshot: false
    description: "Ensure all 3 input types are supported"
    workdir: "fixtures/scenarios/docs-generate/input-variants/"
    env:
      ATMOS_TEST_README_URL: "${ATMOS_TEST_GITHUB_MOCK_URL}/raw/cloudposse/atmos/main/README.yaml"
      GITHUB_SERVER_URL: "${ATMOS_TEST_GITHUB_MOCK_URL}"
      GITHUB_API_URL: "${ATMOS_TEST_GITHUB_MOCK_URL}/api/v3"
    command: "atmos"
    args:
      - "docs"
      - "generate"
      - "readme"
    expect:
      diff: []
      exit_code: 0
      stdout:
        - "^$"
      file_exists:
        - "README.md"
      file_contains:
        "README.md":
          - "##name:## inline map"
          - "##Description:## inline override: description"
          - "Note: Local extra info"
          - "##Github_repo:## Inline override: testing inline merge"
          - "##License:## APACHE2"
          - "##Categories:## \\[.+\\]"

  - name: "atmos docs generate readme with UI output"
    enabled: true
    snapshot: true
    description: "Verify docs generate shows checkmark on success"
    workdir: "fixtures/scenarios/docs-generate/terraform/"
    command: "atmos"
    args:
      - "docs"
      - "generate"
      - "readme"
    expect:
      exit_code: 0
      stderr:
        - "✓ Generated docs"
      file_exists:
        - "README.md"
