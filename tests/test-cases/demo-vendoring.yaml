# yaml-language-server: $schema=schema.json

tests:
  - name: atmos vendor pull
    short: false
    enabled: true
    snapshot: false
    clean: true
    tty: true
    description: "Vendoring works with pull command"
    workdir: "../examples/demo-vendoring/"
    command: "atmos"
    args:
      - "vendor"
      - "pull"
    skip:
      # PTY not supported on windows
      os: !not windows
    expect:
      timeout: "5m"
      tty:
        - "Pulling"
        - "github/stargazers"
        - "weather"
        - "Vendored 3 packages, 0 unchanged, 0 failed, 0 canceled"
        - "Vendoring from.*vendor\\.yaml"
        - !not 'No TTY detected\. Falling back to basic output\.'
      exit_code: 0

  - name: atmos vendor pull no tty
    short: false
    enabled: true
    snapshot: false # We can't use snapshots because temp paths will always be different
    tty: false
    clean: true
    description: "Vendoring works with pull command"
    workdir: "../examples/demo-vendoring/"
    command: "atmos"
    args:
      - "vendor"
      - "pull"
    env:
      ATMOS_LOGS_LEVEL: Debug
    expect:
      timeout: "5m"
      diff: []
      stderr:
        - "Pulling vendored components"
        - "✓ github/stargazers \\(main\\)"
        - "✓ weather \\(main\\)"
        - "✓ ipinfo \\(main\\)"
        - "Vendored 3 packages, 0 unchanged, 0 failed, 0 canceled"
        # Plain output must not contain cursor movement or ANSI style sequences.
        - !not '\x1b\['
      exit_code: 0
