tests:
  - name: check atmos version in empty-dir
    enabled: true
    snapshot: false
    description: "Check that atmos version command outputs version details."
    workdir: "fixtures/scenarios/empty-dir"
    command: "atmos"
    args:
      - "version"
    expect:
      stdout:
        - '👽 Atmos (\d+\.\d+\.\d+|test) on [a-z]+/[a-z0-9]+'
      stderr:
        - "Telemetry Enabled"
      exit_code: 0

  - name: check atmos --version in empty-dir
    enabled: true
    snapshot: false
    description: "Check that atmos --version flag produces same output as version command."
    workdir: "fixtures/scenarios/empty-dir"
    command: "atmos"
    args:
      - "--version"
    expect:
      stdout:
        - '👽 Atmos (\d+\.\d+\.\d+|test) on [a-z]+/[a-z0-9]+'
      # stderr may be empty or contain GitHub API rate limit warnings
      exit_code: 0

  - name: atmos support
    enabled: true
    snapshot: true
    description: "Check that atmos support command outputs support details."
    workdir: "fixtures/scenarios/empty-dir"
    command: "atmos"
    args:
      - "support"
    expect:
      exit_code: 0

  - name: check atmos in empty-dir
    enabled: true
    snapshot: true
    description: "Check that atmos command outputs helpful information to get started"
    workdir: "fixtures/scenarios/empty-dir"
    command: "atmos"
    env:
      ATMOS_VERSION_CHECK_ENABLED: "false"
      # Set explicit config path to prevent parent directory search
      ATMOS_CLI_CONFIG_PATH: "."
    args: []
    expect:
      ignore_trailing_whitespace: true
      sanitize:
        "(darwin|linux|windows)/(arm64|amd64|386)": "linux/amd64"
      diff: []
      stdout:
        - "USAGE"
        - "BUILT-IN COMMANDS"
      stderr:
        - !not "Incorrect Usage|atmos.yaml CLI config file was not found"
        - "Telemetry Enabled"
      exit_code: 0

  - name: check atmos --help in empty-dir
    enabled: true
    # Snapshots are temporarily disabled until PR #957 is merged which cleans workdirs
    # of files which are not part of the git repo
    snapshot: false
    description: "Check that atmos command outputs help even with no configuration"
    workdir: "fixtures/scenarios/empty-dir"
    command: "atmos"
    args: [--help]
    expect:
      diff: []
      exit_code: 0
