  - name: cloudformation defaults env-region from !env
    enabled: true
    snapshot: false
    description: "A region set through the !env function resolves from the environment."
    workdir: "fixtures/scenarios/cloudformation-defaults"
    command: "atmos"
    args: ["describe", "component", "env-region", "-s", "imported", "--format", "yaml"]
    env:
      ATMOS_FIELD_TEST_REGION: "env-region"
    expect:
      stdout:
        - "(?m)^region: env-region"
      exit_code: 0
  - name: cloudformation defaults do not leak into terraform components
    enabled: true
    snapshot: false
    description: "A stack-root region applies only to CloudFormation components."
    workdir: "fixtures/scenarios/cloudformation-defaults"
    command: "atmos"
    args: ["describe", "component", "tf-reader", "-s", "precedence", "--format", "yaml"]
    expect:
      stdout:
        - "(?m)^vars:"
        - "(?m)^\\s+region_from_settings: none"
        - not: "(?m)^region:"
        - not: "(?m)^timeout:"
      exit_code: 0
