# yaml-language-server: $schema=schema.json
# CloudFormation `region` and `timeout` defaults resolve through every inheritance scope
# (stack root, `aws/cloudformation` type defaults, abstract base, component, overrides),
# the deprecated `settings.aws_cloudformation.region` / `timeout_in_minutes` aliases,
# imports, templating, and YAML functions. Each case asserts the effective value that
# `describe component` reports; no AWS call is made.
tests:
  - name: cloudformation defaults validate stacks
    enabled: true
    snapshot: false
    description: "Legacy spellings validate with deprecation warnings only."
    workdir: "fixtures/scenarios/cloudformation-defaults"
    command: "atmos"
    args: ["validate", "stacks"]
    expect:
      stderr:
        - "settings.aws_cloudformation.region is deprecated"
        - "timeout_in_minutes is deprecated"
        - "All stacks validated successfully"
      exit_code: 0
  - name: cloudformation defaults precedence inherits-type
    enabled: true
    snapshot: false
    description: "inherits-type in precedence resolves region type-region and timeout 45m."
    workdir: "fixtures/scenarios/cloudformation-defaults"
    command: "atmos"
    args: ["describe", "component", "inherits-type", "-s", "precedence", "--format", "yaml"]
    expect:
      stdout:
        - "(?m)^region: type-region"
        - "(?m)^timeout: 45m"
      exit_code: 0
  - name: cloudformation defaults precedence inherits-base
    enabled: true
    snapshot: false
    description: "inherits-base in precedence resolves region base-region and timeout 30m."
    workdir: "fixtures/scenarios/cloudformation-defaults"
    command: "atmos"
    args: ["describe", "component", "inherits-base", "-s", "precedence", "--format", "yaml"]
    expect:
      stdout:
        - "(?m)^region: base-region"
        - "(?m)^timeout: 30m"
      exit_code: 0
  - name: cloudformation defaults precedence own
    enabled: true
    snapshot: false
    description: "own in precedence resolves region own-region and timeout 90."
    workdir: "fixtures/scenarios/cloudformation-defaults"
    command: "atmos"
    args: ["describe", "component", "own", "-s", "precedence", "--format", "yaml"]
    expect:
      stdout:
        - "(?m)^region: own-region"
        - "(?m)^timeout: 90"
      exit_code: 0
  - name: cloudformation defaults precedence overridden
    enabled: true
    snapshot: false
    description: "overridden in precedence resolves region override-region and timeout 20m."
    workdir: "fixtures/scenarios/cloudformation-defaults"
    command: "atmos"
    args: ["describe", "component", "overridden", "-s", "precedence", "--format", "yaml"]
    expect:
      stdout:
        - "(?m)^region: override-region"
        - "(?m)^timeout: 20m"
      exit_code: 0
  - name: cloudformation defaults precedence legacy-only
