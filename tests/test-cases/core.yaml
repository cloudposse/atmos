# yaml-language-server: $schema=schema.json

tests:
  - name: "test tty"
    enabled: true
    snapshot: false
    tty: true
    description: "Ensure tty is enabled."
    workdir: "../"
    command: "tty"
    skip:
      # PTY not supported on windows
      os: !not windows
    expect:
      stdout:
        - "^(/dev)"
      stderr:
        - "^$"
      exit_code: 0

  - name: "test non-tty"
    enabled: true
    snapshot: false
    tty: false
    description: "Ensure tty is disabled."
    workdir: "../"
    command: "tty"
    skip:
      # tty command not available on Windows
      os: !not windows
    expect:
      stdout:
        - "^not a tty"
      stderr:
        - "^$"
      exit_code: 1


  - name: "atmos"
    enabled: true
    snapshot: true
    description: "Verify atmos CLI displays help without requiring stacks."
    workdir: "../"
    command: "atmos"
    env:
      ATMOS_VERSION_CHECK_ENABLED: "false"
    expect:
      ignore_trailing_whitespace: true
      sanitize:
        "(darwin|linux|windows)/(arm64|amd64|386)": "linux/amd64"
      diff: []
      stdout:
        - "USAGE"
        - "BUILT-IN COMMANDS"
      stderr:
        - !not "Incorrect Usage|stacks, but the directory does not exist"
        - "Telemetry Enabled"
      exit_code: 0

  - name: atmos docs
    enabled: true
    snapshot: true
    description: "Ensure atmos docs command executes without errors."
    workdir: "../"
    command: "atmos"
    args:
      - "docs"
    expect:
      diff: []
      exit_code: 0
      stdout:
        - "^$"
      stderr:
        - "Opening default browser to 'https://atmos.tools'."
