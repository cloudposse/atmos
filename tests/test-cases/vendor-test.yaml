tests:
  - name: atmos vendor pull without configuration
    enabled: true
    description: ""
    workdir: "../"
    command: "atmos"
    args:
      - "vendor"
      - "pull"
    expect:
      stderr:
        - "# Error"
        - "\\*\\*Error:\\*\\* Vendoring is not configured"
      exit_code: 1

  - name: atmos_vendor_pull
    short: false
    enabled: true
    description: "Ensure atmos vendor pull command executes without errors and files are present."
    workdir: "fixtures/scenarios/vendor"
    clean: true
    command: "atmos"
    args:
      - "vendor"
      - "pull"
    # TEMPORARY: activates logVendorDiagDir (pkg/vendoring/install/atmos.go) to capture the
    # fetched-vs-copied directory listing around a Windows-only silent vendor-pull failure. Remove
    # once root-caused (see the function's doc comment).
    env:
      ATMOS_VENDOR_DEBUG_DIAG: "1"
    preconditions:
      - "github_token"
    expect:
      timeout: "5m"
      file_exists:
        - "./components/terraform/github/stargazers/main/main.tf"
        - "./components/terraform/github/stargazers/main/outputs.tf"
        - "./components/terraform/github/stargazers/main/providers.tf"
        - "./components/terraform/github/stargazers/main/variables.tf"
        - "./components/terraform/github/stargazers/main/versions.tf"
        - "./components/terraform/test-components/main/main.tf"
        - "./components/terraform/test-components/main/README.md"
        - "./components/terraform/weather/main/main.tf"
        - "./components/terraform/weather/main/outputs.tf"
        - "./components/terraform/weather/main/providers.tf"
        - "./components/terraform/weather/main/variables.tf"
        - "./components/terraform/weather/main/versions.tf"
        - "./components/terraform/myapp2/main.tf"
        - "./components/terraform/myapp2/README.md"
        # From ghcr.io/cloudposse/atmos/tests/fixtures/components/terraform/mock:v0
        - "./components/terraform/myapp1/main.tf"
        - "./components/terraform/myapp1/README.md"
      exit_code: 0

  - name: atmos_vendor_pull_oci
    short: false
    enabled: true
    description: "Ensure 'atmos vendor pull --tags' command executes without errors and files are present."
    workdir: "fixtures/scenarios/vendor"
    clean: true
    command: "atmos"
    args:
      - "vendor"
      - "pull"
      - "--tags=oci"
    preconditions:
      - "github_token"
    expect:
      timeout: "5m"
      file_exists:
        # From ghcr.io/cloudposse/atmos/tests/fixtures/components/terraform/mock:v0
        - "./components/terraform/myapp1/main.tf"
        - "./components/terraform/myapp1/README.md"
      exit_code: 0

  # Tests for simple filename exclusions (without **/ prefix) - regression test for bug fix
  - name: atmos_vendor_simple_exclude
    short: false
    enabled: true
    description: "Test simple filename exclusion - 'README.md' excludes README.md without needing '**/README.md'"
    workdir: "fixtures/scenarios/vendor-simple-excludes"
    command: "atmos"
    args:
      - "vendor"
      - "pull"
      - "--tags=simple"
    expect:
      file_exists:
        # main.tf should be included (matches **/* and not excluded)
        - "./components/terraform/simple-exclude/main.tf"
      file_not_exists:
        # README.md should be excluded by simple pattern "README.md"
        - "./components/terraform/simple-exclude/README.md"
      exit_code: 0

  - name: atmos_vendor_combined_exclude_include
    short: false
    enabled: true
    description: "Test combined include/exclude - include **/*.tf but exclude main.tf"
    workdir: "fixtures/scenarios/vendor-simple-excludes"
    command: "atmos"
    args:
      - "vendor"
      - "pull"
      - "--tags=combined"
    expect:
      file_not_exists:
        # main.tf should be excluded by simple pattern "main.tf"
        - "./components/terraform/combined/main.tf"
        # README.md should be excluded because it doesn't match **/*.tf include
        - "./components/terraform/combined/README.md"
      exit_code: 0

  # Regression test: --stack must actually resolve and vendor the stack's components. Guards
  # against InitCliConfig being called with processStacks=false on the --stack/--labels path,
  # which silently leaves atmosConfig.StackConfigFilesAbsolutePaths empty and makes every stack
  # look like "not found" regardless of whether it exists.
  - name: atmos_vendor_pull_stack
    short: false
    enabled: true
    description: "Ensure 'atmos vendor pull --stack' resolves and vendors the stack's components."
    workdir: "fixtures/scenarios/vendor-stack-labels"
    clean: true
    command: "atmos"
    args:
      - "vendor"
      - "pull"
      - "--stack=dev"
    expect:
      file_exists:
        - "./components/terraform/comp-a/main.tf"
        - "./components/terraform/comp-a/README.md"
        - "./components/terraform/comp-b/main.tf"
        - "./components/terraform/comp-b/README.md"
      exit_code: 0

  # Regression test: --labels must resolve via the same stack-processing path as --stack (see
  # atmos_vendor_pull_stack above) and must narrow to only the matching component (AND-match on
  # metadata.labels), not vendor every stack component.
  - name: atmos_vendor_pull_labels
    short: false
    enabled: true
    description: "Ensure 'atmos vendor pull --labels' resolves and vendors only the matching component."
    workdir: "fixtures/scenarios/vendor-stack-labels"
    clean: true
    command: "atmos"
    args:
      - "vendor"
      - "pull"
      - "--labels=tier=foundational"
    expect:
      file_exists:
        - "./components/terraform/comp-a/main.tf"
        - "./components/terraform/comp-a/README.md"
      file_not_exists:
        - "./components/terraform/comp-b/main.tf"
        - "./components/terraform/comp-b/README.md"
      exit_code: 0

  # Regression test: --stack and --labels must compose (labels narrow further within the stack),
  # not act as alternative/conflicting selectors, nor be silently ignored once --stack has already
  # resolved a candidate set. tier=foundational (see stacks/dev.yaml) is unique to comp-a --
  # comp-b is tier=edge -- so asserting comp-a vendors and comp-b does not proves --labels actually
  # narrows the --stack=dev result, not just that --stack alone would have selected comp-a anyway
  # (env=test, shared by both components, would pass this test even if --labels were ignored).
  - name: atmos_vendor_pull_stack_and_labels
    short: false
    enabled: true
    description: "Ensure 'atmos vendor pull --stack --labels' composes: --labels narrows within --stack's resolved set. tier=foundational is unique to comp-a (comp-b is tier=edge), so this proves --labels actually narrows -- env=test alone is shared by both components and wouldn't prove anything."
    workdir: "fixtures/scenarios/vendor-stack-labels"
    clean: true
    command: "atmos"
    args:
      - "vendor"
      - "pull"
      - "--stack=dev"
      - "--labels=tier=foundational"
    expect:
      file_exists:
        - "./components/terraform/comp-a/main.tf"
        - "./components/terraform/comp-a/README.md"
      file_not_exists:
        - "./components/terraform/comp-b/main.tf"
        - "./components/terraform/comp-b/README.md"
      exit_code: 0
