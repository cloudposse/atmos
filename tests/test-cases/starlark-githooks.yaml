# yaml-language-server: $schema=schema.json
# Git hooks defined with git.hooks.<name>.steps. None of these cases depends on the working
# directory: `atmos git hooks run` resolves the repository root, which for this fixture is the
# enclosing checkout, so cwd-sensitive checks (file size limits) are covered by unit tests in
# pkg/git/hooks and by a manual throwaway-repo run instead.
tests:
  - name: starlark githooks env step values reach later steps
    enabled: true
    snapshot: false
    description: type env step values reach shell children, Starlark exec.run children, templates, and declared env.
    workdir: "fixtures/scenarios/starlark-githooks/"
    command: atmos
    args: [git, hooks, run, env-share]
    expect:
      exit_code: 0
      stdout:
        - 'shell child: SHARED_VAR=from-env-step; template: from-env-step'
        - 'script child: SHARED_VAR=from-env-step'
        - 'declared env V = from-env-step'

  - name: starlark githooks mixed steps share env and outputs
    enabled: true
    snapshot: false
    workdir: "fixtures/scenarios/starlark-githooks/"
    command: atmos
    args: [git, hooks, run, mixed]
    expect:
      exit_code: 0
      stdout:
        - 'MIXED_VAR=from-env-step'
        - 'COMP = vpc'
      stderr:
        - !not 'Total for this invocation'

  - name: starlark githooks error names the hook for exclusive command and steps
    enabled: true
    snapshot: false
    workdir: "fixtures/scenarios/starlark-githooks/"
    command: atmos
    args: [git, hooks, run, broken-both]
    expect:
      exit_code: 1
      stderr:
        - 'git hook "broken-both"'
        - 'invalid configuration'

  - name: starlark githooks error names the hook for an unknown step type
    enabled: true
    snapshot: false
    workdir: "fixtures/scenarios/starlark-githooks/"
    command: atmos
    args: [git, hooks, run, broken-typo]
    expect:
      exit_code: 1
      stderr:
        - 'git hook "broken-typo"'
        - 'unknown step type: starlark'

  - name: starlark githooks error names the hook for duplicate step names
    enabled: true
    snapshot: false
    workdir: "fixtures/scenarios/starlark-githooks/"
    command: atmos
    args: [git, hooks, run, broken-dup]
    expect:
      exit_code: 1
      stderr:
        - 'git hook "broken-dup"'
        - 'duplicate step name'

  - name: starlark githooks step timeout is reported as a step timeout
    enabled: true
    snapshot: false
    workdir: "fixtures/scenarios/starlark-githooks/"
    command: atmos
    args: [git, hooks, run, timeout-shell]
    expect:
      exit_code: 1
      stderr:
        - 'git hook "timeout-shell"'
        - 'step timed out'
        - 'did not finish within its timeout of 1s'

  - name: starlark githooks run preserves the failing step exit code
    enabled: true
    snapshot: false
    workdir: "fixtures/scenarios/starlark-githooks/"
    command: atmos
    args: [git, hooks, run, broken-shell-fail]
    expect:
      exit_code: 7
      stdout:
        - 'before-fail'
      stderr:
        - 'git hook "broken-shell-fail"'

  - name: starlark githooks unknown hook lists the configured hooks
    enabled: true
    snapshot: false
    workdir: "fixtures/scenarios/starlark-githooks/"
    command: atmos
    args: [git, hooks, run, nonexistent]
    expect:
      exit_code: 2
      stderr:
        - 'git hook not configured'
        - 'Hook "nonexistent" is not configured'
        - 'Configured hooks:'

  - name: starlark githooks fail() in a script step fails the hook with exit code 1
    enabled: true
    snapshot: false
    description: A Starlark fail() stops the hook, names the hook, and exits 1
    workdir: "fixtures/scenarios/starlark-githooks/"
    command: atmos
    args: [git, hooks, run, script-fail]
    expect:
      exit_code: 1
      stdout:
        - 'before-script-fail'
      stderr:
        - 'git hook "script-fail"'
        - 'hook script failed'

  - name: starlark githooks errors.build with_exit_code propagates its exit code
    enabled: true
    snapshot: false
    description: errors.build(...).with_exit_code(5).fail() in a steps hook makes atmos exit 5, which Git reports as the hook failure
    workdir: "fixtures/scenarios/starlark-githooks/"
    command: atmos
    args: [git, hooks, run, script-exit-5]
    expect:
      exit_code: 5
      stdout:
        - 'before-custom-exit'
      stderr:
        - 'git hook "script-exit-5"'
        - 'custom exit code'

  - name: starlark githooks hook arguments reach shell steps
    enabled: true
    snapshot: false
    description: Arguments after the hook name are positional parameters of a shell step and are joined into ATMOS_GIT_HOOK_ARGS
    workdir: "fixtures/scenarios/starlark-githooks/"
    command: atmos
    args: [git, hooks, run, args-shell, COMMIT_EDITMSG, "second arg"]
    expect:
      exit_code: 0
      stdout:
        - 'count=2 first=\[COMMIT_EDITMSG\] second=\[second arg\] env=\[COMMIT_EDITMSG second arg\]'

  - name: starlark githooks prompt without a default explains how to run without a terminal
    enabled: true
    snapshot: false
    description: A prompt step with no default under a hook (no terminal) fails and the error names default as the fix
    workdir: "fixtures/scenarios/starlark-githooks/"
    command: atmos
    args: [git, hooks, run, prompt-yaml]
    expect:
      exit_code: 1
      stderr:
        - 'git hook "prompt-yaml"'
        - 'interactive terminal required for step'
        - 'Set default: on the step'

  - name: starlark githooks prompt with a default runs without a terminal
    enabled: true
    snapshot: false
    description: Negative path for the prompt case, the first step of prompt-test has a default and prints its value before the second fails
    workdir: "fixtures/scenarios/starlark-githooks/"
    command: atmos
    args: [git, hooks, run, prompt-test]
    expect:
      stdout:
        - 'input = dflt confirm = true'
      stderr:
        - 'interactive terminal required for step'
      exit_code: 1
