# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json

# The `local` stack declares the Floci emulator (catalog/emulator/aws) and one
# Terraform component, `greeting`, whose Terraform configuration is generated by a
# CDK Terrain app in a before-hook. Remove the emulator import and the `local-aws`
# identity in atmos.yaml to deploy to a real account.
import:
  - catalog/emulator/aws

name: local

components:
  terraform:
    greeting:
      metadata:
        terraform_workspace: default
      vars:
        region: us-east-1
        message: Hello from CDK Terrain and Atmos
      hooks:
        synth:
          events:
            - before.terraform.init
            - before.terraform.plan
            - before.terraform.apply
          kind: steps
          on_failure: fail
          with:
            - name: install
              type: shell
              command: npm ci --no-audit --no-fund
              inputs:
                sources: [package-lock.json]
              artifacts:
                paths: [node_modules/.bin/cdktn]
            - name: synth
              type: shell
              command: npm run synth
