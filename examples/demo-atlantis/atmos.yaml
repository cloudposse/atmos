# atmos.yaml CLI config
base_path: "./"

components:
  terraform:
    base_path: "components/terraform"
    deploy_run_init: true
    auto_generate_backend_file: false

stacks:
  base_path: "stacks"
  included_paths:
    - "deploy/**/*"
  excluded_paths:
    - "**/_defaults.yaml"
  name_template: "{{.vars.stage}}"
commands:
- name: "test"
  description: "Run all tests"
  steps:
  - atmos atlantis build-all

- name: "atlantis"
  commands:
  - name: "build-all"
    description: "Build all configurations for Atlantis"
    steps:
    - echo "Building Atlantis config..."
    - atmos atlantis generate repo-config --config-template config-1 --project-template project-1
    - echo "Generating varfiles..."
    - atmos terraform generate varfiles --format=json --file-template={component-path}/varfiles/{stage}-{component}.tfvars.json
    - echo "Generating backends..."
    - atmos terraform generate backends --format=backend-config --file-template={component-path}/backends/{stage}-{component}.backend


# Integrations
integrations:

  # Atlantis integration
  # https://www.runatlantis.io/docs/repo-level-atlantis-yaml.html
  atlantis:
    # Path and name of the Atlantis config file `atlantis.yaml`
    path: "atlantis.yaml"

    # Config templates
    # Select a template by using the `--config-template <config_template>` command-line argument in `atmos atlantis generate repo-config` command
    config_templates:
      config-1:
        version: 3
        automerge: true
        delete_source_branch_on_merge: true
        parallel_plan: true
        parallel_apply: true
        allowed_regexp_prefixes:
          - dev/
          - staging/
          - prod/

    # Project templates
    # Select a template by using the `--project-template <project_template>` command-line argument in `atmos atlantis generate repo-config` command
    project_templates:
      project-1:
        # generate a project entry for each component in every stack
        name: "{stage}-{component}"
        workspace: "{workspace}"
        dir: "{component-path}"
        workflow: workflow-1
        delete_source_branch_on_merge: true
        autoplan:
          enabled: true
          when_modified:
            - "**/*.tf"
            - "varfiles/{stage}-{component}.tfvars.json"
            - "backends/{stage}-{component}.backend"
            - "../../../stacks/deploy/demo.yaml"
        apply_requirements:
          - approved

    # Workflow templates
    # https://www.runatlantis.io/docs/custom-workflows.html#custom-init-plan-apply-commands
    # https://www.runatlantis.io/docs/custom-workflows.html#custom-run-command
    workflow_templates:
      workflow-1:
        plan:
          steps:
            - run: terraform init -input=false -backend-config="backends/$PROJECT_NAME.backend"
            - run: terraform workspace select "$WORKSPACE"
            - run: terraform plan -input=false -var-file="varfiles/$PROJECT_NAME.tfvars.json" -out="$PLANFILE"
        apply:
          steps:
            - run: terraform apply -input=false "$PLANFILE"
