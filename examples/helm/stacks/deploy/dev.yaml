vars:
  stage: dev

# Native Helm lifecycle defaults for every Helm component in this stack.
helm:
  release:
    wait:
      strategy: watcher
    # Leave enough headroom for nested k3s workloads on resource-constrained
    # macOS/Colima runners. Components that exercise timeout behavior override
    # this value explicitly below.
    timeout: 4m
    history:
      max: 10
    install:
      crds: skip

components:
  emulator:
    kubernetes:
      driver: k3s
      ephemeral: true

  helm:
    demo:
      metadata:
        component: demo
      # The chart reference. "." is the component directory itself
      # (components/helm/demo), which contains Chart.yaml.
      chart: "."
      namespace: demo
      release:
        wait:
          strategy: legacy
        install:
          on_failure: uninstall
        upgrade:
          on_failure: rollback
          cleanup_on_failure: true
      # Atmos `values:` are the Helm chart values, merged via Atmos inheritance.
      values:
        replicaCount: 2
        image:
          tag: "1.27"
        service:
          port: 8080
        tpl:
          source: from-stack
          expression: !literal "{{ .Values.tpl.source }}"

    demo-repo:
      metadata:
        component: demo
      repositories:
        - name: local
          url: !env HELM_DEMO_REPO_URL
      chart: local/demo
      version: 0.1.0
      namespace: demo-repo
      values:
        replicaCount: 2
        image:
          tag: "1.27"
        service:
          port: 8080

    demo-jobs:
      metadata:
        component: demo
      chart: "."
      name: demo-jobs
      namespace: demo-jobs
      release:
        wait:
          jobs: true
        # Helm's watcher can remain blocked after deleting a completed ordinary
        # Job even though the release resources are already gone. Keep watcher
        # coverage for install and use deterministic legacy cleanup here.
        delete:
          wait:
            strategy: legacy
      values:
        hooks:
          enabled: false
        job:
          enabled: true
          sleepSeconds: 3

    demo-no-hooks:
      metadata:
        component: demo
      chart: "."
      name: demo-no-hooks
      namespace: demo-no-hooks
      release:
        chart_hooks: false

    demo-hook-only:
      metadata:
        component: demo
      chart: "."
      name: demo-hook-only
      namespace: demo-hook-only
      release:
        wait:
          strategy: hookOnly
      values:
        deployment:
          readinessGate: true

    demo-timeout:
      metadata:
        component: demo
      chart: "."
      name: demo-timeout
      namespace: demo-timeout
      release:
        timeout: 2s
        wait:
          strategy: watcher
        install:
          on_failure: uninstall
        upgrade:
          on_failure: rollback
      values:
        deployment:
          readinessDelaySeconds: 20
        hooks:
          enabled: false

    demo-install-fail:
      metadata:
        component: demo
      chart: "."
      name: demo-install-fail
      namespace: demo-install-fail
      release:
        wait:
          strategy: legacy
        install:
          on_failure: uninstall
      values:
        hooks:
          fail: true

    demo-upgrade-fail:
      metadata:
        component: demo
      dependencies:
        components:
          - name: demo
      chart: "."
      # Intentionally targets the already-installed demo release.
      name: demo
      namespace: demo
      release:
        upgrade:
          wait:
            strategy: legacy
          on_failure: rollback
          cleanup_on_failure: true
      values:
        hooks:
          fail: true
        extraConfigMap:
          enabled: true

    dag-foundation:
      metadata:
        component: demo
        tags: [lifecycle-dag]
      chart: "."
      name: dag-foundation
      namespace: lifecycle-dag
      release:
        wait:
          strategy: legacy
      values:
        deployment:
          readinessDelaySeconds: 3

    dag-dependent:
      metadata:
        component: demo
        tags: [lifecycle-dag]
      dependencies:
        components:
          - name: dag-foundation
      chart: "."
      name: dag-dependent
      namespace: lifecycle-dag
      release:
        wait:
          strategy: legacy
      values:
        hooks:
          requiredDeployment: dag-foundation
          # The lifecycle DAG integration test explicitly opts into a live
          # cluster lookup; ordinary offline chart rendering leaves this off.
          validateDependency: true
