vars:
  stage: dev

# Native Helm lifecycle defaults for every Helm component in this stack.
helm:
  wait_strategy: watcher
  timeout: 2m
  max_history: 10
  skip_crds: true

components:
  emulator:
    kubernetes:
      driver: k3s
      ephemeral: true

  helm:
    demo:
      metadata:
        component: demo
      dependencies:
        tools:
          helm: "v3.21.2"
      # The chart reference. "." is the component directory itself
      # (components/helm/demo), which contains Chart.yaml.
      chart: "."
      namespace: demo
      wait_strategy: legacy
      rollback_on_failure: true
      cleanup_on_fail: true
      # Atmos `values:` are the Helm chart values, merged via Atmos inheritance.
      values:
        replicaCount: 2
        image:
          tag: "1.27"
        service:
          port: 8080
        tpl:
          source: from-stack
          expression: !literal "{{ .Values.tpl.source }}"

    demo-repo:
      metadata:
        component: demo
      dependencies:
        tools:
          helm: "v3.21.2"
      repositories:
        - name: local
          url: !env HELM_DEMO_REPO_URL
      chart: local/demo
      version: 0.1.0
      namespace: demo-repo
      values:
        replicaCount: 2
        image:
          tag: "1.27"
        service:
          port: 8080

    demo-jobs:
      metadata:
        component: demo
      chart: "."
      name: demo-jobs
      namespace: demo-jobs
      wait_for_jobs: true
      values:
        hooks:
          enabled: false
        job:
          enabled: true
          sleepSeconds: 3

    demo-no-hooks:
      metadata:
        component: demo
      chart: "."
      name: demo-no-hooks
      namespace: demo-no-hooks
      disable_chart_hooks: true

    demo-hook-only:
      metadata:
        component: demo
      chart: "."
      name: demo-hook-only
      namespace: demo-hook-only
      wait_strategy: hookOnly
      values:
        deployment:
          readinessGate: true

    demo-timeout:
      metadata:
        component: demo
      chart: "."
      name: demo-timeout
      namespace: demo-timeout
      wait_strategy: watcher
      timeout: 2s
      rollback_on_failure: true
      values:
        deployment:
          readinessDelaySeconds: 20
        hooks:
          enabled: false

    demo-install-fail:
      metadata:
        component: demo
      chart: "."
      name: demo-install-fail
      namespace: demo-install-fail
      wait_strategy: legacy
      rollback_on_failure: true
      cleanup_on_fail: true
      values:
        hooks:
          fail: true

    demo-upgrade-fail:
      metadata:
        component: demo
      dependencies:
        components:
          - name: demo
      chart: "."
      # Intentionally targets the already-installed demo release.
      name: demo
      namespace: demo
      wait_strategy: legacy
      rollback_on_failure: true
      cleanup_on_fail: true
      values:
        hooks:
          fail: true
        extraConfigMap:
          enabled: true

    dag-foundation:
      metadata:
        component: demo
        tags: [lifecycle-dag]
      chart: "."
      name: dag-foundation
      namespace: lifecycle-dag
      wait_strategy: legacy
      values:
        deployment:
          readinessDelaySeconds: 3
        hooks:
          readyMarker: true

    dag-dependent:
      metadata:
        component: demo
        tags: [lifecycle-dag]
      dependencies:
        components:
          - name: dag-foundation
      chart: "."
      name: dag-dependent
      namespace: lifecycle-dag
      wait_strategy: legacy
      values:
        hooks:
          requiredConfigMap: dag-foundation-ready
