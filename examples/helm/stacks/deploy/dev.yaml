vars:
  stage: dev

# Native Helm lifecycle defaults for every Helm component in this stack.
helm:
  wait_strategy: watcher
  timeout: 2m
  max_history: 10

components:
  emulator:
    kubernetes:
      driver: k3s
      ephemeral: true

  helm:
    demo:
      metadata:
        component: demo
      dependencies:
        tools:
          helm: "v3.21.2"
      # The chart reference. "." is the component directory itself
      # (components/helm/demo), which contains Chart.yaml.
      chart: "."
      namespace: demo
      rollback_on_failure: true
      cleanup_on_fail: true
      # Atmos `values:` are the Helm chart values, merged via Atmos inheritance.
      values:
        replicaCount: 2
        image:
          tag: "1.27"
        service:
          port: 8080

    demo-repo:
      metadata:
        component: demo
      dependencies:
        tools:
          helm: "v3.21.2"
      repositories:
        - name: local
          url: !env HELM_DEMO_REPO_URL
      chart: local/demo
      version: 0.1.0
      namespace: demo-repo
      values:
        replicaCount: 2
        image:
          tag: "1.27"
        service:
          port: 8080
