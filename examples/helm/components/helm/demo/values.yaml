# Default chart values. Atmos `values:` from the stack are merged on top of these.
replicaCount: 1
image:
  repository: nginx
  tag: "latest"
service:
  type: ClusterIP
  port: 80
deployment:
  readinessDelaySeconds: 0
job:
  enabled: false
  sleepSeconds: 0
hooks:
  enabled: true
  fail: false
  requiredConfigMap: ""
  readyMarker: false
extraConfigMap:
  enabled: false
