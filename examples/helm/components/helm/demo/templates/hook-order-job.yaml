{{- if .Values.hooks.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-hook-order
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: verify-weighted-configmap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/bin/sh", "-c", "test -f /hook-order/order"]
          volumeMounts:
            - name: hook-order
              mountPath: /hook-order
      volumes:
        - name: hook-order
          configMap:
            name: {{ default (printf "%s-hook-order" .Release.Name) .Values.hooks.requiredConfigMap }}
{{- end }}
