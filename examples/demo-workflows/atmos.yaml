base_path: "./"

components:
  terraform:
    base_path: "components"
    deploy_run_init: true
    auto_generate_backend_file: false

stacks:
  base_path: "stacks"
  included_paths:
    - "deploy/**/*"
  excluded_paths:
    - "**/_defaults.yaml"
  name_template: "{{.vars.stage}}"
workflows:
  base_path: "stacks/workflows"
