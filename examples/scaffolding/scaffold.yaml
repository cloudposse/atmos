apiVersion: atmos/v1
kind: AtmosScaffoldConfig
metadata:
  name: example
  description: Example scaffold template for demonstration
  author: Cloud Posse
  version: 1.0.0
spec:
  fields:
    - name: project_name
      label: Project name
      description: Name of the project
      type: input
      default: my-project
      required: true

    - name: terraform_version
      label: Terraform version
      description: Terraform version to pin in generated configuration
      type: input
      default: "1.5.0"

    - name: aws_region
      label: Default AWS region
      description: Default AWS region for generated configuration
      type: select
      default: us-east-1
      options:
        - us-east-1
        - us-west-2
        - eu-west-1
        - ap-southeast-1

    - name: enable_vendoring
      label: Enable component vendoring
      description: Whether to include a vendor.yaml manifest
      type: confirm
      default: true

    - name: vendor_version
      label: Vendor component version
      description: Immutable tag for the generated S3 bucket component
      type: input
      default: "1.536.0"
      when: "answers.enable_vendoring == true"

    - name: environments
      label: Extra environment stacks (optional)
      description: >-
        One stacks/<env>.yaml file is generated per selected environment, via
        spec.files[].matrix. Leave unselected to generate none.
      type: multiselect
      options:
        - dev
        - staging
        - prod
      default: []

    - name: extra_regions_csv
      label: Extra AWS regions (optional, comma-separated)
      description: >-
        Free text, not a multiselect with an author-enumerated options list --
        split into a matrix axis by Sprig's splitList (spec.files[].matrix).
        One regions/<region>.yaml file is generated per region entered, e.g.
        "us-east-1,us-west-2". Leave blank to generate none.
      type: input
      default: ""

  # Preset, non-interactive data (no matching `fields:` entry above -- nothing
  # to prompt for). Demonstrates a *computed* matrix axis: deploy_topology
  # maps each environment to the regions it deploys to, so both the
  # environment and region axes below are derived from this nested/structured
  # data via collectKeys rather than from a flat multiselect list.
  values:
    deploy_topology:
      dev:
        regions:
          us-east-1: {}
      staging:
        regions:
          us-east-1: {}
      production:
        regions:
          us-east-1: {}
          us-west-2: {}

  files:
    # vendor.yaml is only generated when vendoring is enabled; skip it otherwise.
    - path: vendor.yaml
      when: "answers.enable_vendoring == true"

    # environment.yaml is a single discovered template file; matrix expands it
    # into one generated file per selected environment (e.g. selecting
    # dev and staging -> stacks/dev.yaml, stacks/staging.yaml). Leaving
    # `environments` unselected (the default) resolves the axis to zero
    # values, so zero files are generated here -- matrix mirrors when:'s
    # existing silent-skip semantics rather than erroring.
    - path: environment.yaml
      target: "stacks/{{ .matrix.environment }}.yaml"
      matrix:
        environment: answers.environments

    # deploy.yaml demonstrates a *computed*, multi-axis matrix: neither
    # environment nor region is a flat multiselect answer -- both are derived
    # from the nested deploy_topology preset above via collectKeys, and
    # `when:` prunes the Cartesian product down to each environment's actual
    # regions (dev and staging deploy to one region, production to two), the
    # same worked example docs/prd/atmos-scaffold.md uses.
    - path: deploy.yaml
      target: "deploy/{{ .matrix.environment }}/{{ .matrix.region }}.yaml"
      matrix:
        environment: '{{ collectKeys answers.deploy_topology }}'
        region: '{{ collectKeys answers.deploy_topology "regions" }}'
      when: "matrix.region in answers.deploy_topology[matrix.environment].regions"

    # region.yaml demonstrates a *free-text* matrix axis: extra_regions_csv is
    # a plain `type: input` field, not constrained to an author-enumerated
    # `options:` list, split into the axis by Sprig's splitList. Leaving it
    # blank (the default) renders an empty-bracket expression that already
    # resolves to zero values -- the `when:` guard here makes that explicit
    # rather than relying on how an empty string happens to render.
    - path: region.yaml
      target: "regions/{{ .matrix.region }}.yaml"
      matrix:
        region: '{{ splitList "," answers.extra_regions_csv }}'
      when: 'matrix.region != ""'
