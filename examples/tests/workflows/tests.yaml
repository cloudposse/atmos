workflows:
  passing:
    description: Successful checks keep their logs hidden.
    show: &quiet
      header: false
      command: false
      labels: false
      count: false
      progress: false
    steps:
      - name: smoke-tests
        title: Post-deployment tests
        type: test
        steps:
          - name: fixtures
            type: require
            files: [checks/passing.sh]
          - name: health
            type: shell
            command: sh checks/passing.sh

  demo:
    description: A deliberate failure demonstrates logs, continuation, parallel, and matrix.
    show: *quiet
    steps:
      - name: smoke-tests
        title: Post-deployment tests
        type: test
        steps:
          - name: health
            type: shell
            command: sh checks/passing.sh
          - name: endpoints
            type: parallel
            max_concurrency: 2
            steps:
              - name: homepage
                type: shell
                command: sh checks/passing.sh
              - name: authentication
                type: shell
                command: sh checks/failing.sh
          - name: regions
            type: matrix
            matrix:
              region: [us-east-1, eu-west-1]
            max_concurrency: 2
            steps:
              - name: response
                type: shell
                command: 'echo "Checking {{ .matrix.region }}"; sleep 0.4'

  verbose:
    description: Show captured output for successful checks too.
    show: *quiet
    steps:
      - name: verbose-tests
        type: test
        output: all
        steps:
          - name: health
            type: shell
            command: sh checks/passing.sh
