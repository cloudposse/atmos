base_path: "./"

settings:
  experimental: warn

components:
  terraform:
    base_path: "components/terraform"
    command: tofu
    deploy_run_init: true
    auto_generate_backend_file: false
    platforms:
      - darwin_arm64
      - linux_amd64

stacks:
  base_path: "stacks"
  included_paths:
    - "deploy/**/*"
  excluded_paths:
    - "**/_defaults.yaml"
  name_template: "{{.vars.stage}}"
