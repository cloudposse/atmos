# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json

components:
  "aws/cloudformation":
    demo-generated:
      metadata:
        type: abstract
        component: demo
      stack_name: "atmos-cfn-generated-{{ .vars.stage }}"
      path: generated/template.yaml
      stack_policy:
        file: generated/stack-policy.json
      settings:
        aws_cloudformation:
          region: us-east-1
      # Atmos copies demo into an isolated workdir before writing these files.
      generate:
        generated/template.yaml:
          AWSTemplateFormatVersion: "2010-09-09"
          Description: Template generated from Atmos stack configuration.
          Resources:
            Marker:
              Type: AWS::SSM::Parameter
              Properties:
                Name: "/atmos/demo-generated/{{ .vars.stage }}/marker"
                Type: String
                Value: "hello generated from {{ .vars.stage }}"
          Outputs:
            ParameterName:
              Value:
                Ref: Marker
        generated/stack-policy.json:
          Statement:
            - Effect: Allow
              Action: "Update:*"
              Principal: "*"
              Resource: "*"
