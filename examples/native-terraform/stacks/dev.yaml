# Dev stack — keeps using existing .tfvars files via !include.
# Reference with: atmos terraform plan vpc -s dev
name: dev

import:
  - _defaults

vars:
  environment: dev

components:
  terraform:
    vpc:
      vars: !include ../components/terraform/vpc/envs/dev.tfvars
      # Per-component override: dev iterates quickly, so allow more concurrent
      # operations than the fleet-wide default.
      flags:
        parallelism: 4
