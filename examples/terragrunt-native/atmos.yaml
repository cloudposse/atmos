# Keep existing Terragrunt units in HCL; Atmos discovers them without stack YAML.
base_path: .

components:
  terraform:
    base_path: components/terraform
    command: tofu
    # Settings for the Terragrunt configuration provider. The provider itself comes from
    # plugins.packages.terragrunt; the `dev` profile supplies a local build (see profiles/dev).
    terragrunt:
      enabled: true
      mode: native
      discovery:
        enabled: true
        included_paths: [live/**]
