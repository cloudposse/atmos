base_path: "./"

toolchain:
  install_path: .tools
  use_lock_file: true
  registries:
    - name: aqua
      type: aqua
      priority: 100

components:
  terraform:
    command: tofu
    base_path: "components/terraform"
    deploy_run_init: true
    auto_generate_backend_file: false

stacks:
  base_path: "stacks"
  included_paths:
    - "deploy/**/*"
  excluded_paths:
    - "**/_defaults.yaml"
  name_template: "{{.vars.stage}}"
