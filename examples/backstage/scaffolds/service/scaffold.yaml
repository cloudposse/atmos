apiVersion: atmos/v1
kind: AtmosScaffoldConfig
metadata:
  name: backstage-service
spec:
  fields:
    - name: service_name
      type: input
      required: true
      validation:
        pattern: "^[a-z][a-z0-9-]{1,28}[a-z0-9]$"
  files:
    - path: stack.yaml.tmpl
      target: "stacks/deploy/services/{{ .Config.service_name }}.yaml"
    - path: catalog.yaml.tmpl
      target: "catalog/{{ .Config.service_name }}.yaml"
