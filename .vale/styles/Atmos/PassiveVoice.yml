# Flags likely passive-voice constructions. ASD-STE100 prefers active voice
# ("the system deletes the file", not "the file is deleted by the system")
# because naming the actor usually removes ambiguity.
#
# The irregular-participle list below is adapted (with the `raw`/`tokens`
# split) from Vale's official Google and Microsoft style packages
# (github.com/errata-ai/Google, github.com/errata-ai/Microsoft, both
# MIT-licensed) -- their comprehensive participle list catches irregular
# verbs ("written", "given", "known") our earlier `\w+en\b` regex missed
# unevenly. Unrelated to the ASD-STE100 copyright restriction: this is a
# different, permissively-licensed source, reused with attribution.
#
# Treat a finding here as something to fix. Passive voice is easy to write
# by accident and it hides the actor, which is exactly the ambiguity this
# style exists to remove. The default response is to name the actor.
#
# The exception is real but narrow: keep the passive form when the actor is
# genuinely unknown or genuinely beside the point ("no third-party action
# is involved" reads better than any active rewrite). Do not invent an
# actor just to silence the rule. That exception covers a minority of
# findings, so do not read it as general permission to skip them.
extends: existence
message: "'%s' is passive. Name the actor: \"Atmos writes the file\", not \"the file is written\". Keep the passive form only when the actor is genuinely unknown or beside the point."
level: suggestion
ignorecase: true
raw:
  - \b(?:am|are|were|being|is|been|was|be)\b\s*
