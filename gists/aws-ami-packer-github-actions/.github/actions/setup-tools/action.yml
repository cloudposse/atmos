name: Setup Tools
description: Install pinned versions of Atmos and Packer for the AMI pipeline.

inputs:
  atmos-version:
    description: Atmos version to install.
    required: false
    default: "1.220.0"
  packer-version:
    description: Packer version to install.
    required: false
    default: "1.15.3"

runs:
  using: composite
  steps:
    - name: Install Atmos
      uses: cloudposse/github-action-setup-atmos@822766b3aaa9a3b4aa2628baaccb58dd576ad0ff # v2
      with:
        atmos-version: ${{ inputs.atmos-version }}

    - name: Install Packer
      uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3
      with:
        version: ${{ inputs.packer-version }}

    # The Amazon plugin is declared in the Packer template's required_plugins
    # block. `atmos packer init` installs it before the build.
    - name: Show tool versions
      shell: bash
      run: |
        atmos version
        packer version
