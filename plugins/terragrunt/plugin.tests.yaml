version: 1
steps:
  - name: native-unit-tests
    type: script
    interpreter: starlark
    script: |
      exec.run(["go", "test", "-p=2", "./..."])
      exec.run(["go", "test", "-p=2", "./..."], working_directory=fs.resolve("bridge"))
  - name: affected-revisions
    type: script
    interpreter: starlark
    script: |
      affected = module.load("scripts/affected.star")
      affected.main()
  - name: installed-release
    type: script
    interpreter: starlark
    script: |
      release = module.load("scripts/release.star")
      release.main()
