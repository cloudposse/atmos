version: 1
steps:
  - name: native-unit-tests
    type: script
    interpreter: starlark
    script: |
      exec.run(["go", "test", "-p=2", "./..."])
      exec.run(["go", "test", "-p=2", "./..."], working_directory=fs.resolve("bridge"))
  - name: affected-revisions
    type: script
    interpreter: starlark
    script: |
      affected = module.load("scripts/affected.star")
      affected.main()
  - name: installed-release
    type: script
    interpreter: starlark
    script: |
      release = module.load("scripts/release.star")
      release.main()
integration:
  - name: native-lifecycle
    type: script
    source: scripts/native.star
  - name: hooks-and-extra-arguments
    type: script
    interpreter: starlark
    script: |
      lifecycle = module.load("scripts/lifecycle_extended.star")
      lifecycle.hooks()
  - name: saved-plan
    type: script
    interpreter: starlark
    script: |
      lifecycle = module.load("scripts/lifecycle_extended.star")
      lifecycle.saved_plan()
  - name: state-and-output-integration
    type: script
    interpreter: starlark
    script: |
      lifecycle = module.load("scripts/lifecycle_extended.star")
      lifecycle.state_and_outputs()
  - name: git-source-refresh
    type: script
    interpreter: starlark
    script: |
      lifecycle = module.load("scripts/lifecycle_extended.star")
      lifecycle.git_source_refresh()
  - name: local-source-refresh
    type: script
    interpreter: starlark
    script: |
      lifecycle = module.load("scripts/lifecycle_extended.star")
      lifecycle.local_source_refresh()
  - name: imports-and-discovery
    type: script
    interpreter: starlark
    script: |
      imports = module.load("scripts/imports.star")
      imports.imports_and_discovery()
  - name: stack-overrides
    type: script
    interpreter: starlark
    script: |
      imports = module.load("scripts/imports.star")
      imports.stack_overrides()
  - name: stack-pinned-tools
    type: script
    interpreter: starlark
    script: |
      imports = module.load("scripts/imports.star")
      imports.stack_pinned_tools()
  - name: diagnostics
    type: script
    interpreter: starlark
    script: |
      diagnostics = module.load("scripts/diagnostics.star")
      diagnostics.diagnostics()
  - name: settings-repair
    type: script
    interpreter: starlark
    script: |
      diagnostics = module.load("scripts/diagnostics.star")
      diagnostics.settings_repair()
  - name: saved-plan-lifecycle
    type: script
    interpreter: starlark
    script: |
      hardening = module.load("scripts/hardening.star")
      hardening.saved_plan_lifecycle()
  - name: local-source-stability
    type: script
    interpreter: starlark
    script: |
      hardening = module.load("scripts/hardening.star")
      hardening.local_source_stability()
  - name: generation-lifecycle
    type: script
    interpreter: starlark
    script: |
      hardening = module.load("scripts/hardening.star")
      hardening.generation_lifecycle()
  - name: state-identity-warning
    type: script
    interpreter: starlark
    script: |
      hardening = module.load("scripts/hardening.star")
      hardening.cache_state_warning()
  - name: hook-semantics
    type: script
    interpreter: starlark
    script: |
      hardening = module.load("scripts/hardening.star")
      hardening.hook_semantics()
  - name: pinned-tools
    type: script
    interpreter: starlark
    script: |
      hardening = module.load("scripts/hardening.star")
      hardening.pinned_tools()
