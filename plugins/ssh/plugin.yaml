apiVersion: atmos/v1
kind: AtmosPluginConfig
metadata:
  name: cloudposse/ssh
  version: 0.1.0
  display_name: SSH keys
  description: Make an SSH key held in the machine's security hardware an Atmos identity, serve it through a per-identity agent, and sign Git commits with it
  author: Cloud Posse
  repository: https://github.com/cloudposse/atmos
spec:
  runtime:
    type: native
    protocol: 1
    executable: bin/plugin.exe
  platforms:
    linux/amd64:
      executable: bin/linux-amd64/plugin
    linux/arm64:
      executable: bin/linux-arm64/plugin
    darwin/amd64:
      executable: bin/darwin-amd64/plugin
    darwin/arm64:
      executable: bin/darwin-arm64/plugin
    windows/amd64:
      executable: bin/windows-amd64/plugin.exe
    windows/arm64:
      executable: bin/windows-arm64/plugin.exe
  compatibility:
    protocol: '>=1 <2'
    contracts:
      auth.provider: '>=1'
      auth.identity: '>=1'
      command: '>=1'
  capabilities:
    commands:
      ssh:
        description: Manage SSH keys and the agent that serves them
        schema: schemas/command.json
    auth:
      providers:
        ssh/self:
          schema: schemas/ssh-self.json
          credentials: [secret-values/v1]
          features: [logout]
      identities:
        ssh/key:
          schema: schemas/ssh-key.json
          schema_target: spec
          accepts: [secret-values/v1]
          credentials: [environment/v1]
          features: [logout]
