commands:
  - name: dev
    description: Development workflow commands for Atmos development
    commands:
      - name: checks-build
        description: Build Atmos with native Git sandbox support outside commit time
        working_directory: !repo-root .
        steps:
          - type: script
            interpreter: starlark
            script: |
              exec.run(["go", "build", "-o", "build/", "."], env = {"CGO_ENABLED": "0"})

      - name: setup
        description: Prepare pinned check tools and install the Atmos Git hook
        working_directory: !repo-root .
        steps:
          - type: atmos
            command: build deps
          - type: atmos
            command: dev checks-build
          - type: script
            interpreter: starlark
            script: |
              gobin = fs.resolve("build/check-tools")
              exec.run(["go", "install", "mvdan.cc/gofumpt@v0.9.1"], env = {"GOBIN": gobin})
              exec.run(["go", "install", "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0"], env = {"GOBIN": gobin})
              exec.run(["go", "install", "github.com/zricethezav/gitleaks/v8@v8.30.1"], env = {"GOBIN": gobin})
              suffix = ".exe" if exec.run(["go", "env", "GOOS"], output = "capture").stdout.strip() == "windows" else ""
              version = exec.run(["go", "env", "GOVERSION"], output = "capture").stdout.strip()
              exec.run([gobin + "/golangci-lint" + suffix, "custom"], env = {"GOFLAGS": "-buildvcs=false", "GOTOOLCHAIN": version})
              binary = "build/atmos.exe" if fs.exists("build/atmos.exe") else "build/atmos"
              exec.run([fs.resolve(binary), "git", "hooks", "install", "pre-commit"])
              ui.success("Atmos Git hook installed with pinned tools in " + gobin + ".")
              ui.info("Use atmos check staged for read-only checks or atmos format staged to apply fixes.")

      - name: build
        description: Build the Atmos binary
        steps:
          - atmos build

      - name: shell
        description: Start a development shell with build/ first on PATH
        # Custom commands install only explicitly declared dependencies. Keep
        # this in sync with the development tool pins in .tool-versions so a
        # fresh `atmos dev shell` is immediately usable after cache cleanup.
        dependencies:
          tools:
            hashicorp/terraform: 1.15.6
            opentofu/opentofu: 1.12.2
            peteretelej/tree: v1.3.0
            sharkdp/bat: v0.26.1
            tofu: v1.11.6
        working_directory: !repo-root .
        steps:
          - type: script
            interpreter: starlark
            script: |
              ui.info("Entering the **development shell**, with `build/` first on `PATH`.\nRun `exit` to return.")
          - type: exec
            command: |
              set -eu
              export ATMOS_DEV_SHELL=1
              export PATH="$PWD/build:$PATH"
              exec "${SHELL:-/bin/sh}"

      - name: validate
        description: Validate code by running build, lint, and tests
        env: &go_auto_env
          GOTOOLCHAIN: auto
        steps:
          - type: toast
            level: info
            content: Building...
          - type: atmos
            command: build
          - type: toast
            level: info
            content: Linting...
          - |
            set -eu
            if ! command -v golangci-lint >/dev/null 2>&1; then
              echo "golangci-lint not found; run 'atmos dev setup' first."
              exit 1
            fi
            golangci-lint run --config=.golangci.yml
          - type: toast
            level: info
            content: Testing...
          - type: atmos
            command: test short
          - type: toast
            level: success
            content: Validation complete.

      - name: quick
        description: Quick build and test
        env: *go_auto_env
        steps:
          - type: toast
            level: info
            content: Running quick build and test...
          - type: atmos
            command: build
          - type: atmos
            command: test short
          - type: toast
            level: success
            content: Quick check complete.

      - name: coverage
        description: Run tests with coverage report
        steps:
          - atmos test coverage

      - name: generate
        description: Generate development artifacts
        commands:
          - name: notices
            description: Regenerate NOTICE from Go dependency licenses
            working_directory: !repo-root .
            env: *go_auto_env
            steps:
              - type: spin
                title: Generating NOTICE from Go dependency licenses
                command: go tool mage notice:generate
                timeout: 10m
              - type: toast
                level: success
                content: NOTICE regenerated.

          - name: mocks
            description: Regenerate auth/http/store mocks using go:generate directives
            env: *go_auto_env
            steps:
              - type: atmos
                command: test generate-auth-http-store-mocks

          - name: snapshots
            description: Regenerate CLI golden snapshots
            working_directory: !repo-root .
            env:
              - key: GOTOOLCHAIN
                value: auto
              - key: ATMOS_SNAPSHOT_FILTER
                value: "{{ .Flags.filter }}"
            flags:
              - name: all
                type: bool
                description: Regenerate all CLI golden snapshots
                default: false
              - name: filter
                type: string
                description: Go test -run regex for focused CLI snapshot regeneration
                default: ""
            steps:
              - type: shell
                command: |
                  set -eu
                  filter="${ATMOS_SNAPSHOT_FILTER:-}"

                  selected=0
                  [ "{{ .Flags.all }}" = "true" ] && selected=$((selected + 1))
                  [ -n "$filter" ] && selected=$((selected + 1))

                  if [ "$selected" -ne 1 ]; then
                    echo "Usage: atmos dev generate snapshots --all" >&2
                    echo "   or: atmos dev generate snapshots --filter '<go-test-run-regex>'" >&2
                    echo "Select exactly one of --all or --filter." >&2
                    exit 1
                  fi

                  if [ "{{ .Flags.all }}" = "true" ]; then
                    go test ./tests -v -count=1 -timeout 40m -regenerate-snapshots
                  else
                    go test ./tests -v -count=1 -timeout 40m -run "$filter" -regenerate-snapshots
                  fi

          - name: schema
            description: Regenerate the atmos-manifest JSON Schema website copy from the embedded schema
            working_directory: !repo-root .
            env:
              <<: *go_auto_env
              # go run . builds the whole atmos binary graph, which pulls in cgo-linked
              # hardware-security-key deps (e.g. github.com/bearsh/hid) that need system
              # libudev headers most CI runners don't have. atmos itself always builds
              # with CGO disabled (see .goreleaser.yml, magefiles/build.go), so match
              # that here too.
              CGO_ENABLED: "0"
              SCHEMA_OUTPUT: website/static/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json
            steps:
              - type: spin
                title: Generating atmos-manifest schema
                command: go run . stack schema {{ .env.SCHEMA_OUTPUT }}
                timeout: 2m
              - type: toast
                level: success
                content: atmos-manifest schema regenerated at {{ .env.SCHEMA_OUTPUT }}.
